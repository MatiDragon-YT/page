  orbitAngle: 0,            // ⬅️ ángulo actual en la órbita
  orbitRadius: 0,           // ⬅️ radio actual
  orbitRadiusTarget: 0      // ⬅️ radio objetivo (converge suavemente)
});

let weatherTransitionSpeed = 0.25;

/* =========================================================
   VIENTO DIRECCIONAL
   Ráfagas con dirección dominante que duran varios segundos.
   ========================================================= */
const windState = {
  direction: 0,        // -1 = izquierda, 0 = calma, 1 = derecha (suavizado)
  strength: 0,         // 0 a 1 (suavizado)
  targetDir: 0,
  targetStr: 0,
  nextChange: 0
};

function scheduleWindGust(){
  const now = performance.now();
  windState.nextChange = now + rnd(4000, 12000);

  const roll = Math.random();
  if(roll < 0.40){
    // Calma
    windState.targetDir = 0;
    windState.targetStr = rnd(0, 0.15);
  } else if(roll < 0.70){
    // Izquierda
    windState.targetDir = -1;
    windState.targetStr = rnd(0.35, 1.0);
  } else {
    // Derecha
    windState.targetDir = 1;
    windState.targetStr = rnd(0.35, 1.0);
  }
}

function updateWindState(dt){
  const now = performance.now();
  if(windState.nextChange === 0) scheduleWindGust();
  if(now >= windState.nextChange) scheduleWindGust();

  // Suavizado exponencial con inercia: tarda ~2s en llegar al objetivo
  const k = 1 - Math.exp(-dt / 1.8);
  windState.direction += (windState.targetDir - windState.direction) * k;
  windState.strength += (windState.targetStr - windState.strength) * k;
}

/* =========================================================
   VÓRTICES DE TORMENTA
   Aparecen cuando la intensidad pasa cierto umbral y arrastran
   las partículas del clima en círculos.
   ========================================================= */
const vortices = {
  list: [],
  targetCount: 0,
  lastCheck: 0
};
let vortexIdCounter = 0;

// Viento oscilante global (se suma al movimiento base)
let windPhaseX = Math.random() * 1000;
let windPhaseY = Math.random() * 1000;

function updateVortexCount(intensity){
  if(intensity < 0.55)      vortices.targetCount = 0;
  else if(intensity < 0.72) vortices.targetCount = 1;
  else if(intensity < 0.88) vortices.targetCount = 2;
  else                      vortices.targetCount = 3;
}

function spawnVortex(W, H){
  const cxc = rnd(W * 0.15, W * 0.85);
  const cyc = rnd(H * 0.10, H * 0.60);
  const maxR = rnd(60, 130);
  const life = rnd(3.5, 6.5);
  return {
	id: ++vortexIdCounter,
    x: cxc, y: cyc,
    maxR,
    r: 0,                  // radio actual (crece y decrece)
    life: 0,
    maxLife: life,
    dir: Math.random() < 0.5 ? 1 : -1,   // sentido de giro
    strength: rnd(0.65, 1.15),
    phase: Math.random() * 6.28,
    xDrift: rnd(-10, 10),  // deriva lenta horizontal
    yDrift: rnd(-4, 4)
  };
}

function updateVortices(dt, W, H, intensity){
  updateVortexCount(intensity);

  // Spawn: aparecen de a uno cada tanto
  const now = performance.now();
  if(vortices.list.length < vortices.targetCount && now - vortices.lastCheck > 350){
    vortices.list.push(spawnVortex(W, H));
    vortices.lastCheck = now;
  }

  // Update
  for(let i = vortices.list.length - 1; i >= 0; i--){
    const v = vortices.list[i];
    v.life += dt;
    v.x += v.xDrift * dt;
    v.y += v.yDrift * dt;

    // Envolvente de vida: sube en 20%, mantiene, baja en 30%
    const t = v.life / v.maxLife;
    let env;
    if(t < 0.20)      env = t / 0.20;
    else if(t < 0.70) env = 1;
    else              env = 1 - (t - 0.70) / 0.30;
    env = Math.max(0, env);

    // Radio: crece rápido al principio y se estabiliza
    v.r = v.maxR * Math.min(1, t / 0.25);
    v.currentStrength = v.strength * env;

    // Despawn: murió o ya hay más de los que debería
    if(v.life >= v.maxLife || vortices.list.length > vortices.targetCount){
      vortices.list.splice(i, 1);
    }
  }
}

/**
 * Avanza una partícula de clima.
 * Devuelve true si la partícula está orbitando un vórtice (y ya actualizó d.x/d.y).
 * Devuelve false si debe usar la caída normal (la maneja drawWeatherParticles).
 */
function stepWeatherParticle(d, dt, intensity, W, H){
  // ---- Buscar el vórtice dominante (el de mayor falloff) ----
  let bestV = null, bestFalloff = 0;
  if(vortices.list.length){
    const px = d.x * W, py = d.y * H;
    for(const v of vortices.list){
      const dx = px - v.x, dy = py - v.y;
      const dist2 = dx*dx + dy*dy;
      const r2 = v.r * v.r;
      if(dist2 > r2 || dist2 < 4) continue;
      const dist = Math.sqrt(dist2);
      const falloff = 1 - dist / v.r;
      if(falloff > bestFalloff){ bestFalloff = falloff; bestV = v; }
    }
  }

  // ---- Fuera de vórtices: caída normal + viento direccional ----
  if(!bestV || bestV.currentStrength < 0.12){
    d.attachedVortex = null;

    // Viento direccional: converge suavemente hacia el valor objetivo.
    // El factor 240 es la velocidad máxima en px/s cuando strength=1 e intensity=1.
    const targetVx = windState.direction * windState.strength * 240 * intensity;
    d.vx += (targetVx - d.vx) * Math.min(1, 1.6 * dt);

    // Pequeño movimiento vertical oscilante (le da "cuerpo" a las ráfagas)
    const targetVy = Math.sin(performance.now() * 0.0007) * 30 * intensity * windState.strength;
    d.vy += (targetVy - d.vy) * Math.min(1, 0.8 * dt);

    return false;
  }

  // ---- Dentro de un vórtice: órbita trigonométrica pura ----
  const px = d.x * W, py = d.y * H;

  // Si acaba de entrar, capturar ángulo y radio actuales
  if(d.attachedVortex !== bestV.id){
    d.attachedVortex = bestV.id;
    d.orbitAngle = Math.atan2(py - bestV.y, px - bestV.x);
    d.orbitRadius = Math.max(8, Math.hypot(px - bestV.x, py - bestV.y));
    // Radio objetivo: entre 30% y 55% del radio del vórtice
    d.orbitRadiusTarget = bestV.r * (0.30 + Math.random() * 0.25);
  }

  // Velocidad angular: más rápida cerca del centro (w = v/r)
  const tangentialSpeed = 90 + 280 * bestFalloff;   // px/s
  const omega = bestV.dir * tangentialSpeed / Math.max(24, d.orbitRadius);
  d.orbitAngle += omega * dt;

  // El radio converge suavemente hacia el objetivo
  d.orbitRadius += (d.orbitRadiusTarget - d.orbitRadius) * Math.min(1, 2.2 * dt);
  // Pequeña oscilación para que no se vea mecánico
  const wobble = Math.sin(d.orbitAngle * 1.7) * 4;
  const r = Math.max(8, d.orbitRadius + wobble);

  // Posición final sobre el círculo
  const nx = bestV.x + Math.cos(d.orbitAngle) * r;
  const ny = bestV.y + Math.sin(d.orbitAngle) * r;

  // Velocidad aparente (derivada numérica), por si el modo la necesita para estirar la partícula
  d.vx = -Math.sin(d.orbitAngle) * omega * r;
  d.vy =  Math.cos(d.orbitAngle) * omega * r;

  d.x = nx / W;
  d.y = ny / H;

  return true;
}

/* ===== ESTADO DEL CLIMA: capturar / aplicar / randomizar ===== */
function captureWeatherState(){
  return {
    worldTime: worldTime,
    rainAmt: rainAmt,
    rainTarget: rainTarget,
    rainTimer: rainTimer,
    weatherTransitionSpeed: weatherTransitionSpeed
  };
}

function applyWeatherState(w){
  if(!w) return;

  if(typeof w.worldTime === 'number')              worldTime = w.worldTime;
  if(typeof w.rainAmt === 'number')                rainAmt = clamp(w.rainAmt, 0, 1);
  if(typeof w.rainTarget === 'number')             rainTarget = clamp(w.rainTarget, 0, 1);
  if(typeof w.rainTimer === 'number')              rainTimer = Math.max(0, w.rainTimer);
  if(typeof w.weatherTransitionSpeed === 'number') weatherTransitionSpeed = clamp(w.weatherTransitionSpeed, 0.05, 1);

  // Limpiar rayos activos
  if(typeof lightning !== 'undefined') lightning.strikes.length = 0;

  // Resetear suavizados de audio para que arranquen coherentes con el estado nuevo
  if(typeof ambience !== 'undefined' && ambience.started){
    ambience.rainLevel  = rainAmt * 0.9;
    ambience.nightLevel = 0;   // el loop lo sube o baja rápido
    ambience.lastUpdate = performance.now();
  }
  // Resetear generadores orgánicos
  if(typeof org !== 'undefined'){
    org.wind.level = 0;  org.wind.target = 0;  org.wind.nextChange = 0;
    org.rainWobble.level = 0.85; org.rainWobble.target = 0.85; org.rainWobble.nextChange = 0;
    org.crickets.level = 0;  org.crickets.target = 0;  org.crickets.nextChange = 0;
  }
	// Resetear vortices
	vortices.list.length = 0;
	vortices.targetCount = 0;
	windPhaseX = Math.random() * 1000;
	windPhaseY = Math.random() * 1000;
	// Resetear vientos
	windState.direction = 0;
	windState.strength = 0;
	windState.targetDir = 0;
	windState.targetStr = 0;
	windState.nextChange = 0;
}

function randomizeWeatherForNewGame(){
  // Día aleatorio dentro del ciclo (amanecer, día, atardecer o noche)
  worldTime = Math.random() * CYCLE_SECONDS;

  // Clima aleatorio con la misma distribución que el scheduler
  const r = Math.random();
  if(r < 0.55)      rainTarget = 0;
  else if(r < 0.75) rainTarget = rnd(0.05, 0.30);   // llovizna
  else if(r < 0.90) rainTarget = rnd(0.30, 0.60);   // lluvia moderada
  else              rainTarget = rnd(0.60, 1.00);   // tormenta

  // La lluvia actual arranca a medio camino del target — así si va a llover,
  // ya se ve algo de lluvia al empezar, sin el "pop" de la transición.
  rainAmt = rainTarget * rnd(0.25, 0.65);
  rainTimer = rnd(4, 20);                                    // próximo cambio en 4-20 s
  weatherTransitionSpeed = 0.12 + Math.random() * 0.42;      // ritmo de transición variado

  // Limpiar rayos activos
  if(typeof lightning !== 'undefined') lightning.strikes.length = 0;

  // Resetear suavizados de audio y generadores orgánicos
  if(typeof ambience !== 'undefined' && ambience.started){
    ambience.rainLevel  = rainAmt * 0.9;
    ambience.nightLevel = 0;
    ambience.lastUpdate = performance.now();
  }
  if(typeof org !== 'undefined'){
    org.wind.level = 0;  org.wind.target = 0;  org.wind.nextChange = 0;
    org.rainWobble.level = 0.85; org.rainWobble.target = 0.85; org.rainWobble.nextChange = 0;
    org.crickets.level = 0;  org.crickets.target = 0;  org.crickets.nextChange = 0;
  }
	// Resetear vortices
	vortices.list.length = 0;
	vortices.targetCount = 0;
	windPhaseX = Math.random() * 1000;
	windPhaseY = Math.random() * 1000;
	// Resetear vientos
	windState.direction = 0;
	windState.strength = 0;
	windState.targetDir = 0;
	windState.targetStr = 0;
	windState.nextChange = 0;
}

function updateWeather(dt){
  rainTimer -= dt;
  if(rainTimer <= 0){
    // Intervalos más irregulares (2-40s en vez de 12-30s)
    rainTimer = rnd(2, 40);
    const r = Math.random();
    // Distribución más variada: 50% seco, 22% llovizna, 15% media, 13% tormenta
    if(r < 0.50)      rainTarget = 0;

    weatherTransitionSpeed = 0.10 + Math.random() * 0.55;
  }
  rainAmt = lerp(rainAmt, rainTarget, dt * weatherTransitionSpeed);
}

/* =========================================================
   AJEDREZ
   ========================================================= */
const pieceEls = new Map();
/* =========================================================
   COORDENADAS — chess-internal (nunca cambian) vs visual (con flip)
   ========================================================= */
let flipBoard = false;   // true → negras abajo

// Chess-internal: cómo chess.js indexa el tablero.
// board[r][c] con r=0 → rank 8, c=0 → file a
function sqToRC(sq){ return { r: 8 - parseInt(sq[1],10), c: sq.charCodeAt(0) - 97 }; }
function rcToSquare(r,c){ return String.fromCharCode(97+c) + (8-r); }

// Visual: cómo se ve en pantalla según flipBoard.
// Con flip, rotamos 180°: la casilla a1 pasa a estar arriba-derecha.
function sqToVisualRC(sq){
  const { r, c } = sqToRC(sq);
  if(flipBoard) return { r: 7 - r, c: 7 - c };
  return { r, c };
}
function visualRCToSquare(r, c){
  if(flipBoard) return rcToSquare(7 - r, 7 - c);
  return rcToSquare(r, c);
}

function squareCenter(sq){ 
  const {r,c} = sqToVisualRC(sq); 
  return { x: (c+0.5)*cellSize, y: (r+0.5)*cellSize }; 
}

function buildGrid(){
  gridEl.innerHTML = '';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.sq = visualRCToSquare(r, c);   // ⬅️ CAMBIO
    gridEl.appendChild(d);
  }
}
// Reasigna el data-sq de cada celda según el flip actual.
// Necesario porque buildGrid() corre una sola vez al arrancar.
function applyGridFlip(){
  const cells = gridEl.children;
  let i = 0;
  for(let r = 0; r < 8; r++){
    for(let c = 0; c < 8; c++){
      cells[i++].dataset.sq = visualRCToSquare(r, c);
    }
  }
}

function createPieceEl(p, sq){
  const el = document.createElement('div');
  el.className = 'piece ' + (p.color === 'w' ? 'white' : 'black');
  el.dataset.code = p.color + p.type;
  const tok = document.createElement('div');
  tok.className = 'tok'; tok.textContent = GLYPH[p.type];
  el.appendChild(tok);
  const {r,c} = sqToVisualRC(sq);   // ⬅️ CAMBIO
  el.style.transform = `translate(${c*cellSize}px, ${r*cellSize}px)`;
  el.style.width = cellSize + 'px'; el.style.height = cellSize + 'px';
  piecesEl.appendChild(el); return el;
}
function positionPiece(el, sq){
  const {r,c} = sqToVisualRC(sq);   // ⬅️ CAMBIO
  el.style.transform = `translate(${c*cellSize}px, ${r*cellSize}px)`;
  el.style.width = cellSize + 'px'; el.style.height = cellSize + 'px';
}
function updatePieceClass(el, p, sq){
  const code = p.color + p.type;
  el.classList.toggle('white', p.color === 'w');
  el.classList.toggle('black', p.color === 'b');
  const tok = el.querySelector('.tok');
  if(tok && tok.textContent !== GLYPH[p.type]) tok.textContent = GLYPH[p.type];
  el.dataset.code = code;
  const shielded = !replay.active && state.shields[p.color].includes(sq);
const weakened = shielded && (state.shieldHits[p.color][sq] || 2) <= 1;
const iraReady = !replay.active && state.iraCharge[p.color] && 'nrb'.includes(p.type);
el.classList.toggle('shielded', shielded);
el.classList.toggle('shielded-weak', weakened);   // ⬅️ FALTA
el.classList.toggle('ira', iraReady);
  const inCheck = !replay.active && p.type === 'k' && chess && chess.turn() === p.color && chess.in_check();
  el.classList.toggle('in-check', inCheck);
}
function syncPieces(){
  const board = chess.board();
  const seen = new Set();

  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p) continue;
    const sq = rcToSquare(r,c);
    seen.add(sq);
    let el = pieceEls.get(sq);

    if(!el){
      // *** FIX: si hay un elemento ANIMANDO cuyo destino es esta casilla,
      // reclamarlo en vez de crear otro ***
      let claimed = null;
      for(const [k, v] of pieceEls){
        if(animatingEls.has(v) && v.dataset.pendingTo === sq){ claimed = v; break; }
      }
      if(claimed){
        el = claimed;
        pieceEls.set(sq, el);
      } else {
        el = createPieceEl(p, sq);
        pieceEls.set(sq, el);
        el.classList.add('spawn');
        setTimeout(()=>el.classList.remove('spawn'), 400);
      }
    } else if(!animatingEls.has(el)){
      // Solo reposicionar si NO está animando
      positionPiece(el, sq);
    }
    updatePieceClass(el, p, sq);
  }

  for(const sq of [...pieceEls.keys()]){
    if(!seen.has(sq)){
      const el = pieceEls.get(sq);
      if(el && !animatingEls.has(el)){
        el.remove();
        pieceEls.delete(sq);
      }
      // si está animando, no lo borramos: lo dejamos terminar
    }
  }

  piecesEl.style.setProperty('--cs', cellSize + 'px');
}
function rebuildPieces(){
  pieceEls.forEach(el => el.remove());
  pieceEls.clear();
  const board = chess.board();
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p) continue;
    const sq = rcToSquare(r,c);
    const el = createPieceEl(p, sq);
    pieceEls.set(sq, el);
    updatePieceClass(el, p, sq);
  }
  piecesEl.style.setProperty('--cs', cellSize + 'px');
}
const animatingEls = new Set();
async function animateMove(from, to, capturedSquare, duration = 200){
  let el = pieceEls.get(from);
  if(!el){
    console.warn('[animateMove] elemento perdido en', from, '→ rebuild');
    rebuildPieces();
    return;
  }

  animatingEls.add(el);
  try {
    const targetEl = capturedSquare ? pieceEls.get(capturedSquare) : pieceEls.get(to);
    pieceEls.delete(from);
    if(targetEl) pieceEls.delete(capturedSquare || to);
    pieceEls.set(to, el);
    el.dataset.pendingTo = to;
    spawnDust(from, to);

    // *** Si venimos de un drag, la animación arranca desde el punto del drop ***
    if(pendingDragDropStart){
      const { x, y } = pendingDragDropStart;
      pendingDragDropStart = null;

      // 1. Colocar la pieza en el punto exacto donde se soltó el fantasma
      el.style.transition = 'none';
      el.style.transform = `translate(${x - cellSize/2}px, ${y - cellSize/2}px)`;

      // 2. Forzar reflow y eliminar el fantasma en el mismo tick
      el.getBoundingClientRect();
      if(pendingGhostToRemove){
        pendingGhostToRemove.remove();
        pendingGhostToRemove = null;
      }

      // 3. Restaurar transición y animar hacia el destino
      if(duration !== 200){
        el.style.transition = `transform ${duration}ms cubic-bezier(.18,.75,.28,1)`;
      } else {
        el.style.transition = '';
      }
      // Esperar un frame para que la transición tome el valor de partida
      await new Promise(r => requestAnimationFrame(r));
      positionPiece(el, to);

    } else {
      // --- Camino normal (click / IA / poderes) ---
      if(duration !== 200){
        el.style.transition = `transform ${duration}ms cubic-bezier(.18,.75,.28,1)`;
      } else {
        el.style.transition = '';
      }
      el.getBoundingClientRect();
      positionPiece(el, to);
    }

    if(targetEl){
      setTimeout(()=>{
        targetEl.classList.add('captured');
        setTimeout(()=>targetEl.remove(), 280);
      }, Math.min(120, duration * 0.3));
    }

    await sleep(duration);
    positionPiece(el, to);
  } finally {
    animatingEls.delete(el);
  }
}
function movePieceOnBoard(from, to){
  const piece = chess.get(from);
  if(!piece || chess.get(to)) return false;
  chess.remove(from);
  try { return chess.put(piece, to); } catch(e){ return false; }
}
function removePieceOnBoard(sq){
  const piece = chess.get(sq);
  if(!piece) return null;
  chess.remove(sq); return piece.type;
}
function placePieceOnBoard(sq, color, type){
  if(chess.get(sq)) return false;
  try { return chess.put({ type, color }, sq); } catch(e){ return false; }
}
function switchTurnInFen(){
  const parts = chess.fen().split(' ');
  parts[1] = parts[1] === 'w' ? 'b' : 'w';
  parts[3] = '-'; parts[4] = '0';
  const fen = parts.join(' ');
  try { const ok = chess.load(fen, { skipValidation: true }); if(ok !== false) return; } catch(e){}
  try { chess.load(fen); } catch(e){}
}
function addToGraveyard(capturedType, capturedColor){
  if(!capturedType || !capturedColor) return;
  if(!state.graveyard[capturedColor]) return;
  state.graveyard[capturedColor].push(capturedType);
}
function removeShield(color, sq){

}
function validateAndFixBoard(){

function simMoveLeavesKingInCheck(fromSq, toSq, color){
  const key = 'K|' + chess.fen() + '|' + fromSq + '|' + toSq + '|' + color;
  const c = cacheGet(key);
  if(c !== undefined) return c;

  const savedFen = chess.fen();
  let result = true;
  try {
    const piece = chess.get(fromSq);
    if(!piece){ cacheSet(key, true); return true; }
    if(!chess.remove(fromSq)){ cacheSet(key, true); return true; }
    if(!chess.put(piece, toSq)){
      try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
      cacheSet(key, true); return true;
    }
    const parts = chess.fen().split(' ');
    parts[1] = color; parts[3] = '-'; parts[4] = '0';
    chess.load(parts.join(' '), { skipValidation: true });
    result = chess.in_check();
  } catch(e){ result = true; }
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}

  cacheSet(key, result);
  return result;
}
// Ahora recibe una instancia de Chess (antes usaba la global)
function isSquareAttackedByEnemyOn(chessObj, sq, color){
  const key = 'A|' + chessObj.fen() + '|' + sq + '|' + color;
  const c = cacheGet(key);
  if(c !== undefined) return c;

  const savedFen = chessObj.fen();
  let result = false;
  try {
    const enemy = color === 'w' ? 'b' : 'w';
    const parts = savedFen.split(' ');
    parts[1] = enemy; parts[3] = '-'; parts[4] = '0';
    chessObj.load(parts.join(' '), { skipValidation: true });
    const moves = chessObj.moves({ verbose: true });
    result = moves.some(m => m.to === sq);
  } catch(e){ result = false; }
  try { chessObj.load(savedFen, { skipValidation: true }); } catch(e){}

  cacheSet(key, result);
  return result;
}
// Wrapper para el juego real
function isSquareAttackedByEnemy(sq, color){
  return isSquareAttackedByEnemyOn(chess, sq, color);
}
// Versión que recibe instancia (para la búsqueda IA)
function isAdjacentToAllyOn(chessObj, sq, color){
  const { r, c } = sqToRC(sq);
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(dr === 0 && dc === 0) continue;
    const nr = r + dr, nc = c + dc;
    if(nr < 0 || nc < 0 || nr >= 8 || nc >= 8) continue;
    const p = chessObj.get(rcToSquare(nr, nc));
    if(p && p.color === color) return true;
  }
  return false;
}

function renderHistoryItem(entry){
  const el = document.createElement('div');
  let cls = 'hist-item';
  if(entry.type === 'spell') cls += ' spell';
  else if(entry.type === 'ira') cls += ' ira';
  else if(entry.type === 'ira-blocked') cls += ' block';   // ⬅️ NUEVO
  else if(entry.type === 'shield-absorb') cls += ' block';
  else if(entry.type === 'start') cls += ' start';
  else cls += ' ' + (entry.color === 'w' ? 'w' : 'b');
  el.className = cls;
  let html = '';
  if(entry.powerIcon) html += `<span class="hist-sym">${entry.powerIcon}</span>`;
  if(entry.piece) html += `<span class="hist-piece ${entry.piece.color}">${GLYPH[entry.piece.type]}</span>`;
  if(entry.from && entry.to && entry.from !== entry.to){
    html += `<span class="hist-pos">${entry.from}</span><span class="hist-arrow">→</span><span class="hist-pos">${entry.to}</span>`;
  } else if(entry.to){ html += `<span class="hist-pos">${entry.to}</span>`; }
  if(entry.captured){
    html += `<span class="hist-arrow">×</span><span class="hist-piece ${entry.captured.color} faded">${GLYPH[entry.captured.type]}</span>`;
  }
  if(entry.targetPiece && !entry.captured){
    html += `<span class="hist-arrow">×</span><span class="hist-piece ${entry.targetPiece.color}">${GLYPH[entry.targetPiece.type]}</span>`;
  }
  if(entry.cost) html += `<span class="hist-cost">${entry.cost}💧</span>`;
  el.innerHTML = html; return el;
}
function describeEntry(entry){
  if(!entry) return '—';
  if(entry.type === 'start') return 'Inicio de la partida';
  const cName = entry.color === 'w' ? 'Blancas' : 'Negras';
  if(entry.type === 'move'){
    const pc = entry.piece ? PIECE_NAME[entry.piece.type] : 'Pieza';
    if(entry.captured) return `${cName}: ${pc} ${entry.from} → ${entry.to}, captura ${PIECE_NAME[entry.captured.type]}`;
    return `${cName}: ${pc} ${entry.from} → ${entry.to}`;
  }
  if(entry.type === 'ira'){
    const pc = entry.piece ? PIECE_NAME[entry.piece.type] : 'Pieza';
    return `Ira de Batalla (${cName}): ${pc} ${entry.from} → ${entry.to}` + (entry.captured ? `, captura ${PIECE_NAME[entry.captured.type]}` : '');
  }
  if(entry.type === 'ira-blocked'){
  const pc = entry.targetPiece ? PIECE_NAME[entry.targetPiece.type] : 'pieza';
  return `Ira bloqueada por el escudo — ${pc} sobrevive en ${entry.to}`;
}
  if(entry.type === 'shield-absorb') return `Escudo bloqueó el ataque de ${PIECE_NAME[entry.piece.type]} en ${entry.to}`;
  if(entry.type === 'spell'){
    const cost = entry.cost ? ` · ${entry.cost} maná` : '';
    const name = entry.powerName || '';
    if(name === 'Rayo') return `${cName}: ${name} destruye ${entry.targetPiece?PIECE_NAME[entry.targetPiece.type]:'pieza'} en ${entry.to}${cost}`;
    if(name === 'Teletransporte') return `${cName}: ${name} ${entry.piece?PIECE_NAME[entry.piece.type]:''} ${entry.from} → ${entry.to}${cost}`;
    if(name === 'Toque Curativo') return `${cName}: ${name} revive ${entry.piece?PIECE_NAME[entry.piece.type]:'pieza'} en ${entry.to}${cost}`;
    if(name === 'Zombosis') return `${cName}: ${name} convierte enemigo en ${entry.to}${cost}`;
    if(name === 'Terremoto') return `${cName}: ${name} en ${entry.to}${cost}`;
    if(name === 'Escudo') return `${cName}: ${name} sobre ${entry.piece?PIECE_NAME[entry.piece.type]:'pieza'} en ${entry.to}${cost}`;
    return `${cName}: ${name} en ${entry.to||entry.from}${cost}`;
  }
  return '—';
}

function paintLastMove(){
  const lm = state.lastMove;
  if(!lm) return;
  const currentSet = new Set();
  if(lm.from) currentSet.add(lm.from);
  if(lm.to) currentSet.add(lm.to);
  const prevSet = new Set();
  if(lm.prevFrom) prevSet.add(lm.prevFrom);
  if(lm.prevTo) prevSet.add(lm.prevTo);
  for(const sq of currentSet) prevSet.delete(sq);
  for(const sq of prevSet){
    const c = gridEl.querySelector(`[data-sq="${sq}"]`);
    if(c) c.classList.add('last-prev');
  }
  if(lm.from){
    const c = gridEl.querySelector(`[data-sq="${lm.from}"]`);
    if(c) c.classList.add('last-from');
  }
  if(lm.to){
    const c = gridEl.querySelector(`[data-sq="${lm.to}"]`);
    if(c) c.classList.add('last-to');
  }
}
function setLastMove(from, to, prev){
  state.lastMove = {
    from: from || null,
    to: to || null,
    prevFrom: prev && prev.from ? prev.from : null,
    prevTo: prev && prev.to ? prev.to : null
  };
  state.powerHighlights = [];   // ⬅️ NUEVO: el movimiento pisa el poder
}
function clearHighlights(){
  for(const c of gridEl.children){
    c.className = 'cell';
    const tag = c.querySelector('.costTag');
    if(tag) tag.remove();
  }
  paintLastMove();
  paintPowerHighlights();   // ⬅️ NUEVO
  previewActive = false;
  hoveredSq = null;
}
function showHoverPreview(sq){
  if(state.selected) return;         // ya hay selección real
  if(state.targeting) return;        // modo targeting, no interferir
  if(state.busy || state.gameOver || replay.active || state.paused || state.aiBusy) return;
  if(aiEnabled && chess.turn() === aiColor) return;

  const piece = chess.get(sq);
  if(!piece || piece.color !== chess.turn()){
    clearHoverPreview();
    return;
  }
  if(sq === hoveredSq && previewActive) return;   // mismo origen, nada que recalcular

  // Limpiar preview anterior (no toca highlights de selección)
  for(const c of gridEl.children){
    c.classList.remove('prev-sel','prev-mv','prev-cap');
  }

  hoveredSq = sq;
  previewActive = true;

  const cell = gridEl.querySelector(`[data-sq="${sq}"]`);

  const moves = chess.moves({ square: sq, verbose: true });
  for(const m of moves){
    const c = gridEl.querySelector(`[data-sq="${m.to}"]`);
    if(!c) continue;
    const isCap = m.flags.includes('c') || m.flags.includes('e');
    c.classList.add(isCap ? 'prev-cap' : 'prev-mv');
  }
}

function clearHoverPreview(){
  if(!previewActive && !hoveredSq) return;
  previewActive = false;

    c.classList.remove('prev-sel','prev-mv','prev-cap');

   ========================================================= */
function undoLimitForMode(){
  if(!aiEnabled) return 0;
  return UNDO_LIMITS[aiDifficulty] !== undefined ? UNDO_LIMITS[aiDifficulty] : 0;
}
function canUndo(){
  if(!aiEnabled) return false;
  if(rubyMode) return false;
  if(state.gameOver || state.busy || replay.active || state.paused || state.aiBusy) return false;
  if(chess.turn() !== humanColor) return false;
  const limit = undoLimitForMode();
  if(limit <= 0) return false;
  if(undoUsed >= limit) return false;
  if(undoStack.length === 0) return false;
  return true;
}
function ensureTurnSnapshot(){
  if(!aiEnabled || rubyMode) return;
  if(chess.turn() !== humanColor) return;
  if(turnSnapshotTaken) return;
  turnSnapshotTaken = true;
  pushUndoSnapshot();
}
function pushUndoSnapshot(){
  const snap = {
    fen: chess.fen(),
    mana: { ...state.mana },
    specialCount: { ...state.specialCount },
    iraCharge: { ...state.iraCharge },
    shields: { w: [...state.shields.w], b: [...state.shields.b] },
    shieldTurns: { w: { ...state.shieldTurns.w }, b: { ...state.shieldTurns.b } },
    shieldHits: { w: { ...state.shieldHits.w }, b: { ...state.shieldHits.b } },  // ⬅️ FALTA
    graveyard: { w: [...state.graveyard.w], b: [...state.graveyard.b] },
    achState: JSON.parse(JSON.stringify(achState)),
    firstBloodClaimed,
    historyLen: historyLog.length,
    decks: {
      w: { hand: [...playerDecks.w.hand], queue: [...playerDecks.w.queue] },
      b: { hand: [...playerDecks.b.hand], queue: [...playerDecks.b.queue] }
    },
    timer: { w: gameTimer.w, b: gameTimer.b }
  };
  undoStack.push(snap);
}
function performUndo(){
  if(!canUndo()) return;
  const snap = undoStack.pop();
  if(!snap) return;
  try { chess.load(snap.fen, { skipValidation: true }); }
  catch(e){ try { chess.load(snap.fen); } catch(e2){ return; } }
  state.mana = { ...snap.mana };
  state.specialCount = { ...snap.specialCount };
  state.iraCharge = { ...snap.iraCharge };
  state.shields = { w: [...snap.shields.w], b: [...snap.shields.b] };
if(snap.shieldTurns){
  state.shieldTurns = { w: { ...snap.shieldTurns.w }, b: { ...snap.shieldTurns.b } };
}
if(snap.shieldHits){                                                          // ⬅️ FALTA
  state.shieldHits = { w: { ...snap.shieldHits.w }, b: { ...snap.shieldHits.b } };
} else {
  state.shieldHits = { w: {}, b: {} };
}
state.graveyard = { w: [...snap.graveyard.w], b: [...snap.graveyard.b] };
  for(const color of ['w','b']){
    achState[color] = JSON.parse(JSON.stringify(snap.achState[color]));
  }
  firstBloodClaimed = snap.firstBloodClaimed;
  playerDecks.w.hand = [...snap.decks.w.hand];
  playerDecks.w.queue = [...snap.decks.w.queue];
  playerDecks.b.hand = [...snap.decks.b.hand];
  playerDecks.b.queue = [...snap.decks.b.queue];
  gameTimer.w = snap.timer.w; gameTimer.b = snap.timer.b;
  updateClocks();
  while(historyLog.length > snap.historyLen){
    historyLog.pop();
    if(historyEl.lastChild) historyEl.removeChild(historyEl.lastChild);
  }
  state.selected = null; state.legalMoves = []; state.targeting = null;
state.lastMove = { from: null, to: null, prevFrom: null, prevTo: null };
state.powerHighlights = [];   // ⬅️ NUEVO
if(iraResolve){ const r = iraResolve; iraResolve = null; r(null); }
clearHighlights();
rebuildPieces();
  renderAchStrip();
  undoUsed++;
  turnSnapshotTaken = false;
  sfx('undo');
  const limit = undoLimitForMode();
  const remaining = limit === Infinity ? '∞' : (limit - undoUsed);
  toast(`↶ Deshacer (${remaining} restantes)`, '#8ad0ff');
  updateUI();
}
function updateUndoButton(){
  const btn = $('#undoBtn');
  if(!btn) return;
  const limit = undoLimitForMode();
  const visible = aiEnabled && !rubyMode && limit > 0 && !state.gameOver && !replay.active;
  if(!visible){ btn.classList.add('hidden'); return; }
  btn.classList.remove('hidden');
  if(limit === Infinity){
    btn.textContent = '↶ Deshacer (∞)';
  } else {
    const remaining = Math.max(0, limit - undoUsed);
    btn.textContent = `↶ Deshacer (${remaining})`;
  }
  btn.classList.toggle('dis', !canUndo());
}

/* =========================================================
   RELOJ
   ========================================================= */
function startTimer(){
  stopTimer();
  if(!gameTimer.enabled) return;
  gameTimer.running = true;
  gameTimer.intervalId = setInterval(tickTimer, 100);
}
function stopTimer(){
  if(gameTimer.intervalId){ clearInterval(gameTimer.intervalId); gameTimer.intervalId = null; }
  gameTimer.running = false;
}
function tickTimer(){
  if(!gameTimer.running || state.paused || state.gameOver || replay.active) return;
  const turn = chess.turn();
  if(turn === 'w') gameTimer.w = Math.max(0, gameTimer.w - 0.1);
  else gameTimer.b = Math.max(0, gameTimer.b - 0.1);
  updateClocks();
  if(gameTimer.w <= 0 || gameTimer.b <= 0){
    stopTimer();
    handleTimeout(gameTimer.w <= 0 ? 'w' : 'b');
  }
}
function updateClocks(){
  const cw = $('#clockW'), cb = $('#clockB');
  if(!gameTimer.enabled){ cw.classList.add('hidden'); cb.classList.add('hidden'); return; }
  cw.classList.remove('hidden'); cb.classList.remove('hidden');
  cw.querySelector('.t').textContent = formatTime(gameTimer.w);
  cb.querySelector('.t').textContent = formatTime(gameTimer.b);
  const turn = chess ? chess.turn() : 'w';
  cw.classList.toggle('active', turn === 'w' && !state.gameOver);
  cb.classList.toggle('active', turn === 'b' && !state.gameOver);
  cw.classList.toggle('low', gameTimer.w <= 30);
  cb.classList.toggle('low', gameTimer.b <= 30);

/* =========================================================

   ========================================================= */
let powerTooltipEl = null;
let tooltipOwner = null;

function ensurePowerTooltip(){
  if(powerTooltipEl && document.body.contains(powerTooltipEl)) return powerTooltipEl;
  const el = document.createElement('div');
  el.id = 'powerTooltip';
  el.innerHTML = `
    <div class="tt-head">
      <span class="tt-icon"></span>
      <span class="tt-name"></span>
      <span class="tt-cost"></span>
    </div>
    <div class="tt-desc"></div>
    <div class="tt-arrow"></div>
  `;
  document.body.appendChild(el);
  powerTooltipEl = el;
  return el;
}

function showPowerTooltip(btn, key){
  const p = POWERS[key];
  if(!p) return;
  const el = ensurePowerTooltip();
  el.querySelector('.tt-icon').textContent = p.icon;
  el.querySelector('.tt-name').textContent = p.name;
  el.querySelector('.tt-cost').textContent = COST_LABEL[key] + '💧';
  el.querySelector('.tt-desc').textContent = p.desc || '';

  // Reset para medir limpio
  el.classList.remove('show','arrow-top','arrow-bottom');
  el.style.left = '-9999px';
  el.style.top  = '-9999px';
  el.style.visibility = 'hidden';

  const ttRect  = el.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  const GAP = 10;

  // --- Elegir arriba o abajo según espacio ---
  let placeAbove = true;
  let top = btnRect.top - ttRect.height - GAP;
  if(top < 8){
    placeAbove = false;
    top = btnRect.bottom + GAP;
  }

  // --- Centrar horizontalmente sobre el botón ---
  let left = btnRect.left + btnRect.width/2 - ttRect.width/2;
  const minLeft = 8;
  const maxLeft = window.innerWidth - ttRect.width - 8;
  left = Math.max(minLeft, Math.min(maxLeft, left));

  el.style.left = left + 'px';
  el.style.top  = top + 'px';
  el.classList.add(placeAbove ? 'arrow-bottom' : 'arrow-top');
  el.style.visibility = '';

  // --- Reubicar la flecha para que apunte al centro del botón ---
  const arrowX = (btnRect.left + btnRect.width/2) - left;
  const arrowEl = el.querySelector('.tt-arrow');
  // clamp para que no se escape del tooltip
  const clampedX = Math.max(12, Math.min(ttRect.width - 12, arrowX));
  arrowEl.style.left = clampedX + 'px';
  arrowEl.style.marginLeft = '-6px';

  tooltipOwner = btn;
  requestAnimationFrame(() => el.classList.add('show'));
}

function hidePowerTooltip(){
  tooltipOwner = null;
  if(!powerTooltipEl) return;
  powerTooltipEl.classList.remove('show');
}

function attachPowerTooltip(btn, key){
  let hoverTimer = null;
  let pressTimer = null;
  let longPressed = false;
  let touchHideTimer = null;

  const show = () => {
    if(!document.body.contains(btn)) return;
    // Si ya hay otro tooltip abierto para otro botón, no relanzar animación
    if(tooltipOwner === btn && powerTooltipEl && powerTooltipEl.classList.contains('show')) return;
    showPowerTooltip(btn, key);
    if(navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  };

  const hide = () => {
    clearTimeout(hoverTimer);
    clearTimeout(pressTimer);
    clearTimeout(touchHideTimer);
    if(tooltipOwner === btn) hidePowerTooltip();
  };

  // --- Desktop: hover con delay ---
  btn.addEventListener('mouseenter', () => {
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(show, 280);
  });
  btn.addEventListener('mouseleave', hide);

  // --- Táctil: long-press ---
  btn.addEventListener('pointerdown', (e) => {
    if(e.pointerType === 'mouse') return;
    longPressed = false;
    clearTimeout(pressTimer);
    clearTimeout(touchHideTimer);
    pressTimer = setTimeout(() => {
      longPressed = true;
      show();
      // En móvil, se oculta solo tras unos segundos
      touchHideTimer = setTimeout(hide, 3200);
    }, 450);
  });
  const cancelPress = () => clearTimeout(pressTimer);
  btn.addEventListener('pointerup', cancelPress);
  btn.addEventListener('pointercancel', () => { cancelPress(); hide(); });
  btn.addEventListener('pointerleave', (e) => {
    cancelPress();
    if(e.pointerType === 'touch') touchHideTimer = setTimeout(hide, 800);
  });

  // --- Bloquear el click si fue long-press ---
  btn.addEventListener('click', (e) => {
    if(longPressed){
      e.preventDefault();
      e.stopPropagation();
      longPressed = false;
    }
  }, true);
}

function endTurn(){
  const justEnded = chess.turn() === 'w' ? 'b' : 'w';
  const st = state.shieldTurns[justEnded];
  const sh = state.shieldHits[justEnded];
  if(st && state.shields[justEnded].length){
    const stillAlive = [];
    for(const sq of state.shields[justEnded]){
      if(st[sq] !== undefined){
        st[sq]--;
        if(st[sq] > 0){
          stillAlive.push(sq);
        } else {
          delete st[sq];
          delete sh[sq];
          toast(`🛡️ Escudo expirado en ${sq}`, '#7ac0ff');
        }
      } else {
        stillAlive.push(sq);
      }
    }
    state.shields[justEnded] = stillAlive;
  }

  state.selected = null; state.legalMoves = []; state.targeting = null;
  if(iraResolve){ const r = iraResolve; iraResolve = null; r(null); }
  clearHighlights();
  turnSnapshotTaken = false;
  checkGameEnd();
  updateUI();

  // *** Red de seguridad: si algo quedó desincronizado, repararlo en el
  //     siguiente par de frames (cuando ya no hay animaciones) ***
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if(!state.busy && !replay.active && !animatingEls.size) syncPieces();
  }));

  if(aiEnabled && !state.gameOver && chess.turn() === aiColor && !replay.active && !state.paused){
    setTimeout(aiTurn, 650);
  }
}
function checkGameEnd(){
  if(replay.active) return;
  if(chess.in_checkmate()){
    // ⬇️ NUEVO: si el rey en mate tiene escudo, no es mate
    const losingColor = chess.turn();
    if(kingHasShield(losingColor)){
      // No es mate real: el escudo absorbe
      return false;
    }
    state.gameOver = true;
    aiSearchAbort = true;
    stopTimer();
    const winner = chess.turn() === 'w' ? 'b' : 'w';
    const winnerName = winner === 'w' ? 'Blancas' : 'Negras';
    if(achState[winner].lostPieces === 0) unlockAch(winner, 'inmortal');
    sfx('end');
    vibrate([80, 80, 80, 80, 220]);
    saveCurrentMatch(winnerName, winner);
    setTimeout(async () => {
      const achList = renderAchSummary();
      const choice = await showModal('¡Jaque Mate!',
        `<div style="margin-bottom:10px">Las ${winnerName} ganan la partida.</div>${achList}`,
        [ { label:'🔄 Ver repetición', value:'replay', cls:'replay' },
          { label:'Nueva partida', value:'new', cls:'no' } ]);
      if(choice === 'replay') startReplay(); else restartGame();
    }, 500);
    return true;
  }
  if(chess.in_stalemate() || chess.in_draw()){
    state.gameOver = true; aiSearchAbort = true; stopTimer();
    sfx('end');
    vibrate([100, 60, 100, 60, 200]);
    saveCurrentMatch('Tablas', null);
    setTimeout(async () => {
      const achList = renderAchSummary();
      const choice = await showModal('Tablas',

          { label:'Nueva partida', value:'new', cls:'no' } ]);

    }, 500);
    return true;
  }
  return false;
}

/* =========================================================
   IA — PROMOCIÓN
   ========================================================= */
const PIECE_VALUE = { p:100, n:320, b:330, r:500, q:900, k:20000 };
function aiChoosePromotion(mv){
  const turn = chess.turn();
  const opp = turn === 'w' ? 'b' : 'w';
  const candidates = ['q', 'n', 'r', 'b'];
  let bestPick = 'q';
  let bestScore = -Infinity;
  for(const piece of candidates){
    let sim;
    try { sim = chess.move({ from: mv.from, to: mv.to, promotion: piece }); }
    catch(e){ continue; }
    if(!sim){ continue; }
    let score = PIECE_VALUE[piece];
    if(chess.in_checkmate()) score += 100000;
    else if(chess.in_check()) score += 500;
    if(sim.captured) score += PIECE_VALUE[sim.captured] * 0.5;
    try {
      const savedFen = chess.fen();
      const parts = savedFen.split(' ');
      parts[1] = opp;
      chess.load(parts.join(' '), { skipValidation: true });
      const enemyMoves = chess.moves({ verbose: true });
      const attacked = enemyMoves.some(m => m.to === mv.to);
      if(attacked) score -= PIECE_VALUE[piece] * 0.6;
      chess.load(savedFen, { skipValidation: true });
    } catch(e){}
    chess.undo();
    if(score > bestScore){ bestScore = score; bestPick = piece; }
  }
  return bestPick;
}

   MOVIMIENTO

async function doPlayerMove(mv){
  state.busy = true;
  const turn = chess.turn();
  const opp = turn === 'w' ? 'b' : 'w';
  const movingPiece = chess.get(mv.from);

  let capturedSquare = null;
  if(mv.flags.includes('e')) capturedSquare = mv.to[0] + mv.from[1];
  else if(mv.flags.includes('c')) capturedSquare = mv.to;

  if(capturedSquare){
  const targetPiece = chess.get(capturedSquare);
  if(targetPiece && state.shields[targetPiece.color].includes(capturedSquare)){
    const defenderColor = targetPiece.color;
    const hitsLeft = state.shieldHits[defenderColor][capturedSquare] || 2;

    if(hitsLeft <= 1){
      // ─── SEGUNDO ATAQUE → el escudo se rompe, el ataque pasa ───
      removeShield(defenderColor, capturedSquare);
      const c = squareCenter(capturedSquare);
      ripples.push({ x:c.x, y:c.y, r:2, maxR: cellSize*1.7, life:.65, maxLife:.65, color:'180,220,255' });
      burst(c.x, c.y, 34, { color:'#c8e0ff', spMin:60, spMax:220, lifeMin:.25, lifeMax:.6, sizeMin:1, sizeMax:3, shape:'tri' });
      sfx('shield');
      toast('💥 ¡El escudo se rompe! El ataque pasa.', '#ff8080');
      // ⬅️ NO return: el movimiento sigue normal y captura
    } else {
      // ─── PRIMER ATAQUE → bloquea y debilita ───
      state.shieldHits[defenderColor][capturedSquare] = hitsLeft - 1;
      state.shieldTurns[defenderColor][capturedSquare]--;

      // Si la duración también llegó a 0 con este golpe, se rompe
      if(state.shieldTurns[defenderColor][capturedSquare] <= 0){
        removeShield(defenderColor, capturedSquare);
      }

      const c = squareCenter(capturedSquare);
      ripples.push({ x:c.x, y:c.y, r:2, maxR: cellSize*1.5, life:.6, maxLife:.6, color:'120,190,255' });
      burst(c.x, c.y, 30, { color:'#8ecbff', spMin:40, spMax:180, lifeMin:.3, lifeMax:.7, sizeMin:1.5, sizeMax:3.5 });
      sfx('shield');
      toast('🛡️ Escudo absorbe el ataque · 1 golpe restante', '#8ecbff');
      unlockAch(defenderColor, 'escudoSalvador');

      switchTurnInFen();
      achState[turn].streak = 0;
      recordHistory({
        type: 'shield-absorb', color: turn, powerIcon: '🛡️',
        piece: movingPiece ? { type: movingPiece.type, color: turn } : null,
        from: mv.from, to: capturedSquare,
        targetPiece: { type: targetPiece.type, color: targetPiece.color }
      });

      state.selected = null; state.legalMoves = []; clearHighlights();
      await sleep(650);
      state.busy = false;
      endTurn();
      return;
    }
  }
}

  let promotion;
  if(mv.flags.includes('p')){
    const isAIMove = aiEnabled && chess.turn() === aiColor;
    if(isAIMove){
      promotion = aiChoosePromotion(mv);
    } else {
      promotion = await askPromotion();
    }
  }

  let moveResult;
const kingShielded = kingHasShield(turn);
const isKingMoving = (mv.from === findKing(turn));

if(kingShielded && !isKingMoving){
  // Otra pieza se mueve, el rey está escudado → ignoramos el jaque
  const savedFen = chess.fen();
  const kingSq = findKing(turn);
  const king = chess.get(kingSq);
  chess.remove(kingSq);
  try {
    moveResult = chess.move({ from: mv.from, to: mv.to, promotion: promotion || 'q' });
  } catch(e){ moveResult = null; }
  if(moveResult){
    // Reponer el rey en su casilla original
    try { chess.put(king, kingSq); } catch(e){}
  } else {
    try { chess.put(king, kingSq); } catch(e){}
    try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
  }
} else {
  // Camino normal
  try { moveResult = chess.move({ from: mv.from, to: mv.to, promotion: promotion || 'q' }); }
  catch(e){ moveResult = null; }
}
if(!moveResult){ state.busy = false; return; }

  if(state.shields[turn].includes(mv.from)){
    removeShield(turn, mv.from);
    toast('🛡️ Escudo cancelado al mover la pieza', '#7ac0ff');
  }
  if(capturedSquare){
  for(const col of ['w','b']){
    const i = state.shields[col].indexOf(capturedSquare);
    if(i >= 0){
      state.shields[col].splice(i,1);
      delete state.shieldTurns[col][capturedSquare];
      delete state.shieldHits[col][capturedSquare];
    }
  }
}

  sfx(moveResult.captured ? 'capture' : 'move');
  await animateMove(mv.from, mv.to, capturedSquare);

  const didCapture = !!(moveResult.captured || mv.flags.includes('e'));

  if (didCapture) vibrate(35);
  setLastMove(mv.from, mv.to, null);

  if(moveResult.captured){
    addToGraveyard(moveResult.captured, opp);
  } else if(mv.flags.includes('e')){
    addToGraveyard('p', opp);
  }

  if(didCapture){
    if(!firstBloodClaimed){
      firstBloodClaimed = true;
      unlockAch(turn, 'primeraSangre');
    }
    achState[turn].streak++;
    checkStreakAch(turn);
    achState[opp].streak = 0;
    achState[opp].lostPieces++;
    if(movingPiece && movingPiece.type === 'k'){
      achState[turn].kingCaptures++;
      if(achState[turn].kingCaptures >= 3) unlockAch(turn, 'reyCazador3');
    }
  } else {
    achState[turn].streak = 0;
  }

  recordHistory({
    type: 'move', color: turn,
    piece: { type: moveResult.piece, color: turn },
    from: moveResult.from, to: moveResult.to,
    captured: moveResult.captured ? { type: moveResult.captured, color: opp } : null,
    san: moveResult.san, promotion: moveResult.promotion || null
  });

  state.mana[turn] = Math.min(state.maxMana, state.mana[turn] + 1);
  if(movingPiece && movingPiece.type === 'k' && didCapture){
    state.mana[turn] = Math.min(state.maxMana, state.mana[turn] + 1);
    toast('¡Rey cazador! +1 maná extra', '#ffd070');
  }
  if(movingPiece && isSpecial(movingPiece.type)){
    if(!state.iraCharge[turn]){
      state.specialCount[turn]++;
      if(state.specialCount[turn] >= 5){
        state.specialCount[turn] = 0;
        state.iraCharge[turn] = true;
        toast('¡IRA DE BATALLA CARGADA!', '#ffa040');
        sfx('ira');
      }
    }
  }

  state.busy = false;
  syncPieces();
  updateUI();

  if(movingPiece && isSpecial(movingPiece.type) && didCapture && state.iraCharge[turn]){
  state.busy = true;
  const iraResult = await iraTargeting(mv.to, turn);
  state.busy = false;
  if(iraResult){
    if(iraResult.blocked){
      // ⬇️ NUEVO: la Ira se rompió contra un escudo.
      // El charge, el efecto y el registro ya se hicieron dentro de iraTargeting.
      // Solo avisamos y NO llamamos a unlockAch('dobleFilo') porque no hubo doble captura.
      toast('🛡️ Tu Ira se rompió contra el escudo', '#ff8080');
      updateUI();
    } else {
      state.iraCharge[turn] = false;
      unlockAch(turn, 'dobleFilo');
      recordHistory({
        type: 'ira', color: turn, powerIcon: '⚔️', powerName: 'Ira de Batalla',
        piece: { type: movingPiece.type, color: turn },
        from: iraResult.from, to: iraResult.to,
        captured: iraResult.captured ? { type: iraResult.captured, color: opp } : null
      });
      setLastMove(iraResult.from, iraResult.to, { from: mv.from, to: mv.to });
      vibrate([20, 40, 55]);
      if(iraResult.captured){
        achState[turn].streak++;
        checkStreakAch(turn);
        achState[opp].streak = 0;
        achState[opp].lostPieces++;
      }
      toast('¡Doble captura!', '#ffa040');
      sfx('ira');
      updateUI();
    }
  }
}
endTurn();
}

/* =========================================================
   IRA DE BATALLA
   ========================================================= */
async function iraTargeting(fromSq, color){
  const savedFen = chess.fen();
  const parts = savedFen.split(' ');
  if(parts[1] !== color){
    parts[1] = color;
    try { chess.load(parts.join(' '), { skipValidation: true }); } catch(e){}
  }
  const moves = chess.moves({ square: fromSq, verbose: true })
    .filter(m => {
      if(!(m.flags.includes('c') || m.flags.includes('e'))) return false;
      const target = chess.get(m.to);
      if(target && target.type === 'k') return false;
      return true;
    });
  if(moves.length === 0){
    try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
    return null;
  }
  const oppColor = color === 'w' ? 'b' : 'w';

  const moveTargetShieldSq = (m) => {
    const sq = m.flags.includes('e') ? (m.to[0] + m.from[1]) : m.to;
    const target = chess.get(sq);
    if(target && state.shields[target.color].includes(sq)) return sq;
    return null;
  };

  const breakShieldWithIra = async (targetSq, targetPiece) => {
    const C = squareCenter(targetSq);
    ripples.push({ x:C.x, y:C.y, r:2, maxR: cellSize*2.0, life:.8, maxLife:.8, color:'180,220,255' });
    burst(C.x, C.y, 40, { color:'#c8e0ff', spMin:80, spMax:260, lifeMin:.3, lifeMax:.7, sizeMin:1, sizeMax:3.5, shape:'tri' });
    burst(C.x, C.y, 20, { color:'#8ecbff', spMin:30, spMax:140, lifeMin:.4, lifeMax:.9, sizeMin:2, sizeMax:5 });
    sfx('shield');
    vibrate([40, 30, 80]);
    removeShield(targetPiece.color, targetSq);
    state.iraCharge[color] = false;
    toast('🛡️ ¡La Ira se estrella contra el escudo! Escudo roto · Ira consumida', '#ffb060');
    recordHistory({
      type: 'ira-blocked', color, powerIcon: '🛡️', powerName: 'Ira bloqueada',
      piece: null, from: fromSq, to: targetSq,
      targetPiece: { type: targetPiece.type, color: targetPiece.color },
      cost: 0
    });
    syncPieces();
    await sleep(700);
  };

  const resolveIraTarget = async (toSq) => {
    if(!toSq) return null;
    const mv = moves.find(m => m.to === toSq);
    if(!mv) return null;
    const capturedSquare = mv.flags.includes('e') ? (mv.to[0] + mv.from[1]) : mv.to;
    const targetPiece = chess.get(capturedSquare);

    if(targetPiece && state.shields[targetPiece.color].includes(capturedSquare)){
      await breakShieldWithIra(capturedSquare, targetPiece);
      try { chess.load(savedFen, { skipValidation: true }); } catch(err){}
      syncPieces();
      return { blocked: true, to: capturedSquare, captured: null };
    }

    let res;
    try { res = chess.move({ from: mv.from, to: mv.to }); } catch(err){ res = null; }
    if(!res){
      try { chess.load(savedFen, { skipValidation: true }); } catch(err){}
      return null;
    }
    sfx('capture');
    await animateMove(mv.from, mv.to, capturedSquare, 400);
    if(res.captured) addToGraveyard(res.captured, oppColor);
    if(res.captured) vibrate([20, 40, 55]);
    state.mana[color] = Math.min(state.maxMana, state.mana[color] + 1);
    for(const col of ['w','b']){
      if(state.shields[col].includes(capturedSquare)) removeShield(col, capturedSquare);
    }
    const cc = squareCenter(capturedSquare);
    burst(cc.x, cc.y, 20, { color:'#ff9040', spMin:50, spMax:180, lifeMin:.3, lifeMax:.7 });
    syncPieces();
    return { from: res.from, to: res.to, captured: res.captured || null };
  };

  // ===== RAMA IA =====
  if(aiEnabled && color === aiColor){
    const unshieldedMoves = moves.filter(m => !moveTargetShieldSq(m));
    const candidates = unshieldedMoves.length ? unshieldedMoves : moves;
    let best = candidates[0], bestVal = -Infinity;
    for(const m of candidates){
      const tp = chess.get(m.to);
      if(!tp) continue;
      const v = PIECE_VALUE[tp.type] || 0;
      if(v > bestVal){ bestVal = v; best = m; }
    }
    await sleep(450);
    return await resolveIraTarget(best.to);
  }

  // ===== RAMA JUGADOR =====
  const result = await new Promise(resolve => {
    const targets = new Set(moves.map(m => m.to));

    const cleanup = () => {
      gridEl.removeEventListener('click', clickH, true);
      gridEl.removeEventListener('contextmenu', ctxH, true);
      state.targeting = null; iraResolve = null; clearHighlights();
    };
    const ctxH = (e) => { e.preventDefault(); cleanup(); resolve(null); };
    const clickH = async (e) => {
      const cell = e.target.closest('.cell');
      if(!cell) return;
      const sq = cell.dataset.sq;
      if(!targets.has(sq)) return;
      cleanup();
      resolve(await resolveIraTarget(sq));
    };
    const onDrop = async (toSq) => {
      if(!toSq || !targets.has(toSq)) return false;
      cleanup();
      resolve(await resolveIraTarget(toSq));
      return true;
    };

    clearHighlights();
    const c = gridEl.querySelector(`[data-sq="${fromSq}"]`);
    if(c) c.classList.add('sel');
    for(const sq of targets){
      const el = gridEl.querySelector(`[data-sq="${sq}"]`);
      if(!el) continue;
      const mv = moves.find(m => m.to === sq);
      const isShielded = !!moveTargetShieldSq(mv);
      el.classList.add(isShielded ? 'ira-shielded' : 'ira');
    }
    state.targeting = { key: 'ira', from: fromSq, color, moves, resolveDrop: onDrop };
    iraResolve = resolve;
    toast('Elige la segunda víctima (clic o arrastrá; azul = escudado)', '#ffa040');
    updateUI();
    gridEl.addEventListener('click', clickH, true);
    gridEl.addEventListener('contextmenu', ctxH, true);
  });
  if(!result){ try { chess.load(savedFen, { skipValidation: true }); } catch(e){} }
  return result;
}

/* =========================================================

function startPower(key){
  if(state.busy || state.gameOver || replay.active || state.paused) return;
  if(state.aiBusy) return;
  if(aiEnabled && chess.turn() === aiColor) return;
  initAudio();
  if(state.targeting && state.targeting.key === key){ cancelTargeting(); return; }
  const turn = chess.turn();
  if(!playerDecks[turn].hand.includes(key)){ toast('No tienes esa carta en la mano'); return; }
  const minCost = minCostOf(key);
  if(state.mana[turn] < minCost){ toast('Maná insuficiente'); return; }
  ensureTurnSnapshot();
  if(key === 'heal'){ handleHealStart(turn); return; }
  state.targeting = { key, step: 1, data: {}, target: key };
  state.selected = null; state.legalMoves = [];
  clearHighlights(); highlightTargeting(); updateUI();
}
async function handleHealStart(turn){
  const pile = state.graveyard[turn];
  if(!pile.length){ toast('No tienes piezas caídas para revivir', '#ff8080'); return; }
  const counts = {};
  for(const t of pile) counts[t] = (counts[t] || 0) + 1;
  const entries = Object.entries(counts)
    .map(([t, n]) => ({ type: t, n, cost: healCostFor(t) }))
    .sort((a,b) => a.cost - b.cost);
  const btns = entries.map(e => {
    const affordable = state.mana[turn] >= e.cost;
    return {
      html: `<span>${GLYPH[e.type]}</span><small>${e.cost}💧${e.n>1?' ×'+e.n:''}</small>`,
      value: affordable ? e.type : ('__unaffordable_' + e.type),
      cls: 'glyph' + (affordable ? '' : ' dis')
    };
  });
  btns.push({ label:'✕', value:null, cls:'no' });
  const chosenRaw = await showModal('💚 Toque Curativo',
    `Maná: ${state.mana[turn]} · Elige qué revivir`, btns);
  if(!chosenRaw) return;
  if(typeof chosenRaw === 'string' && chosenRaw.startsWith('__unaffordable_')){
    const t = chosenRaw.replace('__unaffordable_', '');
    toast(`Necesitas ${healCostFor(t)} maná para revivir esa pieza`, '#ff8080');
    return handleHealStart(turn);
  }
  const chosen = chosenRaw;
  const cost = healCostFor(chosen);
  if(state.mana[turn] < cost){ toast('Maná insuficiente', '#ff8080'); return; }
  if(!pile.includes(chosen)){ toast('Esa pieza ya no está en tu cementerio', '#ff8080'); return; }
  const empties = getAdjacentEmptySquares(turn);
  if(!empties.length){ toast('No hay casillas vacías disponibles', '#ff8080'); return; }
  state.targeting = { key: 'heal', step: 2, target: 'heal',
    data: { type: chosen, emptySquares: empties, cost } };
  highlightTargeting(); updateUI();
}
function cancelTargeting(){
  if(!state.targeting) return;
  const wasIra = state.targeting.key === 'ira';
  state.targeting = null; clearHighlights();
  if(wasIra && iraResolve){ const r = iraResolve; iraResolve = null; r(null); return; }
  updateUI();
}
function isAdjacentToAlly(sq, color){
  return isAdjacentToAllyOn(chess, sq, color);
}
function highlightTargeting(){
  clearHighlights();
  const T = state.targeting;
  if(!T || T.key === 'ira') return;
  const turn = chess.turn();
  const board = chess.board();
  const mana = state.mana[turn];

  if(T.key === 'teleport'){
    if(T.step === 1){
      for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        const p = board[r][c];
        if(p && p.color === turn) gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`).classList.add('tgt');
      }
      toast('Selecciona una pieza para teletransportar', '#7ac0ff');
    } else {
      const from = T.data.from;
      for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        if(board[r][c]) continue;
        const sq = rcToSquare(r,c);
        const cost = teleportCost(from, sq);
        if(cost > mana) continue;
        if(simMoveLeavesKingInCheck(from, sq, turn)) continue;
        gridEl.querySelector(`[data-sq="${sq}"]`).classList.add('tgt2');
      }
      toast(`Destino (2/4/6 · maná: ${mana})`, '#7affa0');
    }
  } else if(T.key === 'shield'){
    if(state.shields[turn].length > 0) toast('Ya tienes un escudo activo — solo uno a la vez', '#7ac0ff');
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && p.color === turn){
        const el = gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`);
        el.classList.add('tgt');
        if(p.type === 'k' || p.type === 'q') el.classList.add('sel');
      }
    }
    toast('Selecciona la pieza a proteger (4 maná)', '#7ac0ff');
  } else if(T.key === 'ray'){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color === turn || p.type === 'k') continue;
      const sq = rcToSquare(r,c);
      const cell = gridEl.querySelector(`[data-sq="${sq}"]`);
      const cost = rayCostFor(p.type);
      cell.classList.add('tgtEnemy');
      if(cost > mana) cell.classList.add('dis');
      const tag = document.createElement('span');
      tag.className = 'costTag'; tag.textContent = cost;
      cell.appendChild(tag);
    }
    toast(`Maná: ${mana} · Los objetivos oscuros no son alcanzables`, '#ff7070');
  } else if(T.key === 'zombie'){
    let any = false;
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && p.color !== turn && p.type !== 'k'){
        const sq = rcToSquare(r,c);
        if(isAdjacentToAlly(sq, turn)){
          gridEl.querySelector(`[data-sq="${sq}"]`).classList.add('tgtEnemy');
          any = true;
        }
      }
    }
    if(!any) toast('Sin enemigos adyacentes a un aliado', '#c07aff');
    else toast('Selecciona un enemigo pegado a un aliado', '#c07aff');
  } else if(T.key === 'heal' && T.step === 2){
    for(const sq of (T.data.emptySquares || [])){
      const el = gridEl.querySelector(`[data-sq="${sq}"]`);
      if(el) el.classList.add('tgt2');
    }
    toast(`Reaparece ${GLYPH[T.data.type]} · coste ${T.data.cost}`, '#7affa0');
  } else if(T.key === 'quake'){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const el = gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`);
      if(el) el.classList.add('tgt');
    }
    toast('Selecciona el centro del área 3×3', '#ffb060');
  }
}
function getAdjacentEmptySquares(color){
  const kingSq = findKing(color);
  const empties = [];
  const board = chess.board();
  const center = kingSq ? sqToRC(kingSq) : { r: color==='w'?7:0, c:4 };
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(board[r][c]) continue;
    const d = Math.max(Math.abs(r-center.r), Math.abs(c-center.c));
    if(d <= 2) empties.push({ sq: rcToSquare(r,c), d });
  }
  empties.sort((a,b)=>a.d-b.d);
  if(empties.length === 0){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      if(!board[r][c]) empties.push({ sq: rcToSquare(r,c), d: 99 });
    }
  }
  return empties.slice(0, 16).map(e=>e.sq);
}
function findKing(color){
  const board = chess.board();
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(p && p.type === 'k' && p.color === color) return rcToSquare(r,c);
  }
  return null;
}
function kingHasShield(color){
  const kingSq = findKing(color);
  return !!(kingSq && state.shields[color].includes(kingSq));
}

// Calcula movimientos para `sq` ignorando el jaque (workaround: quitamos el rey
// temporalmente para que chess.js no filtre por jaque).
function getMovesIgnoringCheck(sq, color){
  const savedFen = chess.fen();
  const kingSq = findKing(color);
  let moves = [];
  try {
    if(kingSq){
      const king = chess.get(kingSq);
      chess.remove(kingSq);
      moves = chess.moves({ square: sq, verbose: true });
      try { chess.put(king, kingSq); } catch(e){}
    } else {
      moves = chess.moves({ square: sq, verbose: true });
    }
  } catch(e){
    try { chess.load(savedFen, { skipValidation: true }); } catch(e2){}
    moves = chess.moves({ square: sq, verbose: true });
  }
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
  return moves;
}
async function handleTargetingClick(sq){
  const T = state.targeting;
  if(!T) return;
  const turn = chess.turn();
  const board = chess.board();
  const rc = sqToRC(sq);
  const piece = board[rc.r][rc.c];

  if(T.key === 'teleport'){
    if(T.step === 1){
      if(!piece || piece.color !== turn) return;
      T.data.from = sq;
      T.step = 2;
      highlightTargeting();
      return;
    } else {
      if(piece && piece.color === turn){
        T.data.from = sq;
        highlightTargeting();
        return;
      }
      if(piece) return;
      const from = T.data.from;
      const cost = teleportCost(from, sq);
      if(!isFinite(cost)){ toast('Fuera de alcance (máx 3 casillas)', '#ff8080'); return; }
      if(cost > state.mana[turn]){ toast('Maná insuficiente para esa distancia', '#ff8080'); return; }
      if(simMoveLeavesKingInCheck(from, sq, turn)){
        toast('¡Ese salto dejaría a tu Rey en Jaque!', '#ff8080');
        return;
      }
      state.targeting = null; clearHighlights();
      await execTeleport(from, sq, cost); return;
    }
  }
  if(T.key === 'shield'){
    if(!piece || piece.color !== turn) return;
    if(state.shields[turn].length > 0){ toast('Ya tienes un escudo activo', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execShield(sq); return;
  }
  if(T.key === 'ray'){
    if(!piece || piece.color === turn || piece.type === 'k') return;
    const cost = rayCostFor(piece.type);
    if(cost > state.mana[turn]){ toast(`Necesitas ${cost} maná para destruir esa pieza`, '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execRay(sq, cost); return;
  }
  if(T.key === 'zombie'){
    if(!piece || piece.color === turn || piece.type === 'k') return;
    if(!isAdjacentToAlly(sq, turn)){ toast('Debe estar pegado a una pieza aliada', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execZombie(sq); return;
  }
  if(T.key === 'heal' && T.step === 2){
    if(piece) return;
    const type = T.data.type, cost = T.data.cost;
    if(cost > state.mana[turn]){ toast('Maná insuficiente', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execHeal(sq, type, turn, cost); return;
  }
  if(T.key === 'quake'){
    state.targeting = null; clearHighlights();
    await execQuake(sq); return;
  }
}

/* =========================================================
   EJECUCIÓN DE PODERES
   ========================================================= */
async function execTeleport(from, to, cost){
  state.busy = true;
  vibrate([15, 30, 40]);
  const turn = chess.turn();
  const A = squareCenter(from), B = squareCenter(to);
  const el = pieceEls.get(from);
  const piece = chess.get(from);
  spawnVortex(A.x, A.y, '#b070ff', true); sfx('spell');
  await sleep(320);
  if(el){ el.style.opacity = '0'; el.style.transition = 'opacity .16s'; await sleep(160); el.style.opacity = '1'; }
  spawnCurve(A, B, 'rgba(180,120,255,0.85)');
  await sleep(180);
  movePieceOnBoard(from, to);
  if(piece && piece.type === 'k'){
    const parts = chess.fen().split(' ');
    let c = parts[2] === '-' ? '' : parts[2];
    if(turn === 'w') c = c.replace(/[KQ]/g,''); else c = c.replace(/[kq]/g,'');
    parts[2] = c || '-'; parts[3] = '-'; parts[4] = '0';
    try { chess.load(parts.join(' '), { skipValidation: true }); } catch(e){}
  }
  if(state.shields[turn].includes(from)){
  removeShield(turn, from);
  toast('🛡️ Escudo cancelado al teletransportar', '#7ac0ff');
}
  validateAndFixBoard();
  const el2 = pieceEls.get(to);
  if(el2){ el2.style.opacity = '0'; el2.getBoundingClientRect(); el2.style.opacity = '1'; }
  spawnVortex(B.x, B.y, '#d0a0ff', false);
  ripples.push({ x:B.x, y:B.y, r:2, maxR: cellSize*1.3, life:.55, lifeMax:.55, color:'190,140,255' });
  burst(B.x, B.y, 24, { color:'#c890ff', spMin:30, spMax:150, lifeMin:.3, lifeMax:.7 });
  state.mana[turn] -= cost;
  achState[turn].powersUsed++;
  if(achState[turn].powersUsed >= 5) unlockAch(turn, 'magoDeMagos');
  toast(`Teletransporte · ${cost} maná`, '#c890ff');
  await sleep(400);
  state.busy = false;
  setPowerHighlight([from, to], 'teleport');
  finishPower({ type:'spell', color: turn, powerIcon:'🌀', powerName:'Teletransporte', powerKey:'teleport',
    piece: piece ? { type: piece.type, color: turn } : null, from, to, cost });
}
async function execShield(sq){
  state.busy = true;
  vibrate([20, 20, 20, 20, 60]);
  const turn = chess.turn();
  const C = squareCenter(sq);
  const piece = chess.get(sq);
  sfx('shield');
  const start = performance.now(); const dur = 500;
  await new Promise(res => {
    function frame(){
      const t = clamp((performance.now()-start)/dur, 0, 1);
      const r = cellSize * 0.15 + cellSize * 0.75 * t;
      ctx.save(); ctx.globalAlpha = (1-t)*0.9 + 0.15;
      ctx.strokeStyle = `rgba(120,190,255,${0.9*(1-t*0.4)})`;
      ctx.lineWidth = 2.5; ctx.shadowColor = '#6ab0ff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = i*Math.PI/3 - Math.PI/2;
        const px = C.x + Math.cos(a)*r, py = C.y + Math.sin(a)*r;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
      if(t < 1) requestAnimationFrame(frame); else res();
    }
    frame();
