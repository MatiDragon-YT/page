const dragLayer = $('#dragLayer');
let drag = null;
let suppressNextClick = false;
const DRAG_THRESHOLD = 6;

function startGhostDrag(d){
  if(d.originalEl){
    d.originalEl.style.transition = 'opacity 120ms';
    d.originalEl.style.opacity = '0.28';
  }

  const el = document.createElement('div');
  el.className = 'piece dragging ' + (d.piece.color === 'w' ? 'white' : 'black');
  el.dataset.code = d.piece.color + d.piece.type;
  const tok = document.createElement('div');
  tok.className = 'tok';
  tok.textContent = GLYPH[d.piece.type];
  el.appendChild(tok);
  el.style.width = cellSize + 'px';
  el.style.height = cellSize + 'px';
  el.style.position = 'absolute';
  el.style.left = '0'; el.style.top = '0';
  el.style.pointerEvents = 'none';
  el.style.willChange = 'transform';
  el.style.transition = 'none';
  dragLayer.appendChild(el);
  d.ghostEl = el;

  clearHighlights();
  const fromCell = gridEl.querySelector(`[data-sq="${d.fromSq}"]`);
  if(fromCell) fromCell.classList.add('sel');

  if(d.isIraDrag){
    // En modo Ira mostramos los targets como anillos naranjas / azules,
    // igual que el targeting normal
    for(const m of d.legalMoves){
      const sq = m.to;
      const c = gridEl.querySelector(`[data-sq="${sq}"]`);
      if(!c) continue;
      const targetSq = m.flags.includes('e') ? (m.to[0] + m.from[1]) : m.to;
      const targetPiece = chess.get(targetSq);
      const isShielded = targetPiece && state.shields[targetPiece.color].includes(targetSq);
      c.classList.add(isShielded ? 'ira-shielded' : 'ira');
    }
  } else {
    for(const m of d.legalMoves){
      const c = gridEl.querySelector(`[data-sq="${m.to}"]`);
      if(!c) continue;
      const isCap = m.flags.includes('c') || m.flags.includes('e');
      c.classList.add(isCap ? 'cap' : 'mv');
    }
  }
}

function endDrag(d){
  if(d.ghostEl && d.ghostEl.parentNode){
    d.ghostEl.remove();
    d.ghostEl = null;
  }
  if(d.originalEl){
    d.originalEl.style.transition = 'opacity 120ms';
    d.originalEl.style.opacity = '';
    setTimeout(() => {
      if(d.originalEl) d.originalEl.style.transition = '';
    }, 140);
  }
  if(d.hoverCell){
    d.hoverCell.classList.remove('hover');
    d.hoverCell = null;
  }
}

/* ---------- POINTER DOWN ---------- */
gridEl.addEventListener('pointerdown', (e) => {
  suppressNextClick = false;
  clearHoverPreview();

  if(e.pointerType === 'mouse' && e.button !== 0) return;

  // ⬇️ ¿Estamos esperando un segundo target de Ira?
  const isIraDrag = !!(state.targeting && state.targeting.key === 'ira');

  // Los guards normales NO aplican durante el targeting de Ira,
  // porque state.busy está en true esperando la respuesta legítima.
  if(!isIraDrag){
    if(state.busy || state.gameOver || replay.active || state.paused || state.aiBusy) return;
  }

  // Otros targeting (no Ira) siguen bloqueados como antes
  if(state.targeting && !isIraDrag) return;

  const cell = e.target.closest('.cell');
  if(!cell) return;
  const sq = cell.dataset.sq;

  // En drag de Ira solo se puede agarrar la pieza que tiene la Ira
  if(isIraDrag && sq !== state.targeting.from) return;
  // Fuera del targeting de Ira, chequeo normal de turno
  if(!isIraDrag && aiEnabled && chess.turn() === aiColor) return;

  const piece = chess.get(sq);
  if(!piece) return;
  if(!isIraDrag && piece.color !== chess.turn()) return;

  // Movimientos válidos: en Ira usamos los del targeting ya calculados
  let dragMoves;
  if(isIraDrag){
    dragMoves = state.targeting.moves || [];
  } else {
    dragMoves = chess.moves({ square: sq, verbose: true });
  }

  drag = {
    fromSq: sq,
    piece,
    pointerId: e.pointerId,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    captured: false,
    ghostEl: null,
    originalEl: pieceEls.get(sq),
    hoverCell: null,
    legalMoves: dragMoves,
    isIraDrag
  };
});

/* ---------- POINTER MOVE ---------- */
gridEl.addEventListener('pointermove', (e) => {
  // ---- Drag activo ----
  if(drag && e.pointerId === drag.pointerId){
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    const dist = Math.hypot(dx, dy);

        if(!drag.moved){
      if(dist < DRAG_THRESHOLD) return;
      drag.moved = true;
      // *** Capturar pointer AHORA: solo cuando es un drag real ***
      try {
        gridEl.setPointerCapture(e.pointerId);
        drag.captured = true;
      } catch(err){}
      startGhostDrag(drag);
    }

    const rect = boardWrap.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    if(drag.ghostEl){
      drag.ghostEl.style.transform =
        `translate(${px - cellSize/2}px, ${py - cellSize/2}px)`;
    }

    const below = document.elementFromPoint(e.clientX, e.clientY);
    const belowCell = below ? below.closest('.cell') : null;
    if(belowCell !== drag.hoverCell){
      if(drag.hoverCell) drag.hoverCell.classList.remove('hover');
      if(belowCell && !belowCell.classList.contains('sel')){
        belowCell.classList.add('hover');
        drag.hoverCell = belowCell;
      } else {
        drag.hoverCell = null;
      }
    }
    return;
  }

  // ---- Hover preview (sin drag) ----
  // En touch puro no hay hover real: solo aplicamos a mouse/pen
  if(e.pointerType === 'touch') return;

  const cell = e.target.closest('.cell');
  if(!cell){
    clearHoverPreview();
    return;
  }
  const sq = cell.dataset.sq;
  if(sq === hoveredSq) return;
  showHoverPreview(sq);
});

/* ---------- POINTER UP ---------- */
gridEl.addEventListener('pointerup', async (e) => {
  if(!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  if(d.captured){
    try { gridEl.releasePointerCapture(e.pointerId); } catch(err){}
  }

  const wasDrag = d.moved;

  if(!wasDrag){
    endDrag(d);
    return;
  }

  suppressNextClick = true;

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const cell = target ? target.closest('.cell') : null;
  const toSq = cell ? cell.dataset.sq : null;

  // ⬇️ NUEVO: drag de Ira → delegamos al resolver de iraTargeting
  if(d.isIraDrag){
    endDrag(d);
    if(state.targeting && state.targeting.key === 'ira' && state.targeting.resolveDrop){
      const handled = await state.targeting.resolveDrop(toSq);
      if(!handled){
        // Drop fuera de un target válido: restauramos los highlights del targeting
        // (startGhostDrag los había borrado con clearHighlights)
        const fromSq = state.targeting.from;
        const c2 = gridEl.querySelector(`[data-sq="${fromSq}"]`);
        if(c2) c2.classList.add('sel');
        for(const m of state.targeting.moves){
          const sq = m.to;
          const el = gridEl.querySelector(`[data-sq="${sq}"]`);
          if(!el) continue;
          const tsq = m.flags.includes('e') ? (m.to[0] + m.from[1]) : m.to;
          const tp = chess.get(tsq);
          const sh = tp && state.shields[tp.color].includes(tsq);
          el.classList.add(sh ? 'ira-shielded' : 'ira');
        }
      }
    }
    return;
  }

  // ---- Camino normal (drag de ajedrez) ----
  if(!toSq || toSq === d.fromSq){
    endDrag(d);
    clearHighlights();
    onSquareClick(d.fromSq);
    return;
  }

  const mv = d.legalMoves.find(m => m.to === toSq);
  if(!mv){
    endDrag(d);
    clearHighlights();
    return;
  }

  const rect = boardWrap.getBoundingClientRect();
  pendingDragDropStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };

  if(d.ghostEl){
    pendingGhostToRemove = d.ghostEl;
    d.ghostEl = null;
  }
  if(d.originalEl){
    d.originalEl.style.transition = '';
    d.originalEl.style.opacity = '';
  }
  if(d.hoverCell){
    d.hoverCell.classList.remove('hover');
    d.hoverCell = null;
  }

  state.selected = null;
  state.legalMoves = [];
  await doPlayerMove(mv);
});

/* ---------- POINTER CANCEL ---------- */
gridEl.addEventListener('pointercancel', (e) => {
  if(!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  if(d.captured){
    try { gridEl.releasePointerCapture(e.pointerId); } catch(err){}
  }
  endDrag(d);
  clearHighlights();
});

/* ---------- POINTER LEAVE ---------- */
gridEl.addEventListener('pointerleave', () => {
  if(drag) return;
  clearHoverPreview();
});

/* ---------- CLICK (con supresión post-drag) ---------- */
gridEl.addEventListener('click', (e) => {
  if(suppressNextClick){
    suppressNextClick = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  initAudio();
  if(replay.active || state.paused) return;
  if(state.aiBusy) return;
  const cell = e.target.closest('.cell');
  if(!cell) return;
  onSquareClick(cell.dataset.sq);
});

/* ---------- CONTEXT MENU ---------- */
gridEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if(replay.active || state.paused || state.aiBusy) return;
  if(state.targeting && state.targeting.key !== 'ira') cancelTargeting();
});
$('#cancelBtn').onclick = () => cancelTargeting();
$('#undoBtn').onclick = () => { initAudio(); performUndo(); };
$('#btnPause').onclick = () => togglePause();
$('#btnSound').onclick = () => {
  initAudio();
  soundEnabled = !soundEnabled;
  localStorage.setItem('ajedrez_sound', soundEnabled ? 'on' : 'off');
  updateSoundButton();
  if(masterGain){
    const target = (soundEnabled && !state.paused) ? 1 : 0;
    masterGain.gain.setTargetAtTime(target, actx.currentTime, 0.08);
  }
  // Solo suena el "ping" si activás el sonido Y no estás pausado
  if(soundEnabled && !state.paused) tone(660, .12, 'sine', .05, 200);
};
$('#btnConfig').onclick = () => {
  togglePause();
  setTimeout(() => { openQuickConfig(); }, 50);
};
$('#btnRestart').onclick = () => restartGame();
$('#btnExit').onclick = () => exitToMenu();

async function openQuickConfig(){
  const res = await showModal('Opciones', '¿Qué deseas hacer?', [
    { label:'▶ Continuar', value:'continue', cls:'yes' },
    { label:'🎨 Calidad visual', value:'quality', cls:'' },
    { label:'🔄 Reiniciar', value:'restart', cls:'no' },
    { label:'🚪 Salir al menú', value:'exit', cls:'danger' }
  ]);
  if(res === 'continue'){
    if(state.paused) togglePause();
    return;
  }
  if(res === 'quality'){
    await openQualitySettings();
    // No reanudar todavía: el usuario puede querer tocar más
    return openQuickConfig();
  }
  if(res === 'restart'){ restartGame(); return; }
  if(res === 'exit'){ exitToMenu(); return; }
}

window.addEventListener('resize', () => setTimeout(layout, 60));
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

document.addEventListener('visibilitychange', () => {
  if(!actx || !ambience.started) return;
  const target = (document.hidden || !soundEnabled || state.paused) ? 0 : 1;
  try { masterGain.gain.setTargetAtTime(target, actx.currentTime, 0.3); } catch(e){}
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;

  // Atajo FPS (ya existente)
  if(e.key === 'f' || e.key === 'F'){
    if(document.querySelector('.modal-overlay')) return;
    setShowFps(!quality.showFps);
    toast(quality.showFps ? '📊 FPS activados' : '📊 FPS desactivados', '#8ad0ff');
    return;
  }

  // ⬇️ NUEVO: navegación del replay con teclado
  if(replay.active && !replayAnimating){
    if(e.key === 'ArrowLeft'){  e.preventDefault(); replayPrev(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); replayNext(); return; }
    if(e.key === ' '){          e.preventDefault(); replayPlayPause(); return; }
    if(e.key === 'Escape'){     e.preventDefault(); closeReplay(); return; }
  }
});

function boot(){
  if(typeof Chess === 'undefined'){
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#f88">' +
      'No se pudo cargar la librería de ajedrez (chess.js). Revisa tu conexión.</div>';
    return;
  }

  // ===== Aplicar preferencias guardadas ANTES de generar el terreno =====
  const saved = loadPreferences();
  if(saved){
    // Modo / lado
    if(saved.mode){
      if(saved.mode === 'pvp'){
        aiEnabled = false; rubyMode = false;
        humanColor = 'w'; aiColor = 'b';
      } else {
        aiEnabled = true;
        aiDifficulty = saved.mode;
        rubyMode = (saved.mode === 'ruby');
        humanColor = saved.side || 'w';
        aiColor = humanColor === 'w' ? 'b' : 'w';
      }
    }
    // Reloj
    if(saved.timerMinutes !== undefined){
      gameTimer.enabled = saved.timerMinutes > 0;
      gameTimer.initial = saved.timerMinutes * 60;
      gameTimer.w = gameTimer.initial;
      gameTimer.b = gameTimer.initial;
    }
    // Bioma (preferencia bruta)
    biomePreference = saved.biome || 'random';
  }

  // ===== Resolver bioma para el terreno de arranque =====
  if(biomePreference === 'random' || !BIOMES[biomePreference]){
    currentBiome = BIOMES[BIOME_KEYS[Math.floor(Math.random() * BIOME_KEYS.length)]];
    pendingBiome = currentBiome.id;   // fijarlo para esta sesión
  } else {
    currentBiome = BIOMES[biomePreference];
    pendingBiome = biomePreference;
  }

  buildGrid();
  generateTerrain();
  updateSoundButton();
  setupDecks(['ray','shield','teleport'], ['ray','shield','teleport']);
  requestAnimationFrame(() => {
    layout();
    requestAnimationFrame(loop);
  });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>setTimeout(layout, 100));
  }
  startGame();
}
boot();
</script>
