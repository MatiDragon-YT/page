let pendingDragDropStart = null;   // { x, y } donde soltó el fantasma
let pendingGhostToRemove = null;   // nodo fantasma a eliminar tras el reflow
let hoveredSq = null;
let previewActive = false;

/* =========================================================
   IA — MINIMAX ASÍNCRONO CON INSTANCIA SEPARADA
   =========================================================
   Toda la búsqueda corre en `searchChess`, una copia local.
   La instancia global `chess` NUNCA se toca durante la búsqueda,
   así que el render y el input del usuario siguen viendo el
   estado real de la partida.
   ========================================================= */
let aiSearchAbort = false;
let aiSearchLastYield = 0;
const AI_YIELD_MS = 8;  // ceder el hilo cada 8ms para no bloquear el paint

// *** NUEVO: watchdog del modo unificado ***
let aiSearchDeadline = 0;         // 0 = sin límite activo
let aiSearchTimedOut = false;     // se activa si el watchdog dispara
const AI_UNIFIED_TIMEOUT_MS = 10000;   // 10 segundos de techo para el RUBY unificado

/* =========================================================
   TRANSPOSITION TABLE — cache por FEN
   =========================================================
   Almacena resultados de funciones puras keyed por (FEN, args).
   Evita recalcular el mismo nodo cientos de veces cuando hay
   transposiciones (muy común en ajedrez con poderes).
   ========================================================= */
const posCache = new Map();
const POS_CACHE_MAX = 80000;

function cacheGet(k){
  const v = posCache.get(k);
  if(v === undefined) return undefined;
  // LRU liviano: mover al final
  posCache.delete(k);
  posCache.set(k, v);
  return v;
}
function cacheSet(k, v){
  if(posCache.size >= POS_CACHE_MAX){
    // Evacuar 20% más antiguo (el Map preserva orden de inserción)
    const toDel = Math.floor(POS_CACHE_MAX * 0.2);
    let i = 0;
    for(const key of posCache.keys()){
      if(i++ >= toDel) break;
      posCache.delete(key);
    }
  }
  posCache.set(k, v);
}
function clearPosCache(){ posCache.clear(); }

function aiYieldIfNeeded(){
  const now = performance.now();

  // Watchdog: si la búsqueda unificada se pasó del tiempo, abortamos
  if(aiSearchDeadline && now > aiSearchDeadline){
    aiSearchTimedOut = true;
    aiSearchAbort = true;
    return null;
  }

  if(now - aiSearchLastYield > AI_YIELD_MS){
    aiSearchLastYield = now;
    return new Promise(r => setTimeout(r, 0));
  }
  return null;
}

function centerBonus(p, r, c){
  const centerDist = Math.abs(r - 3.5) + Math.abs(c - 3.5);
  if(p.type === 'n' || p.type === 'b') return (7 - centerDist) * 4;
  if(p.type === 'p') return (p.color === 'w' ? (6 - r) : (r - 1)) * 5;
  if(p.type === 'k') return -centerDist * 2;
  return 0;
}
function evaluateFor(chessObj, color){
  const board = chessObj.board();
  let score = 0;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p) continue;
    const val = PIECE_VALUE[p.type] + centerBonus(p, r, c);
    if(p.color === color) score += val;
    else score -= val;
  }
  score += (state.mana[color] - state.mana[color === 'w' ? 'b' : 'w']) * 5;
  if(state.iraCharge[color]) score += 30;
  return score;
}
function orderMoves(moves){
  return moves.sort((a, b) => {
    const aScore = (a.captured ? PIECE_VALUE[a.captured] : 0) + (a.promotion ? 800 : 0);
    const bScore = (b.captured ? PIECE_VALUE[b.captured] : 0) + (b.promotion ? 800 : 0);
    return bScore - aScore;
  });
}

async function minimax(searchChess, depth, alpha, beta, maximizing, rootColor){
  if(aiSearchAbort) return 0;
  if(depth === 0 || searchChess.game_over()) return evaluateFor(searchChess, rootColor);
  const y = aiYieldIfNeeded();
  if(y) await y;
  if(aiSearchAbort) return 0;
  const moves = searchChess.moves({ verbose: true });
  orderMoves(moves);
  if(maximizing){
    let best = -Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = await minimax(searchChess, depth-1, alpha, beta, false, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v > best) best = v;
      if(v > alpha) alpha = v;
      if(beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = await minimax(searchChess, depth-1, alpha, beta, true, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v < best) best = v;
      if(v < beta) beta = v;
      if(beta <= alpha) break;
    }
    return best;
  }
}
/* Minimax SÍNCRONO — sin Promises por nodo.
   El yielding se hace solo entre candidatos raíz. */
function minimaxSync(searchChess, depth, alpha, beta, maximizing, rootColor){
  if(aiSearchAbort) return 0;
  if(depth === 0 || searchChess.game_over()) return evaluateFor(searchChess, rootColor);
  const moves = searchChess.moves({ verbose: true });
  orderMoves(moves);
  if(maximizing){
    let best = -Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = minimaxSync(searchChess, depth-1, alpha, beta, false, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v > best) best = v;
      if(v > alpha) alpha = v;
      if(beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = minimaxSync(searchChess, depth-1, alpha, beta, true, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v < best) best = v;
      if(v < beta) beta = v;
      if(beta <= alpha) break;
    }
    return best;
  }
}

// La amenaza de cartas se calcula sobre el searchChess (no toca la global)
function computeCardThreatPenalty(searchChess, color){
  const enemy = color === 'w' ? 'b' : 'w';
  const enemyMana = state.mana[enemy];
  const enemyHand = playerDecks[enemy].hand;
  if(!enemyHand.length) return 0;
  const board = searchChess.board();
  let penalty = 0;
  if(enemyHand.includes('ray')){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || p.type === 'k') continue;
      const cost = rayCostFor(p.type);
      if(cost > enemyMana) continue;
      if(p.type === 'q') penalty += 200;
      else if(p.type === 'r') penalty += 100;
      else if(p.type === 'b' || p.type === 'n') penalty += 45;
    }
  }
  if(enemyHand.includes('zombie') && enemyMana >= POWERS.zombie.cost){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || p.type === 'k') continue;
      const sq = rcToSquare(r,c);
      if(isAdjacentToAllyOn(searchChess, sq, enemy)){
        if(p.type === 'q') penalty += 450;
        else if(p.type === 'r') penalty += 300;
        else if(p.type === 'b' || p.type === 'n') penalty += 160;
        else penalty += 45;
      }
    }
  }
  if(enemyHand.includes('quake') && enemyMana >= POWERS.quake.cost){
    for(let cr=0;cr<6;cr++) for(let cc=0;cc<6;cc++){
      let ownVal = 0, enemyVal = 0, enemyCount = 0;
      for(let dr=0;dr<=2;dr++) for(let dc=0;dc<=2;dc++){
        const p = board[cr+dr][cc+dc];
        if(!p) continue;
        if(p.color === color) ownVal += PIECE_VALUE[p.type];
        else { enemyVal += PIECE_VALUE[p.type]; enemyCount++; }
      }
      if(enemyCount > 0 && ownVal > enemyVal * 1.4 && ownVal > PIECE_VALUE.r) penalty += 60;
    }
  }
  if(enemyHand.includes('teleport') && enemyMana >= 2){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || (p.type !== 'q' && p.type !== 'r')) continue;
      let threatened = false;
      for(let rr=0;rr<8 && !threatened;rr++) for(let cc2=0;cc2<8 && !threatened;cc2++){
        const ep = board[rr][cc2];
        if(!ep || ep.color !== enemy) continue;
        const d = Math.max(Math.abs(r-rr), Math.abs(c-cc2));
        if(d >= 1 && d <= TELEPORT_MAX_DIST){
          const cost = d * 2;
          if(cost <= enemyMana){
            const sq = rcToSquare(r,c);
            if(!isSquareAttackedByEnemyOn(searchChess, sq, color)) threatened = true;
          }
        }
      }
      if(threatened) penalty += p.type === 'q' ? 70 : 35;
    }
  }
  return penalty;
}

async function findBestMove(depth, rootColor){
  const searchChess = new Chess(chess.fen());
  const moves = searchChess.moves({ verbose: true });
  if(!moves.length) return null;
  orderMoves(moves);
  aiSearchLastYield = performance.now();

  if(depth <= 1){
    let best = null, bestVal = -Infinity;
    for(const mv of moves){
      if(aiSearchAbort) return null;
      searchChess.move(mv);
      let v = evaluateFor(searchChess, rootColor) + rnd(-80, 80);
      v -= computeCardThreatPenalty(searchChess, rootColor) * 0.6;
      searchChess.undo();
      if(v > bestVal){ bestVal = v; best = mv; }
      const y = aiYieldIfNeeded();
      if(y) await y;
    }
    return aiSearchAbort ? null : best;
  }
  let bestMove = null, bestScore = -Infinity;
  let alpha = -Infinity, beta = Infinity;
  const threatWeight = rubyMode ? 1.15 : (aiDifficulty === 'hard' ? 1.0 : (aiDifficulty === 'normal' ? 0.75 : 0.5));
  for(const mv of moves){
    if(aiSearchAbort) return null;
    const moveObj = mv.promotion ? mv : (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1')
      ? { ...mv, promotion: 'q' } : mv);
    searchChess.move(moveObj);
    const score = minimaxSync(searchChess, depth - 1, alpha, beta, false, rootColor);
    const threat = computeCardThreatPenalty(searchChess, rootColor) * threatWeight;
    searchChess.undo();
    if(aiSearchAbort) return null;
    const noise = (depth === 2 && !rubyMode) ? rnd(-15, 15) : 0;
    const finalScore = score - threat + noise;
    if(finalScore > bestScore){ bestScore = finalScore; bestMove = mv; }
    if(finalScore > alpha) alpha = finalScore;
    const y = aiYieldIfNeeded();
    if(y) await y;
  }
  return bestMove;
}

/* =========================================================
   IA — Detección de jaque y simulación de escapes
   ========================================================= */
function aiIsInCheck(color){
  const savedFen = chess.fen();
  let result = false;
  try {
    const parts = savedFen.split(' ');
    parts[1] = color; parts[3] = '-'; parts[4] = '0';
    chess.load(parts.join(' '), { skipValidation: true });
    result = chess.in_check();
  } catch(e){ result = false; }
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
  return result;
}

function aiGetCheckers(color){
  const key = 'C|' + chess.fen() + '|' + color;
  const c = cacheGet(key);
  if(c !== undefined) return c;

  const savedFen = chess.fen();
  const checkers = [];
  try {
    const board = chess.board();
    let kingSq = null;
    for(let r=0;r<8 && !kingSq;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && p.type === 'k' && p.color === color){ kingSq = rcToSquare(r,c); break; }
    }
    if(kingSq){
      const opp = color === 'w' ? 'b' : 'w';
      const parts = savedFen.split(' ');
      parts[1] = opp; parts[3] = '-'; parts[4] = '0';
      chess.load(parts.join(' '), { skipValidation: true });
      const moves = chess.moves({ verbose: true });
      const seen = new Set();
      for(const m of moves){
        if(m.to === kingSq && !seen.has(m.from)){
          seen.add(m.from);
          checkers.push(m.from);
        }
      }
    }
  } catch(e){}
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}

  cacheSet(key, checkers);
  return checkers;
}

// ¿Si coloco una pieza `type` de `color` en `sq`, se resuelve el jaque?
function simPlacedPieceResolvesCheck(sq, type, color){
  const savedFen = chess.fen();
  let resolved = false;
  try {
    const parts = savedFen.split(' ');
    parts[1] = color; parts[3] = '-'; parts[4] = '0';
    chess.load(parts.join(' '), { skipValidation: true });
    if(!chess.get(sq)){
      chess.put({ type, color }, sq);
      resolved = !chess.in_check();
    }
  } catch(e){ resolved = false; }
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
  return resolved;
}

// ¿Teletransportar de `from` a `to` resuelve el jaque?
function simTeleportResolvesCheck(from, to, color){
  const savedFen = chess.fen();
  let resolved = false;
  try {
    const parts = savedFen.split(' ');
    parts[1] = color; parts[3] = '-'; parts[4] = '0';
    chess.load(parts.join(' '), { skipValidation: true });
    const piece = chess.get(from);
    if(piece && !chess.get(to)){
      chess.remove(from);
      chess.put(piece, to);
      resolved = !chess.inCheck || !chess.in_check();
    }
  } catch(e){ resolved = false; }
  try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
  return resolved;
}

function aiFindEmergencyPower(color){
  const mana = state.mana[color];
  const hand = playerDecks[color].hand;
  const opts = [];
  const checkers = aiGetCheckers(color);
  const single = checkers.length === 1;

  // -------- 1. Rayo sobre el checker (mata la pieza → valor extra real) --------
  if(hand.includes('ray') && checkers.length > 0){
    for(const sq of checkers){
      const target = chess.get(sq);
      if(!target || target.type === 'k') continue;
      const cost = rayCostFor(target.type);
      if(cost > mana) continue;
      if(single){
        opts.push({ key:'ray', sq, cost, score: 200000 + PIECE_VALUE[target.type] });
      } else {
        opts.push({ key:'ray', sq, cost, score: 200 - cost * 10 });
      }
    }
  }

  // -------- 2. Zombosis sobre un checker adyacente a un aliado --------
  if(hand.includes('zombie') && mana >= POWERS.zombie.cost && single){
    for(const sq of checkers){
      const target = chess.get(sq);
      if(!target || target.type === 'k') continue;
      if(!isAdjacentToAllyOn(chess, sq, color)) continue;
      opts.push({ key:'zombie', sq, cost: POWERS.zombie.cost, score: 200000 });
    }
  }

  // -------- 3. Teletransporte --------
  if(hand.includes('teleport')){
    const board = chess.board();

    // 3a. Huir con el rey — solo a casillas que NO son movimientos normales del rey
    const kingSq = findKing(color);
    if(kingSq){
      const normalKingMoves = new Set();
      try {
        const savedFen = chess.fen();
        const parts = savedFen.split(' ');
        parts[1] = color; parts[3] = '-'; parts[4] = '0';
        chess.load(parts.join(' '), { skipValidation: true });
        chess.moves({ square: kingSq, verbose: true }).forEach(m => normalKingMoves.add(m.to));
        chess.load(savedFen, { skipValidation: true });
      } catch(e){}

      const hasNormalEscape = normalKingMoves.size > 0;

      for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        if(board[r][c]) continue;
        const toSq = rcToSquare(r,c);

        // *** FIX 1: descartar destinos alcanzables por movimiento normal del rey ***
        if(normalKingMoves.has(toSq)) continue;

        const cost = teleportCost(kingSq, toSq);
        if(!isFinite(cost) || cost > mana) continue;
        if(!simTeleportResolvesCheck(kingSq, toSq, color)) continue;

        // *** FIX 2: si el rey ya tiene escape normal, teleport solo vale si
        // va a un destino claramente periférico y barato (huida "larga") ***
        if(hasNormalEscape){
          const toRC = sqToRC(toSq);
          const centerDist = Math.abs(toRC.r - 3.5) + Math.abs(toRC.c - 3.5);
          if(centerDist < 5 || cost > 4) continue;
        }

        const toRC = sqToRC(toSq);
        const center = Math.abs(toRC.r - 3.5) + Math.abs(toRC.c - 3.5);
        opts.push({ key:'teleport', from: kingSq, to: toSq, cost, score: 200000 - cost * 10 + center * 5 });
      }
    }

    // 3b. Bloquear con otra pieza — solo a casillas que esa pieza NO alcanza normal
    for(let r1=0;r1<8;r1++) for(let c1=0;c1<8;c1++){
      const p = board[r1][c1];
      if(!p || p.color !== color || p.type === 'k') continue;
      const fromSq = rcToSquare(r1,c1);

      const pieceNormalMoves = new Set();
      try {
        const savedFen = chess.fen();
        const parts = savedFen.split(' ');
        parts[1] = color; parts[3] = '-'; parts[4] = '0';
        chess.load(parts.join(' '), { skipValidation: true });
        chess.moves({ square: fromSq, verbose: true }).forEach(m => pieceNormalMoves.add(m.to));
        chess.load(savedFen, { skipValidation: true });
      } catch(e){}

      for(let r2=0;r2<8;r2++) for(let c2=0;c2<8;c2++){
        if(board[r2][c2]) continue;
        const toSq = rcToSquare(r2,c2);

        // *** FIX 3: descartar destinos que esa pieza alcanza normalmente ***
        if(pieceNormalMoves.has(toSq)) continue;

        const cost = teleportCost(fromSq, toSq);
        if(!isFinite(cost) || cost > mana) continue;
        if(simTeleportResolvesCheck(fromSq, toSq, color)){
          opts.push({ key:'teleport', from: fromSq, to: toSq, cost, score: 100000 - cost * 10 });
        }
      }
    }
  }

  // -------- 4. Toque Curativo bloqueando (última prioridad) --------
  // chess.js ya garantiza un movimiento legal cuando no es mate,
  // así que revivir para bloquear es redundante casi siempre.
  // Se deja con score bajo para no competir con Ray/Zombosis.
  if(hand.includes('heal')){
    const pile = state.graveyard[color];
    const types = [...new Set(pile)];
    if(types.length){
      for(const t of types){
        const cost = healCostFor(t);
        if(cost > mana) continue;
        for(let r=0;r<8;r++) for(let c=0;c<8;c++){
          if(chess.board()[r][c]) continue;
          const sq = rcToSquare(r,c);
          if(simPlacedPieceResolvesCheck(sq, t, color)){
            opts.push({ key:'heal', type:t, sq, cost, score: 50000 - cost * 20 });
          }
        }
      }
    }
  }

  if(!opts.length) return null;
  opts.sort((a,b) => b.score - a.score);
  return opts[0];
}


/* =========================================================
   RUBY — BÚSQUEDA UNIFICADA MOVIMIENTOS + PODERES
   =========================================================
   Cada poder se evalúa como un candidato al mismo nivel que los
   movimientos legales. minimax decide cuál lleva a la mejor
   posición, con una penalización por coste de maná.
   ========================================================= */

function switchTurnOn(chessObj){
  const parts = chessObj.fen().split(' ');
  parts[1] = parts[1] === 'w' ? 'b' : 'w';
  parts[3] = '-'; parts[4] = '0';
  try { chessObj.load(parts.join(' '), { skipValidation: true }); } catch(e){}
}

// Aplica un poder sobre una instancia Chess SIN animación ni efectos.
// Shield y quake no se simulan (shield no cambia el tablero, quake es
// estocástico) — esos siguen usándose como "oportunidades" heurísticas.
function applyPowerToBoard(chessObj, opt, color){
  switch(opt.key){
    case 'ray': {
      const v = chessObj.get(opt.sq);
      if(!v || v.color === color || v.type === 'k') return false;
      chessObj.remove(opt.sq);
      return true;
    }
    case 'zombie': {
      const v = chessObj.get(opt.sq);
      if(!v || v.color === color || v.type === 'k') return false;
      const t = v.type;
      chessObj.remove(opt.sq);
      try { chessObj.put({ type: t, color }, opt.sq); } catch(e){ return false; }
      return true;
    }
    case 'teleport': {
      const p = chessObj.get(opt.from);
      if(!p || p.color !== color) return false;
      if(chessObj.get(opt.to)) return false;
      chessObj.remove(opt.from);
      try { chessObj.put(p, opt.to); } catch(e){ return false; }
      return true;
    }
    case 'heal': {
      if(chessObj.get(opt.sq)) return false;
      try { chessObj.put({ type: opt.type, color }, opt.sq); } catch(e){ return false; }
      return true;
    }
    default:
      return false;  // shield, quake — se evalúan aparte
  }
}

// Enumera poderes candidatos con filtros duros y los recorta por
// peso heurístico para no explotar el árbol.
function aiEnumeratePowerOptions(color, mana, hand){
  const all = [];
  const board = chess.board();
  const enemyKingSq = findKing(color === 'w' ? 'b' : 'w');

  // --- Rayo ---
  if(hand.includes('ray')){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color === color || p.type === 'k') continue;
      const cost = rayCostFor(p.type);
      if(cost > mana) continue;
      // Solo vale la pena si elimina amenaza o gana material importante
      all.push({ key:'ray', sq: rcToSquare(r,c), cost, weight: PIECE_VALUE[p.type] });
    }
  }

  // --- Zombosis ---
  if(hand.includes('zombie') && mana >= POWERS.zombie.cost){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color === color || p.type === 'k') continue;
      const sq = rcToSquare(r,c);
      if(!isAdjacentToAllyOn(chess, sq, color)) continue;
      all.push({ key:'zombie', sq, cost: POWERS.zombie.cost, weight: PIECE_VALUE[p.type] * 2 });
    }
  }

  // --- Toque Curativo ---
  if(hand.includes('heal')){
    const types = [...new Set(state.graveyard[color])];
    const empties = getAdjacentEmptySquares(color);
    for(const t of types){
      const cost = healCostFor(t);
      if(cost > mana) continue;
      for(const sq of empties){
        all.push({ key:'heal', type:t, sq, cost, weight: PIECE_VALUE[t] });
      }
    }
  }

  // --- Teletransporte (pre-filtrado) ---
  if(hand.includes('teleport') && mana >= 2){
    for(let r1=0;r1<8;r1++) for(let c1=0;c1<8;c1++){
      const p = board[r1][c1];
      if(!p || p.color !== color) continue;

      // *** FILTRO: solo piezas amenazadas o atacantes valen la pena ***
      const isAttacker = p.type === 'q' || p.type === 'r' || p.type === 'b' || p.type === 'n';
      const srcAttacked = isSquareAttackedByEnemyOn(chess, rcToSquare(r1,c1), color);
      if(!isAttacker && !srcAttacked) continue;   // peones tranquilos → fuera

      const fromSq = rcToSquare(r1,c1);
      const normalMoves = new Set();
      try {
        const savedFen = chess.fen();
        const parts = savedFen.split(' ');
        parts[1] = color; parts[3] = '-'; parts[4] = '0';
        chess.load(parts.join(' '), { skipValidation: true });
        chess.moves({ square: fromSq, verbose: true }).forEach(m => normalMoves.add(m.to));
        chess.load(savedFen, { skipValidation: true });
      } catch(e){}

      const srcVal = PIECE_VALUE[p.type];

      for(let r2=0;r2<8;r2++) for(let c2=0;c2<8;c2++){
        if(board[r2][c2]) continue;
        const toSq = rcToSquare(r2,c2);
        if(normalMoves.has(toSq)) continue;
        const cost = teleportCost(fromSq, toSq);
        if(!isFinite(cost) || cost > mana) continue;
        if(simMoveLeavesKingInCheck(fromSq, toSq, color)) continue;

        let weight = 0;
        if(srcAttacked) weight += srcVal * 0.4;

        const savedFen2 = chess.fen();
        try {
          chess.remove(fromSq);
          chess.put(p, toSq);
          if(chess.in_check()) weight += 120;
        } catch(e){}
        try { chess.load(savedFen2, { skipValidation: true }); } catch(e){}

        if(enemyKingSq && isAttacker){
          const ek = sqToRC(enemyKingSq);
          const dFrom = Math.max(Math.abs(r1-ek.r), Math.abs(c1-ek.c));
          const dTo   = Math.max(Math.abs(r2-ek.r), Math.abs(c2-ek.c));
          if(dTo < dFrom) weight += (dFrom - dTo) * 15;
        }

        if(weight < 30) continue;
        all.push({ key:'teleport', from: fromSq, to: toSq, cost, weight });
      }
    }
  }

  all.sort((a,b) => b.weight - a.weight);
  return all.slice(0, 14);  // techo de candidatos
}

// Punto de entrada de RUBY
async function aiFindBestActionUnified(color, depth){
  const searchChess = new Chess(chess.fen());
  const candidates = [];

  const moves = searchChess.moves({ verbose: true });
  orderMoves(moves);
  for(const mv of moves) candidates.push({ kind:'move', mv });

  const mana = state.mana[color];
  const hand = playerDecks[color].hand;
  if(hand.length && mana >= 2){
    // *** cap reducido: 8 candidatos en vez de 14 ***
    for(const opt of aiEnumeratePowerOptions(color, mana, hand).slice(0, 8)){
      candidates.push({ kind:'power', opt });
    }
  }

  if(!candidates.length) return null;

  aiSearchLastYield = performance.now();
  let best = null, bestScore = -Infinity;
  let alpha = -Infinity;

  for(const c of candidates){
    if(aiSearchAbort) return null;

    const savedFen = searchChess.fen();
    let applied = false;

    if(c.kind === 'move'){
      const moveObj = c.mv.promotion ? c.mv : (
        c.mv.piece === 'p' && (c.mv.to[1] === '8' || c.mv.to[1] === '1')
          ? { ...c.mv, promotion: 'q' } : c.mv
      );
      try { applied = !!searchChess.move(moveObj); } catch(e){ applied = false; }
    } else {
      applied = applyPowerToBoard(searchChess, c.opt, color);
      if(applied) switchTurnOn(searchChess);
    }

    if(!applied){
      try { searchChess.load(savedFen, { skipValidation: true }); } catch(e){}
      continue;
    }

    // *** minimaxSync en vez de minimax ***
    const score = minimaxSync(searchChess, depth - 1, alpha, Infinity, false, color);

    try { searchChess.load(savedFen, { skipValidation: true }); } catch(e){}

    const manaCost = c.kind === 'power' ? (c.opt.cost || 0) : 0;
    const finalScore = score - manaCost * 25;

    if(finalScore > bestScore){
      bestScore = finalScore;
      best = c;
    }
    if(finalScore > alpha) alpha = finalScore;

    const y = aiYieldIfNeeded();
    if(y) await y;
  }

  return best;
}

/* =========================================================
   IA — BÚSQUEDA DE PODERES (async con yields en los pesados)
   ========================================================= */
function aiFindRayOption(color, mana, hand){
  if(!hand.includes('ray')) return null;
  const board = chess.board();
  const opts = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color === color || p.type === 'k') continue;
    const cost = rayCostFor(p.type);
    if(cost > mana) continue;
    const score = PIECE_VALUE[p.type] - cost * 30;
    opts.push({ key:'ray', sq: rcToSquare(r,c), cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindZombieOption(color, mana, hand){
  if(!hand.includes('zombie') || mana < POWERS.zombie.cost) return null;
  const board = chess.board();
  const opts = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color === color || p.type === 'k') continue;
    const sq = rcToSquare(r,c);
    if(!isAdjacentToAllyOn(chess, sq, color)) continue;
    const score = PIECE_VALUE[p.type] * 2 - POWERS.zombie.cost * 30;
    opts.push({ key:'zombie', sq, cost: POWERS.zombie.cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindHealOption(color, mana, hand){
  if(!hand.includes('heal')) return null;
  const pile = state.graveyard[color];
  const empties = getAdjacentEmptySquares(color);
  if(!empties.length) return null;
  const seen = new Set();
  const opts = [];
  for(const t of pile){
    if(seen.has(t)) continue;
    seen.add(t);
    const cost = healCostFor(t);
    if(cost > mana) continue;
    const score = PIECE_VALUE[t] - cost * 30 - 60;
    opts.push({ key:'heal', type:t, sq: empties[0], cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindShieldOption(color, mana, hand){
  if(!hand.includes('shield') || mana < POWERS.shield.cost) return null;
  if(state.shields[color].length > 0) return null;
  const board = chess.board();
  const opts = [];
  const enemyColor = color === 'w' ? 'b' : 'w';
  const savedTurn = chess.turn();
  const parts = chess.fen().split(' ');
  parts[1] = enemyColor;
  let enemyMoves = [];
  try {
    chess.load(parts.join(' '), { skipValidation: true });
    enemyMoves = chess.moves({ verbose: true });
    const fen2 = chess.fen().split(' ');
    fen2[1] = savedTurn;
    chess.load(fen2.join(' '), { skipValidation: true });
  } catch(e){}
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color !== color) continue;
    const sq = rcToSquare(r,c);
    if(!enemyMoves.some(m => m.to === sq)) continue;
    let score = 0;
    if(p.type === 'k') score = 5000;
    else if(p.type === 'q') score = 700;
    else if(p.type === 'r') score = 400;
    else if(p.type === 'b' || p.type === 'n') score = 250;
    else continue;
    score -= POWERS.shield.cost * 30;
    opts.push({ key:'shield', sq, cost: POWERS.shield.cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindTeleportOption(color, mana, hand){
  if(!hand.includes('teleport')) return null;
  if(mana < 2) return null;
  const enemyKing = findKing(color === 'w' ? 'b' : 'w');
  const ek = enemyKing ? sqToRC(enemyKing) : null;
  const board = chess.board();
  const opts = [];
  aiSearchLastYield = performance.now();
  for(let r1=0;r1<8;r1++) for(let c1=0;c1<8;c1++){
    const y = aiYieldIfNeeded();
    if(y) await y;
    if(aiSearchAbort) return null;
    const p = board[r1][c1];
    if(!p || p.color !== color) continue;
    // *** FIX: no vale la pena teletransportar al rey en modo normal — es la pieza que menos se mueve "por gusto" ***
    if(p.type === 'k') continue;
    const fromSq = rcToSquare(r1,c1);
    const normalMoves = new Set();
    try {
      const savedFen = chess.fen();
      const parts = savedFen.split(' ');
      parts[1] = color; parts[3] = '-'; parts[4] = '0';
      chess.load(parts.join(' '), { skipValidation: true });
      chess.moves({ square: fromSq, verbose: true }).forEach(m => normalMoves.add(m.to));
      chess.load(savedFen, { skipValidation: true });
    } catch(e){}
    const srcAttacked = isSquareAttackedByEnemy(fromSq, color);
    const srcValue = PIECE_VALUE[p.type];
    for(let r2=0;r2<8;r2++) for(let c2=0;c2<8;c2++){
      if(board[r2][c2]) continue;
      const toSq = rcToSquare(r2,c2);
      if(normalMoves.has(toSq)) continue;
      const cost = teleportCost(fromSq, toSq);
      if(!isFinite(cost) || cost > mana) continue;
      if(simMoveLeavesKingInCheck(fromSq, toSq, color)) continue;
      const dstAttacked = isSquareAttackedByEnemy(toSq, color);
      let reason = 0;
      if(srcAttacked && !dstAttacked) reason += srcValue * 0.5;
      let givesCheck = false;
      const savedFen2 = chess.fen();
      try {
        chess.remove(fromSq);
        chess.put(p, toSq);
        givesCheck = chess.in_check();
      } catch(e){}
      try { chess.load(savedFen2, { skipValidation: true }); } catch(e){}
      if(givesCheck) reason += 150;
      if(ek && (p.type === 'q' || p.type === 'r')){
        const distFrom = Math.max(Math.abs(r1-ek.r), Math.abs(c1-ek.c));
        const distTo = Math.max(Math.abs(r2-ek.r), Math.abs(c2-ek.c));
        if(distTo < distFrom - 1 && distTo <= 3) reason += 55;
      }
      if(p.type === 'n' || p.type === 'b'){
        const bonusFrom = centerBonus(p, r1, c1);
        const bonusTo = centerBonus(p, r2, c2);
        if(bonusTo - bonusFrom >= 16) reason += 45;
      }
      if(reason <= 0) continue;
      if(dstAttacked && !srcAttacked) reason -= srcValue * 0.35;
      else if(dstAttacked && srcAttacked) reason -= srcValue * 0.15;
      reason -= cost * 22;
      // *** FIX: exigir ganancia real mínima ***
      if(reason < 55) continue;
      opts.push({ key:'teleport', from: fromSq, to: toSq, cost, score: reason });
    }
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindQuakeOption(color, mana, hand){
  if(!hand.includes('quake') || mana < POWERS.quake.cost) return null;
  const board = chess.board();
  const opts = [];
  aiSearchLastYield = performance.now();
  for(let cr=0;cr<8;cr++){
    const y = aiYieldIfNeeded();
    if(y) await y;
    if(aiSearchAbort) return null;
    for(let cc=0;cc<8;cc++){
      let enemyVal = 0, ownVal = 0, enemyCount = 0;
      const squares = [];
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const r = cr+dr, c = cc+dc;
        if(r<0||c<0||r>=8||c>=8) continue;
        squares.push(rcToSquare(r,c));
        const p = board[r][c];
        if(!p) continue;
        if(p.color === color) ownVal += PIECE_VALUE[p.type];
        else { enemyVal += PIECE_VALUE[p.type]; enemyCount++; }
      }
      if(enemyCount === 0) continue;
      const net = enemyVal - ownVal;
      if(net < PIECE_VALUE.n) continue;
      const snapshot = [];
      for(const sq of squares){
        const p = chess.get(sq);
        if(p) snapshot.push({ sq, piece: p });
      }
      const savedFen = chess.fen();
      let safeCount = 0, totalTries = 5;
      for(let attempt=0; attempt<totalTries; attempt++){
        const trial = [...squares];
        for(let i=trial.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [trial[i],trial[j]] = [trial[j],trial[i]];
        }
        for(const sq of squares) chess.remove(sq);
        for(let i=0;i<snapshot.length;i++){
          try { chess.put(snapshot[i].piece, trial[i]); } catch(e){}
        }
        let safe = true;
        try {
          const parts = chess.fen().split(' ');
          parts[1] = color; parts[3] = '-'; parts[4] = '0';
          chess.load(parts.join(' '), { skipValidation: true });
          safe = !chess.in_check();
        } catch(e){ safe = true; }
        try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
        if(safe) safeCount++;
      }
      if(safeCount < totalTries * 0.6) continue;
      const score = net * 0.35 - POWERS.quake.cost * 30;
      if(score > 0) opts.push({ key:'quake', sq: rcToSquare(cr,cc), cost: POWERS.quake.cost, score });
    }
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindBestPower(color){
  // *** FIX: si está en jaque, solo consideramos poderes que lo resuelvan ***
  if(aiIsInCheck(color)){
    const emergency = aiFindEmergencyPower(color);
    if(emergency) return emergency;
    return null;  // ningún poder salva → que la IA mueva normal (findBestMove resolverá)
  }

  // === Modo normal (sin jaque) ===
  const mana = state.mana[color];
  const hand = playerDecks[color].hand;
  const candidates = [];
  const push = c => { if(c) candidates.push(c); };
  push(aiFindRayOption(color, mana, hand));
  push(aiFindZombieOption(color, mana, hand));
  push(aiFindHealOption(color, mana, hand));
  push(aiFindShieldOption(color, mana, hand));
  push(await aiFindTeleportOption(color, mana, hand));
  push(await aiFindQuakeOption(color, mana, hand));
  candidates.sort((a,b) => b.score - a.score);
  return candidates[0] || null;
}
async function aiExecutePower(opt){
  switch(opt.key){
    case 'ray': await execRay(opt.sq, opt.cost); break;
    case 'zombie': await execZombie(opt.sq); break;
    case 'shield': await execShield(opt.sq); break;
    case 'heal': {
      const targetSq = opt.sq || (getAdjacentEmptySquares(aiColor)[0] || null);
      if(targetSq) await execHeal(targetSq, opt.type, aiColor, opt.cost);
      else endTurn();
      break;
    }
    case 'teleport': await execTeleport(opt.from, opt.to, opt.cost); break;
    case 'quake': await execQuake(opt.sq); break;
    default: endTurn();
  }
}
async function aiTurn(){
  if(aiThinking) return;
  if(!aiEnabled || state.gameOver || replay.active || state.paused) return;
  if(chess.turn() !== aiColor) return;

  aiThinking = true;
  state.aiBusy = true;
  try {
    await _aiTurnInner();
  } finally {
    aiThinking = false;
    state.aiBusy = false;
    updateUI();
  }
}

async function _aiTurnInner(){
  aiSearchAbort = false;
  aiSearchTimedOut = false;
  aiSearchDeadline = 0;
  aiSearchLastYield = performance.now();
  updateUI();
  await sleep(180);

  if(state.gameOver || replay.active || state.paused || aiSearchAbort || chess.turn() !== aiColor){
    return;
  }

  // *** RUBY unificado solo si NO hay timer activo ***
  const useUnified = rubyMode && !gameTimer.enabled;

  if(useUnified){
    // *** Watchdog antes de arrancar ***
    aiSearchDeadline = performance.now() + AI_UNIFIED_TIMEOUT_MS;
    aiSearchTimedOut = false;

    let action = null;
    try { action = await aiFindBestActionUnified(aiColor, 3); }
    catch(e){ console.warn('RUBY unified error:', e); }

    aiSearchDeadline = 0;

    // Si el usuario pausó / salió / terminó la partida durante la búsqueda
    if(state.gameOver || replay.active || state.paused){
      return;
    }

    // *** Timeout → fallback a minimax clásico depth 2 ***
    if(aiSearchTimedOut){
      console.warn('[RUBY] Timeout en búsqueda unificada. Fallback a minimax depth 2.');
      aiSearchTimedOut = false;
      aiSearchAbort = false;
      aiSearchLastYield = performance.now();

      let fallbackMove = null;
      try { fallbackMove = await findBestMove(2, aiColor); }
      catch(e){ console.warn('RUBY fallback error:', e); }

      // Si durante el fallback el usuario volvió a interrumpir
      if(state.gameOver || replay.active || state.paused){
        return;
      }

      if(fallbackMove) await doPlayerMove(fallbackMove);
      else endTurn();
      return;
    }

    // Camino normal del unificado
    if(action && action.kind === 'power')      await aiExecutePower(action.opt);
    else if(action && action.kind === 'move')  await doPlayerMove(action.mv);
    else endTurn();
    return;
  }

  // ===== Camino legacy (Easy / Normal / Hard / Ruby con timer) =====
  const depth = rubyMode ? 3
              : (aiDifficulty === 'easy' ? 1
              : (aiDifficulty === 'normal' ? 2
              : 3));
  let bestMove = null;
  try { bestMove = await findBestMove(depth, aiColor); }
  catch(e){ console.warn('AI error:', e); }

  if(aiSearchAbort || state.gameOver || replay.active || state.paused){
    return;
  }

  let powerOption = null;
  try { powerOption = await aiFindBestPower(aiColor); }
  catch(e){ console.warn('AI power error:', e); }

  if(aiSearchAbort || state.gameOver || replay.active || state.paused){
    return;
  }

  let usePower = false;
  if(powerOption){
    let threshold;
    if(rubyMode) threshold = 0;
    else if(aiDifficulty === 'hard') threshold = 80;
    else if(aiDifficulty === 'normal') threshold = 150;
    else threshold = 500;
    usePower = powerOption.score >= threshold;
    if(rubyMode && state.mana[aiColor] >= 6 && powerOption.score > 0) usePower = true;
    if(rubyMode && powerOption.score > PIECE_VALUE.r * 0.5) usePower = true;
  }

  if(usePower)          await aiExecutePower(powerOption);
  else if(bestMove)     await doPlayerMove(bestMove);
  else                  endTurn();
}

function startReplay(){
  historyEl.classList.add('replay-mode');
  if(historyLog.length < 2){ toast('Sin acciones para reproducir'); return; }
  aiSearchAbort = true;
  state.aiBusy = false;
  if(!replay.storedMatch){ replay.originalHistory = null; }
  replay.active = true; replay.index = 0; replay.playing = false; playToken++;
  stopTimer();
  state.lastMove = { from: null, to: null, prevFrom: null, prevTo: null };
  state.powerHighlights = [];   // ⬅️ NUEVO
clearHighlights();

  // *** FIX: garantizar instancia válida de chess ***
  if(!chess) chess = new Chess();

  $('#replayUI').classList.remove('hidden');

  const entry = historyLog[0];
  if(!entry || !entry.fen){
    console.error('Replay: entrada inicial sin FEN', entry);
    toast('Datos de partida corruptos', '#ff8080');
    replay.active = false;
    $('#replayUI').classList.add('hidden');
    replay.speedMult = 1.0;
    updateSpeedButton();
    return;
  }

  // *** FIX: cargar el FEN y comprobar que realmente se aplicó ***
  let loaded = false;
  try {
    const res = chess.load(entry.fen, { skipValidation: true });
    loaded = (res !== false);
  } catch(e){ loaded = false; }
  if(!loaded){
    try {
      const res = chess.load(entry.fen);
      loaded = (res !== false);
    } catch(e2){ loaded = false; }
  }
  if(!loaded){
    console.error('Replay: FEN inválido, se reinicia tablero', entry.fen);
    chess = new Chess();
    try { chess.load(entry.fen); } catch(e){}
  }

  rebuildPieces();
  particles.length = 0; bolts.length = 0; curves.length = 0; ripples.length = 0;
  updateReplayUI(entry, 0);
  updateReplayControls();
}
function startReplayFromStored(match){
  if(!match || !match.moves || !match.moves.length){
    toast('Partida vacía o corrupta', '#ff8080');
    return false;
  }
  aiSearchAbort = true;
  state.aiBusy = false;
  replay.storedMatch = match;
  replay.originalHistory = historyLog.slice();
  historyLog.length = 0;
  match.moves.forEach(m => historyLog.push(JSON.parse(JSON.stringify(m))));
  historyEl.innerHTML = '';
  for(const m of historyLog){
    const el = renderHistoryItem(m);
    historyEl.appendChild(el);
  }
  // *** FIX: aplicar el clima guardado de esa partida ***
  if(match.weather) applyWeatherState(match.weather);

  if(match.biomeId && BIOMES[match.biomeId]){
    currentBiome = BIOMES[match.biomeId];
    if(boardW > 0 && boardH > 0) renderTerrain(boardW, boardH);
  }

  // ⬇️ NUEVO: restaurar la orientación original de esa partida
  flipBoard = !!(match.aiEnabled && match.humanColor === 'b');
  applyGridFlip();
  replayFromMenu = true;
  startReplay();
  return replay.active;
}
function closeReplay(){
  historyEl.classList.remove('replay-mode');
  stopReplayAuto();
  replay.active = false; replayAnimating = false;
  $('#replayUI').classList.add('hidden');

  const wasFromMenu = replayFromMenu;
  replayFromMenu = false;

  // Restaurar el historial de la partida anterior (si lo había)
  if(replay.storedMatch && replay.originalHistory){
    historyLog.length = 0;
    replay.originalHistory.forEach(m => historyLog.push(m));
    historyEl.innerHTML = '';
    for(const m of historyLog){
      const el = renderHistoryItem(m);
      historyEl.appendChild(el);
    }
    replay.storedMatch = null;
    replay.originalHistory = null;
  }

  // *** FIX: si el replay vino desde el menú principal, volver al menú ***
  if(wasFromMenu){
    setTimeout(() => { startGame(); }, 150);
    return;
  }

  // Cierre normal (si hubiera partida en curso, aunque hoy no se da el caso)
  if(!chess) chess = new Chess();
  const last = historyLog[historyLog.length - 1];
  if(last && last.fen){
    try { chess.load(last.fen, { skipValidation: true }); } catch(e){
      try { chess.load(last.fen); } catch(e2){}
    }
  }
  rebuildPieces();
  particles.length = 0; bolts.length = 0; curves.length = 0; ripples.length = 0;
  for(const el of historyEl.children) el.classList.remove('replay-active');
  updateUI();
}

      spawnSmokeAt(C.x, C.y, 'rgba(120,100,70,0.5)');
      const { r:cr, c:cc } = sqToRC(entry.to);
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const r2 = cr+dr, c2 = cc+dc;
        if(r2<0||c2<0||r2>=8||c2>=8) continue;
        const c3 = squareCenter(rcToSquare(r2,c2));
        ripples.push({ x:c3.x, y:c3.y, r:2, maxR: cellSize*0.9, life:.5, lifeMax:.5, color:'200,170,120' });
      }
      return;
    }
  }
}
async function applyReplayFrameAnimated(i){
  if(replayAnimating) return;
  replayAnimating = true; updateReplayControls();
  const entry = historyLog[i];
  if(!entry){ replayAnimating = false; updateReplayControls(); return; }
  const oldBoard = chess.board();
  const oldEntries = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(oldBoard[r][c]){
      const sq = rcToSquare(r,c);
      oldEntries.push({ sq, piece: oldBoard[r][c], el: pieceEls.get(sq) });
    }
  }
  try { chess.load(entry.fen, { skipValidation: true }); } catch(e){
    try { chess.load(entry.fen); } catch(e2){}
  }
  const newBoard = chess.board();
  const newEntries = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(newBoard[r][c]) newEntries.push({ sq: rcToSquare(r,c), piece: newBoard[r][c] });
  }
  const usedOld = new Set();
  const matchMap = new Map();
  if((entry.type === 'move' || entry.type === 'ira') && entry.from && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.from && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.from); matchMap.set(entry.to, oldP); }
  } else if(entry.type === 'spell' && entry.powerName === 'Teletransporte' && entry.from && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.from && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.from); matchMap.set(entry.to, oldP); }
  } else if(entry.type === 'spell' && entry.powerName === 'Zombosis' && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.to && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.to); matchMap.set(entry.to, oldP); }
  }
  for(const np of newEntries){
    if(matchMap.has(np.sq)) continue;
    const old = oldEntries.find(o => !usedOld.has(o.sq) && o.sq === np.sq &&
      o.piece.color === np.piece.color && o.piece.type === np.piece.type);
    if(old){ usedOld.add(old.sq); matchMap.set(np.sq, old); }
  }
  for(const np of newEntries){
    if(matchMap.has(np.sq)) continue;
    const cands = oldEntries.filter(o => !usedOld.has(o.sq) &&
      o.piece.color === np.piece.color && o.piece.type === np.piece.type);
    if(!cands.length) continue;
    const npRC = sqToRC(np.sq);
    let best = null, bestD = Infinity;
    for(const o of cands){
      const orc = sqToRC(o.sq);
      const d = Math.abs(orc.r - npRC.r) + Math.abs(orc.c - npRC.c);
      if(d < bestD){ bestD = d; best = o; }
    }
    if(best){ usedOld.add(best.sq); matchMap.set(np.sq, best); }
  }
  const capturedEls = [];
  for(const op of oldEntries){
    if(!usedOld.has(op.sq) && op.el) capturedEls.push(op.el);
  }
  if(capturedEls.length){
    setTimeout(() => {
      for(const el of capturedEls){
        el.classList.add('captured');
        setTimeout(()=>el.remove(), 300);
      }
    }, 90);
  }
  pieceEls.clear();
  for(const np of newEntries){
    const m = matchMap.get(np.sq);
    let el;
    if(m && m.el){
      el = m.el;
      el.classList.toggle('white', np.piece.color === 'w');
      el.classList.toggle('black', np.piece.color === 'b');
      el.querySelector('.tok').textContent = GLYPH[np.piece.type];
      el.dataset.code = np.piece.color + np.piece.type;
      positionPiece(el, np.sq);
    } else {
      el = createPieceEl(np.piece, np.sq);
      el.classList.add('spawn');
      setTimeout(()=>el.classList.remove('spawn'), 400);
    }
    pieceEls.set(np.sq, el);
    updatePieceClass(el, np.piece, np.sq);
  }
  playReplayEffects(entry);
  updateReplayUI(entry, i);
  await sleep(420 / replay.speedMult);
  replayAnimating = false;
  updateReplayControls();
}
async function replayGoTo(i){
  if(replayAnimating) return;
  if(i < 0 || i >= historyLog.length) return;
  replay.index = i;
  await applyReplayFrameAnimated(i);
}
function replayPrev(){ if(!replay.active) return; stopReplayAuto(); if(replay.index > 0) replayGoTo(replay.index - 1); }
function replayNext(){ if(!replay.active) return; stopReplayAuto(); if(replay.index < historyLog.length - 1) replayGoTo(replay.index + 1); }
function replayPlayPause(){ if(!replay.active) return; if(replay.playing) stopReplayAuto(); else startReplayAuto(); }
async function startReplayAuto(){
  if(replay.playing) return;
  replay.playing = true;
  const token = ++playToken;
  updateReplayControls();
  if(replay.index >= historyLog.length - 1) replay.index = 0;
  while(token === playToken && replay.playing && replay.active && replay.index < historyLog.length - 1){
    replay.index++;
    await applyReplayFrameAnimated(replay.index);
    if(token !== playToken) break;
    await sleep(80 / replay.speedMult);
  }
  if(token === playToken){ replay.playing = false; updateReplayControls(); }
}
function stopReplayAuto(){ playToken++; replay.playing = false; updateReplayControls(); }
function updateReplayControls(){
  const btn = $('#rPlay');
  if(btn) btn.textContent = replay.playing ? '⏸' : '▶';
  const disabled = replayAnimating;
  $('#rPrev').disabled = disabled || replay.index <= 0;
  $('#rNext').disabled = disabled || replay.index >= historyLog.length - 1;
}

          <button class="export" title="Exportar">⬇</button>
          <button class="del" title="Eliminar">🗑</button>

        item.querySelector('.replay').onclick = () => {
          closeModal({ action: 'replay', match });
        };
        item.querySelector('.rename').onclick = async () => {
          const newName = prompt('Nuevo nombre para la partida:', match.name);

          item.querySelector('.nm').textContent = trimmed;
        };
        item.querySelector('.export').onclick = () => exportMatch(match);

          const ok = await showModal('Eliminar partida',

            [ { label:'Cancelar', value:false, cls:'no' },
              { label:'Eliminar', value:true, cls:'danger' } ]);
          if(!ok) return;
          const l = loadMatchList();
          const idx = l.findIndex(x => x.id === match.id);
          if(idx >= 0){ l.splice(idx, 1); saveMatchList(l); }
          item.remove();
          const cnt = l.length;
          m.querySelector('p').textContent = `${cnt} ${cnt === 1 ? 'partida' : 'partidas'} guardadas`;

    bw.appendChild(importBtn); bw.appendChild(closeBtn);
    m.appendChild(bw);

    document.body.appendChild(ov);
  });

function exportMatch(match){
  const data = JSON.stringify(match, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = 'ajedrez_' + (match.name || match.id).replace(/[^a-z0-9_\-]/gi, '_') + '.json';
  a.href = url; a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Partida exportada', '#a8e8b0');
}
function importMatchFromFile(parentOverlay){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !data.moves || !Array.isArray(data.moves)){
        toast('Archivo inválido', '#ff8080');
        return;
      }
      if(!data.id) data.id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      if(!data.name) data.name = new Date(data.date || Date.now()).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      if(!data.date) data.date = Date.now();
      const l = loadMatchList();
      if(l.some(x => x.id === data.id)){
        data.id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      }
      l.unshift(data);
      if(l.length > 50) l.length = 50;
      saveMatchList(l);
      toast('Partida importada ✓', '#a8e8b0');
      if(parentOverlay) parentOverlay.remove();
      setTimeout(openMatchHistory, 250);
    } catch(err){
      console.error(err);
      toast('No se pudo importar el archivo', '#ff8080');
    }
  };
  input.click();
}

    m.appendChild(bw);
    refreshPicked();
  });

async function showStartMenu(){
  while(true){
    const res = await showConfigMenu();
    if(res.action === 'cancel') return 'cancel';
    if(res.action === 'history'){
      const histRes = await openMatchHistory();
      if(histRes && histRes.action === 'replay' && histRes.match){
        const started = startReplayFromStored(histRes.match);
        if(started){
          // *** FIX: salir del bucle SIN volver a abrir el menú ***
          return 'replay';
        }
        // si no arrancó (datos corruptos), seguir el bucle normalmente
      }
      continue;
    }
    if(res.action === 'start'){
      const cfg = res.cfg;
      savePreferences(cfg);          // ⬅️ NUEVO: persistir antes que nada

      if(cfg.mode === 'pvp'){
        aiEnabled = false; rubyMode = false;
        humanColor = 'w'; aiColor = 'b';
      } else {
        aiEnabled = true;
        aiDifficulty = cfg.mode;
        rubyMode = (cfg.mode === 'ruby');
        humanColor = cfg.side;
        aiColor = cfg.side === 'w' ? 'b' : 'w';
      }
      gameTimer.enabled = cfg.timerMinutes > 0;
      gameTimer.initial = cfg.timerMinutes * 60;
      gameTimer.w = gameTimer.initial;
      gameTimer.b = gameTimer.initial;

      pendingBiome = cfg.biome || 'random';   // ⬅️ mover esto acá si no estaba
      return 'start';
    }
  }
}
async function doDraft(){
  let wPicks, bPicks;
  if(!aiEnabled){
    wPicks = await showDraftModal('w');
    bPicks = await showDraftModal('b');
  } else if(humanColor === 'w'){
    wPicks = await showDraftModal('w');
    bPicks = shuffle([...ALL_CARD_KEYS]).slice(0, 3);
  } else {
    wPicks = shuffle([...ALL_CARD_KEYS]).slice(0, 3);
    bPicks = await showDraftModal('b');
  }
  setupDecks(wPicks, bPicks);
}
async function startGame() {
  initAudio();
  const mode = await showStartMenu();
  if (mode !== 'start') return; // 'cancel' o 'replay' → no iniciar partida nueva
  await doDraft();
  newGame();
  renderPlayerHand();
  renderOppHand();
  if (aiEnabled && aiColor === 'w') {
    setTimeout(aiTurn, 900);
  }
}

/* =========================================================
   DIBUJO DE CUADRÍCULA — 3 modos
   ========================================================= */
function drawGridRadial(W, H, phase){
  const q = currentQuality();
  const step = W / 8;
  const lw = Math.max(1, W / 480);
  const stops = q.gridStops;

  const wrapDist = (fase) => {
    let d = fase - phase;
    if(d < -0.5) d += 1;
    if(d >  0.5) d -= 1;
    return d;
  };
  const waveWidth = 0.14;
  const waveAmp = (fase) => {
    const d = wrapDist(fase);
    return Math.exp(-(d * d) / (waveWidth * waveWidth));
  };
  const echoWidth = 0.22;
  const echoAmp = (fase) => {
    const d = wrapDist(fase + 0.11);
    return Math.exp(-(d * d) / (echoWidth * echoWidth));
  };

  const baseA = 0.040, peakA = 0.46, echoPeakA = 0.14;
  const rgbAt = (b) => ({
    r: Math.round(220 + b * 35),
    g: Math.round(232 + b * 20),
    bl: Math.round(255 - b * 55)
  });
  const alphaAt = (fase) => {
    const b = waveAmp(fase);
    const e = echoAmp(fase);
    return Math.min(0.78, baseA + b * (peakA - baseA) + e * echoPeakA);
  };

  // ---- Líneas verticales y horizontales con gradiente ----
  ctx.save();
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';

  for(let i = 0; i <= 8; i++){
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    for(let s = 0; s <= stops; s++){
      const f = s / stops;
      const fase = i / 16 + f * 0.5;
      const c = rgbAt(waveAmp(fase));
      grad.addColorStop(f, `rgba(${c.r},${c.g},${c.bl},${alphaAt(fase)})`);
    }
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(i * step + lw * 0.5, 0);
    ctx.lineTo(i * step + lw * 0.5, H);
    ctx.stroke();
  }
  for(let i = 0; i <= 8; i++){
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    for(let s = 0; s <= stops; s++){
      const f = s / stops;
      const fase = i / 16 + f * 0.5;
      const c = rgbAt(waveAmp(fase));
      grad.addColorStop(f, `rgba(${c.r},${c.g},${c.bl},${alphaAt(fase)})`);
    }
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, i * step + lw * 0.5);
    ctx.lineTo(W, i * step + lw * 0.5);
    ctx.stroke();
  }
  ctx.restore();

  // ---- Cruces radiales (subsampleados según q.crossings) ----
  const N = q.crossings;
  if(N > 0){
    for(let i = 0; i < N; i++){
      const fi = N > 1 ? i / (N - 1) : 0.5;
      const px = fi * W;
      for(let j = 0; j < N; j++){
        const fj = N > 1 ? j / (N - 1) : 0.5;
        const py = fj * H;

        // Mapear al sistema de fase original (0..1 en cada eje, /16 como antes)
        const phaseIndex = (fi * 8 + fj * 8) / 16;
        const b = waveAmp(phaseIndex);
        if(b < 0.55) continue;

        const a = (b - 0.55) / 0.45 * 0.85;
        const r = lw * 2.4;
        const g = ctx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, `rgba(255,252,232,${a})`);
        g.addColorStop(1, 'rgba(255,252,232,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
      }
    }
  }

  // ---- Cell glow (solo en high/medium) ----
  if(q.cellGlow){
    ctx.globalCompositeOperation = 'lighter';
    for(let r = 0; r < 8; r++){
      for(let c = 0; c < 8; c++){
        const b = waveAmp((r + c + 1) / 16);
        if(b < 0.4) continue;
        const a = (b - 0.4) / 0.6 * 0.16;
        const cx = (c + 0.5) * step, cy = (r + 0.5) * step;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, step * 0.7);
        g.addColorStop(0, `rgba(255,245,210,${a})`);
        g.addColorStop(1, 'rgba(255,245,210,0)');
        ctx.fillStyle = g;
        ctx.fillRect(c * step, r * step, step, step);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawGridStrips(W, H, phase){
  const q = currentQuality();
  const strips = q.strips || 12;
  const step = W / 8;
  const lw = Math.max(1, W / 480);

  // ---- Cuadrícula estática (sin gradientes) ----
  ctx.save();
  ctx.lineWidth = lw;
  ctx.strokeStyle = 'rgba(255,240,205,0.05)';
  ctx.beginPath();
  for(let i = 0; i <= 8; i++){
    ctx.moveTo(i * step + lw * 0.5, 0);
    ctx.lineTo(i * step + lw * 0.5, H);
    ctx.moveTo(0, i * step + lw * 0.5);
    ctx.lineTo(W, i * step + lw * 0.5);
  }
  ctx.stroke();
  ctx.restore();

  // ---- 12 barras diagonales pegadas una al lado de la otra ----
  const diag = Math.hypot(W, H);
  const stripW = diag / strips;
  // Frente de ola: recorre toda la diagonal con un poco de margen
  const frontPos = (phase - 0.5) * diag * 1.2;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(-Math.PI / 4);
  ctx.globalCompositeOperation = 'lighter';

  for(let i = 0; i < strips; i++){
    // Centro de la barra i sobre el eje diagonal
    const stripCenter = -diag / 2 + stripW * (i + 0.5);
    // Distancia normalizada al frente de ola
    const d = (stripCenter - frontPos) / diag;
    // Intensidad gaussiana (campana ancha para que varias barras brillen a la vez)
    const intensity = Math.exp(-d * d * 22);
    // Cola: las barras detrás del frente brillan un poco (efecto de arrastre)
    const tail = stripCenter < frontPos ? intensity * 0.30 : 0;
    const alpha = Math.max(intensity, tail) * 0.22;
    if(alpha < 0.006) continue;

    // Color: blanco cálido en el pico, azulado en los bordes
    const r = Math.round(222 + intensity * 33);
    const g = Math.round(235 + intensity * 20);
    const b = 255;

    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    // Overlap de 1.5x para que las barras se fundan entre sí y no se vean las juntas
    ctx.fillRect(stripCenter - stripW * 0.75, -diag, stripW * 1.5, diag * 2);
  }

  ctx.restore();
}

/* =========================================================
   OVERLAY DE FPS (canvas separado, encima de las piezas)
   ========================================================= */
function drawFpsOverlay(W, H){
  if(!quality.showFps){
    // Si está apagado, no dibujamos nada.
    // El canvas se limpia una sola vez en setShowFps(false).
    return;
  }

  // Limpiar solo el canvas de FPS (es transparente, así que el board se ve debajo)
  fpsCtx.clearRect(0, 0, W, H);

  // ---- Calcular métricas ----
  const samples = quality.fpsSamples;
  let fpsNow = 0, fpsAvg = 0, fpsMin = 0;
  if(samples.length){
    fpsNow = samples[samples.length - 1];
    fpsAvg = samples.reduce((a,b)=>a+b,0) / samples.length;
    const tail = samples.slice(-Math.min(30, samples.length));
    fpsMin = Math.min(...tail);
  }

  // ---- Historial del mini-gráfico ----
  quality.fpsGraph.push(fpsNow || 0);
  if(quality.fpsGraph.length > 60) quality.fpsGraph.shift();

  // ---- Layout ----
  const pad = 6;
  const fontSize = Math.max(10, Math.floor(W / 40));
  const lineH = fontSize + 3;
  const boxW = Math.max(96, Math.floor(W / 4.2));
  const boxH = lineH * 3 + pad * 2 + 4;
  const x = W - boxW - 8;
  const y = 8;
  const radius = 6;

  // ---- Color según salud ----
  const healthColor =
    fpsNow >= 50 ? '#7dff9a' :
    fpsNow >= 30 ? '#ffd070' :
    fpsNow >= 20 ? '#ffab60' :
                   '#ff7070';

  // ---- Fondo ----
  fpsCtx.save();
  fpsCtx.shadowColor = 'rgba(0,0,0,0.6)';
  fpsCtx.shadowBlur = 6;
  fpsCtx.fillStyle = 'rgba(0,0,0,0.68)';
  fpsCtx.beginPath();
  fpsCtx.moveTo(x + radius, y);
  fpsCtx.lineTo(x + boxW - radius, y);
  fpsCtx.quadraticCurveTo(x + boxW, y, x + boxW, y + radius);
  fpsCtx.lineTo(x + boxW, y + boxH - radius);
  fpsCtx.quadraticCurveTo(x + boxW, y + boxH, x + boxW - radius, y + boxH);
  fpsCtx.lineTo(x + radius, y + boxH);
  fpsCtx.quadraticCurveTo(x, y + boxH, x, y + boxH - radius);
  fpsCtx.lineTo(x, y + radius);
  fpsCtx.quadraticCurveTo(x, y, x + radius, y);
  fpsCtx.closePath();
  fpsCtx.fill();
  fpsCtx.shadowBlur = 0;

  // Borde sutil
  fpsCtx.strokeStyle = 'rgba(255,255,255,0.10)';
  fpsCtx.lineWidth = 1;
  fpsCtx.stroke();

  // ---- Texto ----
  fpsCtx.font = `bold ${fontSize}px ui-monospace, "SF Mono", Menlo, monospace`;
  fpsCtx.textBaseline = 'top';

  const levelLabel = {
    high: 'Alta', medium: 'Media', low: 'Baja', minimal: 'Mínima'
  }[quality.effective] || quality.effective;
  const waveStyle = getWaveStyle();
  const waveLabel = { radial:'🌊', strips:'📊', off:'🚫' }[waveStyle] || '';
  const qIcon = { high:'✨', medium:'⚖️', low:'🍃', minimal:'⚡' }[quality.effective] || '';

  // Línea 1: FPS actual + calidad
  fpsCtx.textAlign = 'left';
  fpsCtx.fillStyle = healthColor;
  fpsCtx.fillText(`${fpsNow.toFixed(0).padStart(2,' ')} FPS`, x + pad, y + pad);

  fpsCtx.fillStyle = 'rgba(220,220,220,0.85)';
  fpsCtx.textAlign = 'right';
  // ⬇️ Agregar el cap al lado si está activo
  const capLabel = (quality.fpsCap && quality.fpsCap < 144) ? ` /${quality.fpsCap}` : '';
  fpsCtx.fillText(`${qIcon}${levelLabel}${capLabel} ${waveLabel}`, x + boxW - pad, y + pad);

  // Línea 2: promedio + mínimo
  const yLine2 = y + pad + lineH;
  fpsCtx.textAlign = 'left';
  fpsCtx.fillStyle = 'rgba(180,180,180,0.85)';
  fpsCtx.fillText(`avg ${fpsAvg.toFixed(0)}`, x + pad, yLine2);
  fpsCtx.textAlign = 'right';
  fpsCtx.fillStyle = fpsMin >= 30 ? 'rgba(180,180,180,0.85)' : '#ff9090';
  fpsCtx.fillText(`min ${fpsMin.toFixed(0)}`, x + boxW - pad, yLine2);

  // Línea 3: mini-gráfico
  const graphY = y + pad + lineH * 2 + 1;
  const graphH = lineH - 2;
  const graphX = x + pad;
  const graphW = boxW - pad * 2;

  fpsCtx.fillStyle = 'rgba(255,255,255,0.04)';
  fpsCtx.fillRect(graphX, graphY, graphW, graphH);

  const fpsMax = 70;
  const refY = graphY + graphH - (60 / fpsMax) * graphH;
  fpsCtx.strokeStyle = 'rgba(255,255,255,0.18)';
  fpsCtx.beginPath();
  fpsCtx.moveTo(graphX, refY);
  fpsCtx.lineTo(graphX + graphW, refY);
  fpsCtx.stroke();

  const gN = quality.fpsGraph.length;
  if(gN > 1){
    const barW = graphW / 60;
    for(let i = 0; i < gN; i++){
      const v = clamp(quality.fpsGraph[i], 0, fpsMax);
      const bh = (v / fpsMax) * graphH;
      const bx = graphX + i * barW;
      const by = graphY + graphH - bh;
      const hc =
        v >= 50 ? 'rgba(125,255,154,0.85)' :
        v >= 30 ? 'rgba(255,208,112,0.85)' :
        v >= 20 ? 'rgba(255,171,96,0.85)' :
                  'rgba(255,112,112,0.9)';
      fpsCtx.fillStyle = hc;
      fpsCtx.fillRect(bx, by, Math.max(1, barW - 0.5), bh);
    }
  }

  fpsCtx.restore();
}

function drawWeatherParticles(W, H, dt){
  const q = getRainScale();
  if(q <= 0) return;
  const mode = currentBiome.weather.mode;
  if(mode === 'none') return;
  const intensity = rainAmt;
  if(intensity < 0.012) return;

  // Actualizar vórtices
  updateVortices(dt, W, H, intensity);
  // Actualizar viento direccional
  updateWindState(dt);

  const visible = Math.floor(rainDrops.length * q * (0.05 + 0.90 * Math.pow(intensity, 0.55)));
  const alphaBase = 0.20 + intensity * 0.24;
  const now = performance.now();

  if(mode === 'rain'){
    const lenScale = 0.65 + intensity * 4.20;
    const lw = 0.55 + intensity * 0.75;
    const speedMul = 0.85 + intensity * 1.15;
    const slant = 0.14 + intensity * 0.14;
    ctx.strokeStyle = `rgba(180,210,240,${alphaBase})`;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      const orbiting = stepWeatherParticle(d, dt, intensity, W, H);
      if(!orbiting){
        d.y += d.spd * speedMul * dt;
        d.x += (d.spd * speedMul * 0.18 + d.vx / W) * dt;   // ⬅️ agregar d.vx
      }
      if(d.y > 1.05){ d.y = -0.05; d.x = Math.random(); d.attachedVortex = null; }
      if(d.x > 1.05) d.x -= 1.1;
      if(d.x < -0.05) d.x += 1.1;

      const px = d.x * W, py = d.y * H;
      const L = d.len * lenScale;
      const totalVx = d.spd * speedMul * 0.18 * W + d.vx;
      const tilt = clamp(totalVx / Math.max(60, d.spd * speedMul * W), -0.7, 0.7);
      ctx.moveTo(px, py);
      ctx.lineTo(px - L * W * (slant + tilt), py + L * H);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  else if(mode === 'snow'){
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      const orbiting = stepWeatherParticle(d, dt, intensity, W, H);
      if(!orbiting){
        d.y += d.spd * (0.25 + intensity * 0.45) * dt;
        d.x += (Math.sin(now * 0.001 + i) * 0.0008 + d.vx / W) * dt;   // ⬅️ agregar d.vx
      }
      if(d.y > 1.05){ d.y = -0.05; d.x = Math.random(); d.attachedVortex = null; }
      if(d.x > 1.05) d.x -= 1.1;
      if(d.x < -0.05) d.x += 1.1;

      const px = d.x * W, py = d.y * H;
      const r = 0.9 + d.len * 30;
      ctx.fillStyle = `rgba(245,250,255,${0.55 + intensity * 0.30})`;
      const speedMag = Math.hypot(d.vx, d.vy);
      if(speedMag > 30){
        const ang = Math.atan2(d.vy, d.vx);
        const stretch = 1 + Math.min(1.4, speedMag / 200);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang);
        ctx.beginPath(); ctx.ellipse(0, 0, r * stretch, r * 0.75, 0, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
      }
    }
  }
  else if(mode === 'dust'){
    ctx.fillStyle = `rgba(210,180,130,${0.32 + intensity * 0.30})`;
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      const speed = (0.35 + intensity * 0.9) * d.spd;
      d.x += speed * dt * 0.55;
      d.y += speed * dt * 0.06;
      if(d.x > 1.05){ d.x = -0.05; d.y = Math.random(); }
      const px = d.x * W, py = d.y * H;
      const r = 0.6 + d.len * 18;
      ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
    }
  }
  else if(mode === 'ash'){
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      const orbiting = stepWeatherParticle(d, dt, intensity, W, H);
      if(!orbiting){
        d.y += d.spd * (0.35 + intensity * 0.55) * dt;
        d.x += (Math.sin(now * 0.0007 + i * 1.7) * 0.0008 + 0.0006 + d.vx / W) * dt;   // ⬅️ agregar d.vx
      }
      if(d.y > 1.05){ d.y = -0.05; d.x = Math.random(); d.attachedVortex = null; }
      if(d.x > 1.05) d.x -= 1.1;

      const px = d.x * W, py = d.y * H;
      const isEmber = (i % 7 === 0);
      ctx.fillStyle = isEmber
        ? `rgba(255,140,60,${0.55 + intensity * 0.35})`
        : `rgba(70,60,55,${0.45 + intensity * 0.30})`;
      const r = 0.7 + d.len * 16;
      ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
    }
  }
  else if(mode === 'petals'){
    const t = now * 0.001;
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      const orbiting = stepWeatherParticle(d, dt, intensity, W, H);
      if(!orbiting){
        d.y += d.spd * (0.22 + intensity * 0.40) * dt;
        d.x += (Math.sin(t + i * 1.3) * 0.0014 + 0.0004 + d.vx / W) * dt;   // ⬅️ agregar d.vx
      }
      if(d.y > 1.05){ d.y = -0.05; d.x = Math.random(); d.attachedVortex = null; }
      if(d.x > 1.05) d.x -= 1.1;
      if(d.x < -0.05) d.x += 1.1;

      const px = d.x * W, py = d.y * H;
      const r = 1.6 + d.len * 20;
      const rot = t * 1.2 + i + (orbiting ? d.vx * 0.010 : 0);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(rot);
      const pink = i % 4 === 0 ? 'rgba(255,245,252,0.85)'
                : i % 4 === 1 ? 'rgba(255,205,230,0.85)'
                : i % 4 === 2 ? 'rgba(255,180,215,0.85)'
                :               'rgba(245,200,255,0.85)';
      ctx.fillStyle = pink;
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.55, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.50)';
      ctx.beginPath(); ctx.ellipse(-r*0.28, -r*0.14, r*0.35, r*0.22, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBoardGrid(W, H){
  const style = getWaveStyle();
  if(style === 'off'){
    // Cuadrícula simple estática, sin ola
    const step = W / 8;
    const lw = Math.max(1, W / 480);
    ctx.save();
    ctx.lineWidth = lw;
    ctx.strokeStyle = 'rgba(255,240,205,0.05)';
    ctx.beginPath();
    for(let i = 0; i <= 8; i++){
      ctx.moveTo(i * step + lw * 0.5, 0);
      ctx.lineTo(i * step + lw * 0.5, H);
      ctx.moveTo(0, i * step + lw * 0.5);
      ctx.lineTo(W, i * step + lw * 0.5);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }
  const period = 5000;
  const phase = (performance.now() % period) / period;
  if(style === 'radial') drawGridRadial(W, H, phase);
  else                   drawGridStrips(W, H, phase);
}

// LOOP MAIN

let lastT = performance.now();
let lastRenderT = 0;   // ⬅️ cuándo renderizamos por última vez

function loop(now){
  // ⬇️ respetar el cap de FPS
  const cap = quality.fpsCap || 60;
  if(cap < 144){
    const minInterval = 1000 / cap;
    if(lastRenderT && (now - lastRenderT) < minInterval - 0.5){
      requestAnimationFrame(loop);
      return;
    }
    lastRenderT = now;
  } else {
    lastRenderT = now;
  }

  const rawDt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;

  // ⬇️ monitor de FPS adaptativo
  if(!state.paused) updateQualityFromFPS(rawDt);

  // Cuando está pausado, congelar TODO el avance de simulación.
  // El render sigue corriendo para no dejar la pantalla en negro.
  const dt = state.paused ? 0 : rawDt;

  worldTime += dt;
  if(dt > 0){
    updateWeather(dt);
    updateParticles(dt);
  }
  updateAmbience();   // siempre corre, usa pauseFactor para hacer fade a 0
  // --- Scheduler de rayos (cada 500ms revisa si toca) ---
  {
    const now_ms = performance.now();
    if(now_ms - lightning.lastCheck > 500){
      lightning.lastCheck = now_ms;
      // No generar rayos nuevos mientras está pausado
      if(!state.paused && !state.gameOver){
        const r = ambience.rainLevel;
        if(r > 0.16){
          const norm = (r - 0.16) / 0.84;
          const ratePerSec = Math.pow(norm, 2.3) * 0.55;
          if(Math.random() < ratePerSec * 0.5){
            triggerLightning(r);
          }
        }
      }
    }
  }
  const W = boardW, H = boardH;
  ctx.clearRect(0, 0, W, H);
  if(terrainOffscreen) ctx.drawImage(terrainOffscreen, 0, 0, W, H);
  else { ctx.fillStyle = '#1a2418'; ctx.fillRect(0,0,W,H); }

  drawBoardGrid(W, H);

  const ph = getPhase();

  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${ph.tint[0]|0},${ph.tint[1]|0},${ph.tint[2]|0})`;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
  if(currentBiome.biomeTint.a > 0){
    const bt = currentBiome.biomeTint;
    const mult = currentBiome.isVolcano ? (0.7 + ph.dark * 1.6) : 1;
    ctx.fillStyle = `rgba(${bt.r},${bt.g},${bt.b},${bt.a * mult})`;
    ctx.fillRect(0, 0, W, H);
  }
  if(ph.dark > 0.08){

    // ===== Lluvia: oscurecimiento y viraje frío del ambiente =====
    if(rainAmt > 0.04){
      const t = clamp((rainAmt - 0.04) / 0.96, 0, 1);
      const smooth = t * t * (3 - 2 * t);   // smoothstep: sin arranque brusco

      // 1. Multiply gris-azulado → baja luminosidad y satura
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const g = Math.round(255 - 95 * smooth);                       // 255 → 160
      const rC = g;
      const gC = Math.min(255, g + Math.round(10 * smooth));          // verde un poco más alto
      const bC = Math.min(255, g + Math.round(18 * smooth));          // azul más alto → tinte frío
      ctx.fillStyle = `rgb(${rC},${gC},${bC})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      // 2. Velo frío sobre toda la escena (source-over, alpha baja)
      ctx.fillStyle = `rgba(70,90,120,${0.20 * smooth})`;
      ctx.fillRect(0, 0, W, H);

      // 3. Niebla gris cerca del horizonte (más densa con lluvia fuerte)
      const horiz = ctx.createLinearGradient(0, H * 0.35, 0, H);
      horiz.addColorStop(0, 'rgba(180,190,205,0)');
      horiz.addColorStop(1, `rgba(180,190,205,${0.22 * smooth})`);
      ctx.fillStyle = horiz;
      ctx.fillRect(0, 0, W, H);
    }


    const inten = clamp((ph.dark - 0.08) / 0.20, 0, 1);
    if(currentQuality().fireflies && currentBiome.hasFireflies && currentBiome.firefly.mode !== 'none'){
      const FF = currentBiome.firefly;
      const isRise = FF.mode === 'rise';
      for(const f of terr.fireflies){
        f.t += dt * f.spd;
        const px = (f.x + Math.sin(f.t*0.7 + f.phase)*f.ax) * W;
        let py;
        if(isRise){
          const yy = ((f.y - f.t * 0.10) % 1 + 1) % 1;
          py = yy * H;
        } else {
          py = (f.y + Math.cos(f.t*0.5 + f.phase*1.3)*f.ay) * H;
        }
        const blink = (Math.sin(f.t*3.2 + f.phase)*0.5 + 0.5);
        const a = blink * inten * (isRise ? 0.85 : 1.0);
        if(a < 0.05) continue;
        ctx.globalAlpha = a;
        const g = ctx.createRadialGradient(px, py, 0, px, py, 9);
        g.addColorStop(0,    `rgba(${FF.core[0]},${FF.core[1]},${FF.core[2]},1)`);
        g.addColorStop(0.35, `rgba(${FF.mid[0]},${FF.mid[1]},${FF.mid[2]},0.65)`);
        g.addColorStop(1,    `rgba(${FF.edge[0]},${FF.edge[1]},${FF.edge[2]},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, 9, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  ctx.save();
  for(const f of fogBlobs){
    f.x += f.spd * dt;
    if(f.x > 1.3) f.x = -0.3;
    if(f.x < -0.3) f.x = 1.3;
    const px = f.x * W;
    const py = (f.y + Math.sin(now*0.0002 + f.ph)*0.03) * H;
    const pr = f.r * W;
    const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
    const alpha = f.a * (1 + Math.sin(now*0.0004 + f.ph)*0.25);
    const F = currentBiome.fog;
    g.addColorStop(0, `rgba(${F.r},${F.g},${F.b},${alpha})`);
    g.addColorStop(1, `rgba(${F.r},${F.g},${F.b},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(px, py, pr, pr*0.55, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  drawWeatherParticles(W, H, dt);
  // VIÑETA
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.32, W/2, H/2, H*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

    // --- Flash de rayo ---
  if(lightning.strikes.length > 0){
    const now_ms = performance.now();
    let bestA = 0, bestCol = '210,225,255';
    for(let i = lightning.strikes.length - 1; i >= 0; i--){
      const s = lightning.strikes[i];
      const elapsed = now_ms - s.startTime;
      if(elapsed < 0) continue;
      if(elapsed > s.dur){ lightning.strikes.splice(i, 1); continue; }
      const t = elapsed / s.dur;
      let a;
      if(t < 0.07){
        a = s.peak * (t / 0.07);
      } else {
        a = s.peak * Math.pow(1 - (t - 0.07) / 0.93, 1.6);
      }
      if(a > bestA){ bestA = a; bestCol = s.color; }
    }
    if(bestA > 0.012){
      // Capa 1: relleno general
      ctx.fillStyle = `rgba(${bestCol},${bestA * 0.75})`;
      ctx.fillRect(0, 0, W, H);
      // Capa 2: brillo extra en el punto de impacto (radial)
      const cx = rnd(W * 0.15, W * 0.85);
      const cy = rnd(H * 0.10, H * 0.60); // siempre desde el cielo hacia abajo
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 1.0);
      grad.addColorStop(0, `rgba(255,255,255,${bestA * 0.85})`);
      grad.addColorStop(0.4, `rgba(${bestCol},${bestA * 0.5})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  drawParticles();
  drawFpsOverlay(W, H);      // ⬅️ NUEVO
  requestAnimationFrame(loop);
}

   DRAG & DROP + HOVER PREVIEW — Pointer Events unificados
