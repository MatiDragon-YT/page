   ========================================================= */
const PIECE_VALUE = { p:100, n:320, b:330, r:500, q:900, k:20000 };
function aiChoosePromotion(mv){
  const turn = chess.turn();
  const opp = turn === 'w' ? 'b' : 'w';
  const candidates = ['q', 'n', 'r', 'b'];
  let bestPick = 'q';
  let bestScore = -Infinity;
  for(const piece of candidates){
    let sim;
    try { sim = chess.move({ from: mv.from, to: mv.to, promotion: piece }); }
    catch(e){ continue; }
    if(!sim){ continue; }
    let score = PIECE_VALUE[piece];
    if(chess.in_checkmate()) score += 100000;
    else if(chess.in_check()) score += 500;
    if(sim.captured) score += PIECE_VALUE[sim.captured] * 0.5;
    try {
      const savedFen = chess.fen();
      const parts = savedFen.split(' ');
      parts[1] = opp;
      chess.load(parts.join(' '), { skipValidation: true });
      const enemyMoves = chess.moves({ verbose: true });
      const attacked = enemyMoves.some(m => m.to === mv.to);
      if(attacked) score -= PIECE_VALUE[piece] * 0.6;
      chess.load(savedFen, { skipValidation: true });
    } catch(e){}
    chess.undo();
    if(score > bestScore){ bestScore = score; bestPick = piece; }
  }
  return bestPick;
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */
async function doPlayerMove(mv){
  state.busy = true;
  const turn = chess.turn();
  const opp = turn === 'w' ? 'b' : 'w';
  const movingPiece = chess.get(mv.from);

  let capturedSquare = null;
  if(mv.flags.includes('e')) capturedSquare = mv.to[0] + mv.from[1];
  else if(mv.flags.includes('c')) capturedSquare = mv.to;

  if(capturedSquare){
    const targetPiece = chess.get(capturedSquare);
    if(targetPiece && state.shields[targetPiece.color].includes(capturedSquare)){
      const c = squareCenter(capturedSquare);
      ripples.push({ x:c.x, y:c.y, r:2, maxR: cellSize*1.5, life:.6, maxLife:.6, color:'120,190,255' });
      burst(c.x, c.y, 30, { color:'#8ecbff', spMin:40, spMax:180, lifeMin:.3, lifeMax:.7, sizeMin:1.5, sizeMax:3.5 });
      sfx('shield');
      toast('¡Escudo Arcano absorbe el ataque!', '#8ecbff');
      unlockAch(targetPiece.color, 'escudoSalvador');
      const idx = state.shields[targetPiece.color].indexOf(capturedSquare);
      if(idx >= 0) state.shields[targetPiece.color].splice(idx,1);
      delete state.shieldTurns[targetPiece.color][capturedSquare];
      switchTurnInFen();
      achState[turn].streak = 0;
      recordHistory({
        type: 'shield-absorb', color: turn, powerIcon: '🛡️',
        piece: movingPiece ? { type: movingPiece.type, color: turn } : null,
        from: mv.from, to: capturedSquare,
        targetPiece: { type: targetPiece.type, color: targetPiece.color }
      });
      state.selected = null; state.legalMoves = []; clearHighlights();
      await sleep(650);
      state.busy = false;
      endTurn();
      return;
    }
  }

  let promotion;
  if(mv.flags.includes('p')){
    const isAIMove = aiEnabled && chess.turn() === aiColor;
    if(isAIMove){
      promotion = aiChoosePromotion(mv);
    } else {
      promotion = await askPromotion();
    }
  }

  let moveResult;
  try { moveResult = chess.move({ from: mv.from, to: mv.to, promotion: promotion || 'q' }); }
  catch(e){ moveResult = null; }
  if(!moveResult){ state.busy = false; return; }

  const shIdx = state.shields[turn].indexOf(mv.from);
  if(shIdx >= 0){
    state.shields[turn].splice(shIdx,1);
    state.shields[turn].push(mv.to);
    if(state.shieldTurns[turn][mv.from] !== undefined){
      state.shieldTurns[turn][mv.to] = state.shieldTurns[turn][mv.from];
      delete state.shieldTurns[turn][mv.from];
    }
  }
  if(capturedSquare){
    for(const col of ['w','b']){
      const i = state.shields[col].indexOf(capturedSquare);
      if(i >= 0) state.shields[col].splice(i,1);
    }
  }

  sfx(moveResult.captured ? 'capture' : 'move');
  await animateMove(mv.from, mv.to, capturedSquare);

  const didCapture = !!(moveResult.captured || mv.flags.includes('e'));

  if (didCapture) vibrate(35);
  setLastMove(mv.from, mv.to, null);

  if(moveResult.captured){
    addToGraveyard(moveResult.captured, opp);
  } else if(mv.flags.includes('e')){
    addToGraveyard('p', opp);
  }

  if(didCapture){
    if(!firstBloodClaimed){
      firstBloodClaimed = true;
      unlockAch(turn, 'primeraSangre');
    }
    achState[turn].streak++;
    checkStreakAch(turn);
    achState[opp].streak = 0;
    achState[opp].lostPieces++;
    if(movingPiece && movingPiece.type === 'k'){
      achState[turn].kingCaptures++;
      if(achState[turn].kingCaptures >= 3) unlockAch(turn, 'reyCazador3');
    }
  } else {
    achState[turn].streak = 0;
  }

  recordHistory({
    type: 'move', color: turn,
    piece: { type: moveResult.piece, color: turn },
    from: moveResult.from, to: moveResult.to,
    captured: moveResult.captured ? { type: moveResult.captured, color: opp } : null,
    san: moveResult.san, promotion: moveResult.promotion || null
  });

  state.mana[turn] = Math.min(state.maxMana, state.mana[turn] + 1);
  if(movingPiece && movingPiece.type === 'k' && didCapture){
    state.mana[turn] = Math.min(state.maxMana, state.mana[turn] + 1);
    toast('¡Rey cazador! +1 maná extra', '#ffd070');
  }
  if(movingPiece && isSpecial(movingPiece.type)){
    if(!state.iraCharge[turn]){
      state.specialCount[turn]++;
      if(state.specialCount[turn] >= 5){
        state.specialCount[turn] = 0;
        state.iraCharge[turn] = true;
        toast('¡IRA DE BATALLA CARGADA!', '#ffa040');
        sfx('ira');
      }
    }
  }

  state.busy = false;
  syncPieces();
  updateUI();

  if(movingPiece && isSpecial(movingPiece.type) && didCapture && state.iraCharge[turn]){
    state.busy = true;
    const iraResult = await iraTargeting(mv.to, turn);
    state.busy = false;
    if(iraResult){
      state.iraCharge[turn] = false;
      unlockAch(turn, 'dobleFilo');
      recordHistory({
        type: 'ira', color: turn, powerIcon: '⚔️', powerName: 'Ira de Batalla',
        piece: { type: movingPiece.type, color: turn },
        from: iraResult.from, to: iraResult.to,
        captured: iraResult.captured ? { type: iraResult.captured, color: opp } : null
      });
      setLastMove(iraResult.from, iraResult.to, { from: mv.from, to: mv.to });
      vibrate([20, 40, 55]);
      if(iraResult.captured){
        achState[turn].streak++;
        checkStreakAch(turn);
        achState[opp].streak = 0;
        achState[opp].lostPieces++;
      }
      toast('¡Doble captura!', '#ffa040');
      sfx('ira');
      updateUI();
    }
  }
  endTurn();
}

/* =========================================================
   IRA DE BATALLA
   ========================================================= */
async function iraTargeting(fromSq, color){
  const savedFen = chess.fen();
  const parts = savedFen.split(' ');
  if(parts[1] !== color){
    parts[1] = color;
    try { chess.load(parts.join(' '), { skipValidation: true }); } catch(e){}
  }
  const moves = chess.moves({ square: fromSq, verbose: true })
    .filter(m => {
      if(!(m.flags.includes('c') || m.flags.includes('e'))) return false;
      const target = chess.get(m.to);
      if(target && target.type === 'k') return false;
      return true;
    });
  if(moves.length === 0){
    try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
    return null;
  }
  const oppColor = color === 'w' ? 'b' : 'w';
  if(aiEnabled && color === aiColor){
    let best = moves[0], bestVal = -Infinity;
    for(const m of moves){
      const tp = chess.get(m.to);
      if(!tp) continue;
      const v = PIECE_VALUE[tp.type] || 0;
      if(v > bestVal){ bestVal = v; best = m; }
    }
    const capturedSquare = best.flags.includes('e') ? (best.to[0] + best.from[1]) : best.to;
    await sleep(450);
    let res;
    try { res = chess.move({ from: best.from, to: best.to }); } catch(e){ res = null; }
    if(res){
      await animateMove(best.from, best.to, capturedSquare, 700);
      if(res.captured) addToGraveyard(res.captured, oppColor);
      if(res.captured) vibrate([20, 40, 55]);
      state.mana[color] = Math.min(state.maxMana, state.mana[color] + 1);
      for(const col of ['w','b']){
        const i = state.shields[col].indexOf(capturedSquare);
        if(i >= 0) state.shields[col].splice(i,1);
      }
      syncPieces();
      return { from: res.from, to: res.to, captured: res.captured || null };
    }
    return null;
  }
  const result = await new Promise(resolve => {
    clearHighlights();
    const c = gridEl.querySelector(`[data-sq="${fromSq}"]`);
    if(c) c.classList.add('sel');
    const targets = new Set(moves.map(m => m.to));
    for(const sq of targets){
      const el = gridEl.querySelector(`[data-sq="${sq}"]`);
      if(el) el.classList.add('ira');
    }
    state.targeting = { key: 'ira', from: fromSq, color };
    iraResolve = resolve;
    toast('Elige la segunda víctima (clic derecho = omitir)', '#ffa040');
    updateUI();
    const cleanup = () => {
      gridEl.removeEventListener('click', clickH, true);
      gridEl.removeEventListener('contextmenu', ctxH, true);
      state.targeting = null; iraResolve = null; clearHighlights();
    };
    const ctxH = (e) => { e.preventDefault(); cleanup(); resolve(null); };
    const clickH = async (e) => {
      const cell = e.target.closest('.cell');
      if(!cell) return;
      const sq = cell.dataset.sq;
      if(!targets.has(sq)) return;
      cleanup();
      const mv = moves.find(m => m.to === sq);
      const capturedSquare = mv.flags.includes('e') ? (mv.to[0] + mv.from[1]) : mv.to;
      let res;
      try { res = chess.move({ from: mv.from, to: mv.to }); } catch(err){ res = null; }
      if(res){
        sfx('capture');
        await animateMove(mv.from, mv.to, capturedSquare, 400);
        if(res.captured) addToGraveyard(res.captured, oppColor);
        if(res.captured) vibrate([20, 40, 55]);
        state.mana[color] = Math.min(state.maxMana, state.mana[color] + 1);
        for(const col of ['w','b']){
          const i = state.shields[col].indexOf(capturedSquare);
          if(i >= 0) state.shields[col].splice(i,1);
        }
        const cc = squareCenter(capturedSquare);
        burst(cc.x, cc.y, 20, { color:'#ff9040', spMin:50, spMax:180, lifeMin:.3, lifeMax:.7 });
        syncPieces();
        resolve({ from: res.from, to: res.to, captured: res.captured || null });
      } else {
        try { chess.load(savedFen, { skipValidation: true }); } catch(err){}
        resolve(null);
      }
    };
    gridEl.addEventListener('click', clickH, true);
    gridEl.addEventListener('contextmenu', ctxH, true);
  });
  if(!result){ try { chess.load(savedFen, { skipValidation: true }); } catch(e){} }
  return result;
}

   PODERES — ENTRADA

function startPower(key){
  if(state.busy || state.gameOver || replay.active || state.paused) return;
  if(state.aiBusy) return;
  if(aiEnabled && chess.turn() === aiColor) return;
  initAudio();
  if(state.targeting && state.targeting.key === key){ cancelTargeting(); return; }
  const turn = chess.turn();
  if(!playerDecks[turn].hand.includes(key)){ toast('No tienes esa carta en la mano'); return; }
  const minCost = minCostOf(key);
  if(state.mana[turn] < minCost){ toast('Maná insuficiente'); return; }
  ensureTurnSnapshot();
  if(key === 'heal'){ handleHealStart(turn); return; }
  state.targeting = { key, step: 1, data: {}, target: key };
  state.selected = null; state.legalMoves = [];
  clearHighlights(); highlightTargeting(); updateUI();
}
async function handleHealStart(turn){
  const pile = state.graveyard[turn];
  if(!pile.length){ toast('No tienes piezas caídas para revivir', '#ff8080'); return; }
  const counts = {};
  for(const t of pile) counts[t] = (counts[t] || 0) + 1;
  const entries = Object.entries(counts)
    .map(([t, n]) => ({ type: t, n, cost: healCostFor(t) }))
    .sort((a,b) => a.cost - b.cost);
  const btns = entries.map(e => {
    const affordable = state.mana[turn] >= e.cost;
    return {
      html: `<span>${GLYPH[e.type]}</span><small>${e.cost}💧${e.n>1?' ×'+e.n:''}</small>`,
      value: affordable ? e.type : ('__unaffordable_' + e.type),
      cls: 'glyph' + (affordable ? '' : ' dis')
    };
  });
  btns.push({ label:'✕', value:null, cls:'no' });
  const chosenRaw = await showModal('💚 Toque Curativo',
    `Maná: ${state.mana[turn]} · Elige qué revivir`, btns);
  if(!chosenRaw) return;
  if(typeof chosenRaw === 'string' && chosenRaw.startsWith('__unaffordable_')){
    const t = chosenRaw.replace('__unaffordable_', '');
    toast(`Necesitas ${healCostFor(t)} maná para revivir esa pieza`, '#ff8080');
    return handleHealStart(turn);
  }
  const chosen = chosenRaw;
  const cost = healCostFor(chosen);
  if(state.mana[turn] < cost){ toast('Maná insuficiente', '#ff8080'); return; }
  if(!pile.includes(chosen)){ toast('Esa pieza ya no está en tu cementerio', '#ff8080'); return; }
  const empties = getAdjacentEmptySquares(turn);
  if(!empties.length){ toast('No hay casillas vacías disponibles', '#ff8080'); return; }
  state.targeting = { key: 'heal', step: 2, target: 'heal',
    data: { type: chosen, emptySquares: empties, cost } };
  highlightTargeting(); updateUI();
}
function cancelTargeting(){
  if(!state.targeting) return;
  const wasIra = state.targeting.key === 'ira';
  state.targeting = null; clearHighlights();
  if(wasIra && iraResolve){ const r = iraResolve; iraResolve = null; r(null); return; }
  updateUI();
}
function isAdjacentToAlly(sq, color){
  return isAdjacentToAllyOn(chess, sq, color);
}
function highlightTargeting(){
  clearHighlights();
  const T = state.targeting;
  if(!T || T.key === 'ira') return;
  const turn = chess.turn();
  const board = chess.board();
  const mana = state.mana[turn];

  if(T.key === 'teleport'){
    if(T.step === 1){
      for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        const p = board[r][c];
        if(p && p.color === turn) gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`).classList.add('tgt');
      }
      toast('Selecciona una pieza para teletransportar', '#7ac0ff');
    } else {
      const from = T.data.from;
      for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        if(board[r][c]) continue;
        const sq = rcToSquare(r,c);
        const cost = teleportCost(from, sq);
        if(cost > mana) continue;
        if(simMoveLeavesKingInCheck(from, sq, turn)) continue;
        gridEl.querySelector(`[data-sq="${sq}"]`).classList.add('tgt2');
      }
      toast(`Destino (2/4/6 · maná: ${mana})`, '#7affa0');
    }
  } else if(T.key === 'shield'){
    if(state.shields[turn].length > 0) toast('Ya tienes un escudo activo — solo uno a la vez', '#7ac0ff');
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && p.color === turn){
        const el = gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`);
        el.classList.add('tgt');
        if(p.type === 'k' || p.type === 'q') el.classList.add('sel');
      }
    }
    toast('Selecciona la pieza a proteger (4 maná)', '#7ac0ff');
  } else if(T.key === 'ray'){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color === turn || p.type === 'k') continue;
      const sq = rcToSquare(r,c);
      const cell = gridEl.querySelector(`[data-sq="${sq}"]`);
      const cost = rayCostFor(p.type);
      cell.classList.add('tgtEnemy');
      if(cost > mana) cell.classList.add('dis');
      const tag = document.createElement('span');
      tag.className = 'costTag'; tag.textContent = cost;
      cell.appendChild(tag);
    }
    toast(`Maná: ${mana} · Los objetivos oscuros no son alcanzables`, '#ff7070');
  } else if(T.key === 'zombie'){
    let any = false;
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(p && p.color !== turn && p.type !== 'k'){
        const sq = rcToSquare(r,c);
        if(isAdjacentToAlly(sq, turn)){
          gridEl.querySelector(`[data-sq="${sq}"]`).classList.add('tgtEnemy');
          any = true;
        }
      }
    }
    if(!any) toast('Sin enemigos adyacentes a un aliado', '#c07aff');
    else toast('Selecciona un enemigo pegado a un aliado', '#c07aff');
  } else if(T.key === 'heal' && T.step === 2){
    for(const sq of (T.data.emptySquares || [])){
      const el = gridEl.querySelector(`[data-sq="${sq}"]`);
      if(el) el.classList.add('tgt2');
    }
    toast(`Reaparece ${GLYPH[T.data.type]} · coste ${T.data.cost}`, '#7affa0');
  } else if(T.key === 'quake'){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const el = gridEl.querySelector(`[data-sq="${rcToSquare(r,c)}"]`);
      if(el) el.classList.add('tgt');
    }
    toast('Selecciona el centro del área 3×3', '#ffb060');
  }
}
function getAdjacentEmptySquares(color){
  const kingSq = findKing(color);
  const empties = [];
  const board = chess.board();
  const center = kingSq ? sqToRC(kingSq) : { r: color==='w'?7:0, c:4 };
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(board[r][c]) continue;
    const d = Math.max(Math.abs(r-center.r), Math.abs(c-center.c));
    if(d <= 2) empties.push({ sq: rcToSquare(r,c), d });
  }
  empties.sort((a,b)=>a.d-b.d);
  if(empties.length === 0){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      if(!board[r][c]) empties.push({ sq: rcToSquare(r,c), d: 99 });
    }
  }
  return empties.slice(0, 16).map(e=>e.sq);
}
function findKing(color){
  const board = chess.board();
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(p && p.type === 'k' && p.color === color) return rcToSquare(r,c);
  }
  return null;
}
async function handleTargetingClick(sq){
  const T = state.targeting;
  if(!T) return;
  const turn = chess.turn();
  const board = chess.board();
  const rc = sqToRC(sq);
  const piece = board[rc.r][rc.c];

  if(T.key === 'teleport'){
    if(T.step === 1){
      if(!piece || piece.color !== turn) return;
      T.data.from = sq;
      T.step = 2;
      highlightTargeting();
      return;
    } else {
      if(piece && piece.color === turn){
        T.data.from = sq;
        highlightTargeting();
        return;
      }
      if(piece) return;
      const from = T.data.from;
      const cost = teleportCost(from, sq);
      if(!isFinite(cost)){ toast('Fuera de alcance (máx 3 casillas)', '#ff8080'); return; }
      if(cost > state.mana[turn]){ toast('Maná insuficiente para esa distancia', '#ff8080'); return; }
      if(simMoveLeavesKingInCheck(from, sq, turn)){
        toast('¡Ese salto dejaría a tu Rey en Jaque!', '#ff8080');
        return;
      }
      state.targeting = null; clearHighlights();
      await execTeleport(from, sq, cost); return;
    }
  }
  if(T.key === 'shield'){
    if(!piece || piece.color !== turn) return;
    if(state.shields[turn].length > 0){ toast('Ya tienes un escudo activo', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execShield(sq); return;
  }
  if(T.key === 'ray'){
    if(!piece || piece.color === turn || piece.type === 'k') return;
    const cost = rayCostFor(piece.type);
    if(cost > state.mana[turn]){ toast(`Necesitas ${cost} maná para destruir esa pieza`, '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execRay(sq, cost); return;
  }
  if(T.key === 'zombie'){
    if(!piece || piece.color === turn || piece.type === 'k') return;
    if(!isAdjacentToAlly(sq, turn)){ toast('Debe estar pegado a una pieza aliada', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execZombie(sq); return;
  }
  if(T.key === 'heal' && T.step === 2){
    if(piece) return;
    const type = T.data.type, cost = T.data.cost;
    if(cost > state.mana[turn]){ toast('Maná insuficiente', '#ff8080'); return; }
    state.targeting = null; clearHighlights();
    await execHeal(sq, type, turn, cost); return;
  }
  if(T.key === 'quake'){
    state.targeting = null; clearHighlights();
    await execQuake(sq); return;
  }
}

/* =========================================================
   EJECUCIÓN DE PODERES
   ========================================================= */
async function execTeleport(from, to, cost){
  state.busy = true;
  vibrate([15, 30, 40]);
  const turn = chess.turn();
  const A = squareCenter(from), B = squareCenter(to);
  const el = pieceEls.get(from);
  const piece = chess.get(from);
  spawnVortex(A.x, A.y, '#b070ff', true); sfx('spell');
  await sleep(320);
  if(el){ el.style.opacity = '0'; el.style.transition = 'opacity .16s'; await sleep(160); el.style.opacity = '1'; }
  spawnCurve(A, B, 'rgba(180,120,255,0.85)');
  await sleep(180);
  movePieceOnBoard(from, to);
  if(piece && piece.type === 'k'){
    const parts = chess.fen().split(' ');
    let c = parts[2] === '-' ? '' : parts[2];
    if(turn === 'w') c = c.replace(/[KQ]/g,''); else c = c.replace(/[kq]/g,'');
    parts[2] = c || '-'; parts[3] = '-'; parts[4] = '0';
    try { chess.load(parts.join(' '), { skipValidation: true }); } catch(e){}
  }
  const si = state.shields[turn].indexOf(from);
  if(si >= 0){
    state.shields[turn].splice(si,1);
    state.shields[turn].push(to);
    if(state.shieldTurns[turn][from] !== undefined){
      state.shieldTurns[turn][to] = state.shieldTurns[turn][from];
      delete state.shieldTurns[turn][from];
    }
  }
  validateAndFixBoard();
  const el2 = pieceEls.get(to);

/* =========================================================
   IA — MINIMAX ASÍNCRONO CON INSTANCIA SEPARADA
   =========================================================
   Toda la búsqueda corre en `searchChess`, una copia local.
   La instancia global `chess` NUNCA se toca durante la búsqueda,
   así que el render y el input del usuario siguen viendo el
   estado real de la partida.
   ========================================================= */
let aiSearchAbort = false;
let aiSearchLastYield = 0;
const AI_YIELD_MS = 8;  // ceder el hilo cada 8ms para no bloquear el paint

function aiYieldIfNeeded(){
  const now = performance.now();
  if(now - aiSearchLastYield > AI_YIELD_MS){
    aiSearchLastYield = now;
    return new Promise(r => setTimeout(r, 0));
  }
  return null;
}

function centerBonus(p, r, c){
  const centerDist = Math.abs(r - 3.5) + Math.abs(c - 3.5);
  if(p.type === 'n' || p.type === 'b') return (7 - centerDist) * 4;
  if(p.type === 'p') return (p.color === 'w' ? (6 - r) : (r - 1)) * 5;
  if(p.type === 'k') return -centerDist * 2;
  return 0;
}
function evaluateFor(chessObj, color){
  const board = chessObj.board();
  let score = 0;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p) continue;
    const val = PIECE_VALUE[p.type] + centerBonus(p, r, c);
    if(p.color === color) score += val;
    else score -= val;
  }
  score += (state.mana[color] - state.mana[color === 'w' ? 'b' : 'w']) * 5;
  if(state.iraCharge[color]) score += 30;
  return score;
}
function orderMoves(moves){
  return moves.sort((a, b) => {
    const aScore = (a.captured ? PIECE_VALUE[a.captured] : 0) + (a.promotion ? 800 : 0);
    const bScore = (b.captured ? PIECE_VALUE[b.captured] : 0) + (b.promotion ? 800 : 0);
    return bScore - aScore;
  });
}

async function minimax(searchChess, depth, alpha, beta, maximizing, rootColor){
  if(aiSearchAbort) return 0;
  if(depth === 0 || searchChess.game_over()) return evaluateFor(searchChess, rootColor);
  const y = aiYieldIfNeeded();
  if(y) await y;
  if(aiSearchAbort) return 0;
  const moves = searchChess.moves({ verbose: true });
  orderMoves(moves);
  if(maximizing){
    let best = -Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = await minimax(searchChess, depth-1, alpha, beta, false, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v > best) best = v;
      if(v > alpha) alpha = v;
      if(beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const mv of moves){
      const moveObj = (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1') && !mv.promotion)
        ? { ...mv, promotion: 'q' } : mv;
      searchChess.move(moveObj);
      const v = await minimax(searchChess, depth-1, alpha, beta, true, rootColor);
      searchChess.undo();
      if(aiSearchAbort) return 0;
      if(v < best) best = v;
      if(v < beta) beta = v;
      if(beta <= alpha) break;
    }
    return best;
  }
}
// La amenaza de cartas se calcula sobre el searchChess (no toca la global)
function computeCardThreatPenalty(searchChess, color){
  const enemy = color === 'w' ? 'b' : 'w';
  const enemyMana = state.mana[enemy];
  const enemyHand = playerDecks[enemy].hand;
  if(!enemyHand.length) return 0;
  const board = searchChess.board();
  let penalty = 0;
  if(enemyHand.includes('ray')){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || p.type === 'k') continue;
      const cost = rayCostFor(p.type);
      if(cost > enemyMana) continue;
      if(p.type === 'q') penalty += 200;
      else if(p.type === 'r') penalty += 100;
      else if(p.type === 'b' || p.type === 'n') penalty += 45;
    }
  }
  if(enemyHand.includes('zombie') && enemyMana >= POWERS.zombie.cost){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || p.type === 'k') continue;
      const sq = rcToSquare(r,c);
      if(isAdjacentToAllyOn(searchChess, sq, enemy)){
        if(p.type === 'q') penalty += 450;
        else if(p.type === 'r') penalty += 300;
        else if(p.type === 'b' || p.type === 'n') penalty += 160;
        else penalty += 45;
      }
    }
  }
  if(enemyHand.includes('quake') && enemyMana >= POWERS.quake.cost){
    for(let cr=0;cr<6;cr++) for(let cc=0;cc<6;cc++){
      let ownVal = 0, enemyVal = 0, enemyCount = 0;
      for(let dr=0;dr<=2;dr++) for(let dc=0;dc<=2;dc++){
        const p = board[cr+dr][cc+dc];
        if(!p) continue;
        if(p.color === color) ownVal += PIECE_VALUE[p.type];
        else { enemyVal += PIECE_VALUE[p.type]; enemyCount++; }
      }
      if(enemyCount > 0 && ownVal > enemyVal * 1.4 && ownVal > PIECE_VALUE.r) penalty += 60;
    }
  }
  if(enemyHand.includes('teleport') && enemyMana >= 2){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      const p = board[r][c];
      if(!p || p.color !== color || (p.type !== 'q' && p.type !== 'r')) continue;
      let threatened = false;
      for(let rr=0;rr<8 && !threatened;rr++) for(let cc2=0;cc2<8 && !threatened;cc2++){
        const ep = board[rr][cc2];
        if(!ep || ep.color !== enemy) continue;
        const d = Math.max(Math.abs(r-rr), Math.abs(c-cc2));
        if(d >= 1 && d <= TELEPORT_MAX_DIST){
          const cost = d * 2;
          if(cost <= enemyMana){
            const sq = rcToSquare(r,c);
            if(!isSquareAttackedByEnemyOn(searchChess, sq, color)) threatened = true;
          }
        }
      }
      if(threatened) penalty += p.type === 'q' ? 70 : 35;
    }
  }
  return penalty;
}

async function findBestMove(depth, rootColor){
  // Instancia separada: la partida real NO se toca durante la búsqueda
  const searchChess = new Chess(chess.fen());
  const moves = searchChess.moves({ verbose: true });
  if(!moves.length) return null;
  orderMoves(moves);
  aiSearchLastYield = performance.now();

  if(depth <= 1){
    let best = null, bestVal = -Infinity;
    for(const mv of moves){
      if(aiSearchAbort) return null;
      searchChess.move(mv);
      let v = evaluateFor(searchChess, rootColor) + rnd(-80, 80);
      v -= computeCardThreatPenalty(searchChess, rootColor) * 0.6;
      searchChess.undo();
      if(v > bestVal){ bestVal = v; best = mv; }
      const y = aiYieldIfNeeded();
      if(y) await y;
    }
    if(aiSearchAbort) return null;
    return best;
  }
  let bestMove = null, bestScore = -Infinity;
  let alpha = -Infinity, beta = Infinity;
  const threatWeight = rubyMode ? 1.15 : (aiDifficulty === 'hard' ? 1.0 : (aiDifficulty === 'normal' ? 0.75 : 0.5));
  for(const mv of moves){
    if(aiSearchAbort) return null;
    const moveObj = mv.promotion ? mv : (mv.piece === 'p' && (mv.to[1] === '8' || mv.to[1] === '1')
      ? { ...mv, promotion: 'q' } : mv);
    searchChess.move(moveObj);
    const score = await minimax(searchChess, depth - 1, alpha, beta, false, rootColor);
    const threat = computeCardThreatPenalty(searchChess, rootColor) * threatWeight;
    searchChess.undo();
    if(aiSearchAbort) return null;
    const noise = (depth === 2 && !rubyMode) ? rnd(-15, 15) : 0;
    const finalScore = score - threat + noise;
    if(finalScore > bestScore){ bestScore = finalScore; bestMove = mv; }
    if(finalScore > alpha) alpha = finalScore;
    const y = aiYieldIfNeeded();
    if(y) await y;
  }
  return bestMove;
}

function aiFindRayOption(color, mana, hand){
  if(!hand.includes('ray')) return null;
  const board = chess.board();
  const opts = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color === color || p.type === 'k') continue;
    const cost = rayCostFor(p.type);
    if(cost > mana) continue;
    const score = PIECE_VALUE[p.type] - cost * 30;
    opts.push({ key:'ray', sq: rcToSquare(r,c), cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindZombieOption(color, mana, hand){
  if(!hand.includes('zombie') || mana < POWERS.zombie.cost) return null;
  const board = chess.board();
  const opts = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color === color || p.type === 'k') continue;
    const sq = rcToSquare(r,c);
    if(!isAdjacentToAllyOn(chess, sq, color)) continue;
    const score = PIECE_VALUE[p.type] * 2 - POWERS.zombie.cost * 30;
    opts.push({ key:'zombie', sq, cost: POWERS.zombie.cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindHealOption(color, mana, hand){
  if(!hand.includes('heal')) return null;
  const pile = state.graveyard[color];
  const seen = new Set();
  const opts = [];
  for(const t of pile){
    if(seen.has(t)) continue;
    seen.add(t);
    const cost = healCostFor(t);
    if(cost > mana) continue;
    const score = PIECE_VALUE[t] - cost * 30 - 60;
    opts.push({ key:'heal', type:t, cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
function aiFindShieldOption(color, mana, hand){
  if(!hand.includes('shield') || mana < POWERS.shield.cost) return null;
  if(state.shields[color].length > 0) return null;
  const board = chess.board();
  const opts = [];
  const enemyColor = color === 'w' ? 'b' : 'w';
  const savedTurn = chess.turn();
  const parts = chess.fen().split(' ');
  parts[1] = enemyColor;
  let enemyMoves = [];
  try {
    chess.load(parts.join(' '), { skipValidation: true });
    enemyMoves = chess.moves({ verbose: true });
    const fen2 = chess.fen().split(' ');
    fen2[1] = savedTurn;
    chess.load(fen2.join(' '), { skipValidation: true });
  } catch(e){}
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(!p || p.color !== color) continue;
    const sq = rcToSquare(r,c);
    if(!enemyMoves.some(m => m.to === sq)) continue;
    let score = 0;
    if(p.type === 'k') score = 5000;
    else if(p.type === 'q') score = 700;
    else if(p.type === 'r') score = 400;
    else if(p.type === 'b' || p.type === 'n') score = 250;
    else continue;
    score -= POWERS.shield.cost * 30;
    opts.push({ key:'shield', sq, cost: POWERS.shield.cost, score });
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindTeleportOption(color, mana, hand){
  if(!hand.includes('teleport')) return null;
  if(mana < 2) return null;
  const enemyKing = findKing(color === 'w' ? 'b' : 'w');
  const ek = enemyKing ? sqToRC(enemyKing) : null;
  const board = chess.board();
  const opts = [];
  aiSearchLastYield = performance.now();
  for(let r1=0;r1<8;r1++) for(let c1=0;c1<8;c1++){
    const y = aiYieldIfNeeded();
    if(y) await y;
    if(aiSearchAbort) return null;
    const p = board[r1][c1];
    if(!p || p.color !== color) continue;
    const fromSq = rcToSquare(r1,c1);
    const normalMoves = new Set();
    try {
      const savedFen = chess.fen();
      const parts = savedFen.split(' ');
      parts[1] = color; parts[3] = '-'; parts[4] = '0';
      chess.load(parts.join(' '), { skipValidation: true });
      chess.moves({ square: fromSq, verbose: true }).forEach(m => normalMoves.add(m.to));
      chess.load(savedFen, { skipValidation: true });
    } catch(e){}
    const srcAttacked = isSquareAttackedByEnemy(fromSq, color);
    const srcValue = PIECE_VALUE[p.type];
    for(let r2=0;r2<8;r2++) for(let c2=0;c2<8;c2++){
      if(board[r2][c2]) continue;
      const toSq = rcToSquare(r2,c2);
      if(normalMoves.has(toSq)) continue;
      const cost = teleportCost(fromSq, toSq);
      if(!isFinite(cost) || cost > mana) continue;
      if(simMoveLeavesKingInCheck(fromSq, toSq, color)) continue;
      const dstAttacked = isSquareAttackedByEnemy(toSq, color);
      let reason = 0;
      if(srcAttacked && !dstAttacked) reason += srcValue * 0.5;
      let givesCheck = false;
      const savedFen2 = chess.fen();
      try {
        chess.remove(fromSq);
        chess.put(p, toSq);
        givesCheck = chess.in_check();
      } catch(e){}
      try { chess.load(savedFen2, { skipValidation: true }); } catch(e){}
      if(givesCheck) reason += 150;
      if(ek && (p.type === 'q' || p.type === 'r')){
        const distFrom = Math.max(Math.abs(r1-ek.r), Math.abs(c1-ek.c));
        const distTo = Math.max(Math.abs(r2-ek.r), Math.abs(c2-ek.c));
        if(distTo < distFrom - 1 && distTo <= 3) reason += 55;
      }
      if(p.type === 'n' || p.type === 'b'){
        const bonusFrom = centerBonus(p, r1, c1);
        const bonusTo = centerBonus(p, r2, c2);
        if(bonusTo - bonusFrom >= 16) reason += 45;
      }
      if(reason <= 0) continue;
      if(dstAttacked && !srcAttacked) reason -= srcValue * 0.35;
      else if(dstAttacked && srcAttacked) reason -= srcValue * 0.15;
      reason -= cost * 22;
      if(reason > 0) opts.push({ key:'teleport', from: fromSq, to: toSq, cost, score: reason });
    }
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindQuakeOption(color, mana, hand){
  if(!hand.includes('quake') || mana < POWERS.quake.cost) return null;
  const board = chess.board();
  const opts = [];
  aiSearchLastYield = performance.now();
  for(let cr=0;cr<8;cr++){
    const y = aiYieldIfNeeded();
    if(y) await y;
    if(aiSearchAbort) return null;
    for(let cc=0;cc<8;cc++){
      let enemyVal = 0, ownVal = 0, enemyCount = 0;
      const squares = [];
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const r = cr+dr, c = cc+dc;
        if(r<0||c<0||r>=8||c>=8) continue;
        squares.push(rcToSquare(r,c));
        const p = board[r][c];
        if(!p) continue;
        if(p.color === color) ownVal += PIECE_VALUE[p.type];
        else { enemyVal += PIECE_VALUE[p.type]; enemyCount++; }
      }
      if(enemyCount === 0) continue;
      const net = enemyVal - ownVal;
      if(net < PIECE_VALUE.n) continue;
      const snapshot = [];
      for(const sq of squares){
        const p = chess.get(sq);
        if(p) snapshot.push({ sq, piece: p });
      }
      const savedFen = chess.fen();
      let safeCount = 0, totalTries = 5;
      for(let attempt=0; attempt<totalTries; attempt++){
        const trial = [...squares];
        for(let i=trial.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [trial[i],trial[j]] = [trial[j],trial[i]];
        }
        for(const sq of squares) chess.remove(sq);
        for(let i=0;i<snapshot.length;i++){
          try { chess.put(snapshot[i].piece, trial[i]); } catch(e){}
        }
        let safe = true;
        try {
          const parts = chess.fen().split(' ');
          parts[1] = color; parts[3] = '-'; parts[4] = '0';
          chess.load(parts.join(' '), { skipValidation: true });
          safe = !chess.in_check();
        } catch(e){ safe = true; }
        try { chess.load(savedFen, { skipValidation: true }); } catch(e){}
        if(safe) safeCount++;
      }
      if(safeCount < totalTries * 0.6) continue;
      const score = net * 0.35 - POWERS.quake.cost * 30;
      if(score > 0) opts.push({ key:'quake', sq: rcToSquare(cr,cc), cost: POWERS.quake.cost, score });
    }
  }
  if(!opts.length) return null;
  opts.sort((a,b)=>b.score-a.score);
  return opts[0];
}
async function aiFindBestPower(color){
  const mana = state.mana[color];
  const hand = playerDecks[color].hand;
  const candidates = [];
  const push = c => { if(c) candidates.push(c); };
  push(aiFindRayOption(color, mana, hand));
  push(aiFindZombieOption(color, mana, hand));
  push(aiFindHealOption(color, mana, hand));
  push(aiFindShieldOption(color, mana, hand));
  push(await aiFindTeleportOption(color, mana, hand));
  push(await aiFindQuakeOption(color, mana, hand));
  candidates.sort((a,b) => b.score - a.score);
  return candidates[0] || null;
}
async function aiExecutePower(opt){
  switch(opt.key){
    case 'ray': await execRay(opt.sq, opt.cost); break;
    case 'zombie': await execZombie(opt.sq); break;
    case 'shield': await execShield(opt.sq); break;
    case 'heal': {
      const empties = getAdjacentEmptySquares(aiColor);
      if(empties.length){
        await execHeal(empties[0], opt.type, aiColor, opt.cost);
      } else endTurn();
      break;
    }
    case 'teleport': await execTeleport(opt.from, opt.to, opt.cost); break;
    case 'quake': await execQuake(opt.sq); break;
    default: endTurn();
  }
}
async function aiTurn(){
  if(aiThinking) return;
  if(!aiEnabled || state.gameOver || replay.active || state.paused) return;
  if(chess.turn() !== aiColor) return;

  aiThinking = true;
  state.aiBusy = true;       // bloquea inputs mientras piensa
  aiSearchAbort = false;
  aiSearchLastYield = performance.now();
  updateUI();
  await sleep(180);

  if(state.gameOver || replay.active || state.paused || aiSearchAbort){
    aiThinking = false;
    state.aiBusy = false;
    updateUI();
    return;
  }
  // Doble chequeo: si la partida cambió de turno por algún motivo, abortar
  if(chess.turn() !== aiColor){
    aiThinking = false;
    state.aiBusy = false;
    updateUI();
    return;
  }

  const depth = rubyMode ? 3
              : (aiDifficulty === 'easy' ? 1
              : aiDifficulty === 'normal' ? 2
              : 3);
  let bestMove = null;
  try { bestMove = await findBestMove(depth, aiColor); }
  catch(e){ console.warn('AI error:', e); }

  if(aiSearchAbort || state.gameOver || replay.active || state.paused){
    aiThinking = false;
    state.aiBusy = false;
    updateUI();
    return;
  }

  let powerOption = null;
  try { powerOption = await aiFindBestPower(aiColor); }
  catch(e){ console.warn('AI power error:', e); }

  if(aiSearchAbort || state.gameOver || replay.active || state.paused){
    aiThinking = false;
    state.aiBusy = false;
    updateUI();
    return;
  }

  let usePower = false;
  if(powerOption){
    let threshold;
    if(rubyMode) threshold = 0;
    else if(aiDifficulty === 'hard') threshold = 80;
    else if(aiDifficulty === 'normal') threshold = 150;
    else threshold = 500;
    usePower = powerOption.score >= threshold;
    if(rubyMode && state.mana[aiColor] >= 6 && powerOption.score > 0) usePower = true;
    if(rubyMode && powerOption.score > PIECE_VALUE.r * 0.5) usePower = true;
  }

  aiThinking = false;
  state.aiBusy = false;

  // Ya no estamos bloqueando: ahora sí aplicamos el resultado al juego real
  if(usePower){
    await aiExecutePower(powerOption);
  } else if(bestMove){
    await doPlayerMove(bestMove);
  } else {
    endTurn();
  }
}

function startReplay(){
  if(historyLog.length < 2){ toast('Sin acciones para reproducir'); return; }
  aiSearchAbort = true;
  state.aiBusy = false;
  if(!replay.storedMatch){ replay.originalHistory = null; }
  replay.active = true; replay.index = 0; replay.playing = false; playToken++;
  stopTimer();
  state.lastMove = { from: null, to: null, prevFrom: null, prevTo: null };
clearHighlights();

  // *** FIX: garantizar instancia válida de chess ***
  if(!chess) chess = new Chess();

  $('#replayUI').classList.remove('hidden');

  const entry = historyLog[0];
  if(!entry || !entry.fen){
    console.error('Replay: entrada inicial sin FEN', entry);
    toast('Datos de partida corruptos', '#ff8080');
    replay.active = false;
    $('#replayUI').classList.add('hidden');
    return;
  }

  // *** FIX: cargar el FEN y comprobar que realmente se aplicó ***
  let loaded = false;
  try {
    const res = chess.load(entry.fen, { skipValidation: true });
    loaded = (res !== false);
  } catch(e){ loaded = false; }
  if(!loaded){
    try {
      const res = chess.load(entry.fen);
      loaded = (res !== false);
    } catch(e2){ loaded = false; }
  }
  if(!loaded){
    console.error('Replay: FEN inválido, se reinicia tablero', entry.fen);
    chess = new Chess();
    try { chess.load(entry.fen); } catch(e){}
  }

  rebuildPieces();
  particles.length = 0; bolts.length = 0; curves.length = 0; ripples.length = 0;
  updateReplayUI(entry, 0);
  updateReplayControls();
}
function startReplayFromStored(match){
  if(!match || !match.moves || !match.moves.length){
    toast('Partida vacía o corrupta', '#ff8080');
    return false;
  }
  aiSearchAbort = true;
  state.aiBusy = false;
  replay.storedMatch = match;
  replay.originalHistory = historyLog.slice();
  historyLog.length = 0;
  match.moves.forEach(m => historyLog.push(JSON.parse(JSON.stringify(m))));
  historyEl.innerHTML = '';
  for(const m of historyLog){
    const el = renderHistoryItem(m);
    historyEl.appendChild(el);
  }
  // *** FIX: aplicar el clima guardado de esa partida ***
  if(match.weather) applyWeatherState(match.weather);
  replayFromMenu = true;
  startReplay();
  return replay.active;
}
function closeReplay(){
  stopReplayAuto();
  replay.active = false; replayAnimating = false;
  $('#replayUI').classList.add('hidden');

  const wasFromMenu = replayFromMenu;
  replayFromMenu = false;

  // Restaurar el historial de la partida anterior (si lo había)
  if(replay.storedMatch && replay.originalHistory){
    historyLog.length = 0;
    replay.originalHistory.forEach(m => historyLog.push(m));
    historyEl.innerHTML = '';
    for(const m of historyLog){
      const el = renderHistoryItem(m);
      historyEl.appendChild(el);
    }
    replay.storedMatch = null;
    replay.originalHistory = null;
  }

  // *** FIX: si el replay vino desde el menú principal, volver al menú ***
  if(wasFromMenu){
    setTimeout(() => { startGame(); }, 150);
    return;
  }

  // Cierre normal (si hubiera partida en curso, aunque hoy no se da el caso)
  if(!chess) chess = new Chess();
  const last = historyLog[historyLog.length - 1];
  if(last && last.fen){
    try { chess.load(last.fen, { skipValidation: true }); } catch(e){
      try { chess.load(last.fen); } catch(e2){}
    }
  }
  rebuildPieces();
  particles.length = 0; bolts.length = 0; curves.length = 0; ripples.length = 0;
  for(const el of historyEl.children) el.classList.remove('replay-active');
  updateUI();
}

  const descRow = $('#replayDescRow');

  $('#replayText').textContent = describeEntry(entry);

    target.classList.add('replay-active');

      for(let i=0;i<10;i++){
        setTimeout(() => {
          if(!alive()) return;
          addParticle({ x: C.x + rnd(-cellSize*0.4, cellSize*0.4),
            y: C.y + rnd(-cellSize*0.2, cellSize*0.4),
            vx: rnd(-12,12), vy: rnd(-70,-30), life: rnd(.4,.9), lifeMax:.9,
            size: rnd(1.2,3), color: '#a8ffc0', g:-15, drag:.96 });
        }, i*60);
      }
      return;
    }
    if(name === 'Terremoto' && entry.to){
      const C = squareCenter(entry.to);
      sfx('quake');
      if(alive()){
        boardWrap.animate([
          { transform:'translate(0,0)' },{ transform:'translate(-5px,3px)' },
          { transform:'translate(5px,-3px)' },{ transform:'translate(-4px,-2px)' },
          { transform:'translate(4px,2px)' },{ transform:'translate(-2px,1px)' },
          { transform:'translate(0,0)' }
        ], { duration: 900, easing: 'ease-out' });
      }
      for(let i=0;i<50;i++){
        addParticle({ x: C.x + rnd(-cellSize*1.5, cellSize*1.5), y: C.y + rnd(-cellSize*1.5, cellSize*1.5),
          vx: rnd(-70,70), vy: rnd(-260,-90), life: rnd(.6,1.3), lifeMax:1.3, size: rnd(2,5),
          color: i%3===0 ? '#a08c6a' : i%3===1 ? '#7a6a4a' : '#c0b090', g: 520, drag:.99 });
      }
      spawnSmokeAt(C.x, C.y, 'rgba(120,100,70,0.5)');
      const { r:cr, c:cc } = sqToRC(entry.to);
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const r2 = cr+dr, c2 = cc+dc;
        if(r2<0||c2<0||r2>=8||c2>=8) continue;
        const c3 = squareCenter(rcToSquare(r2,c2));
        ripples.push({ x:c3.x, y:c3.y, r:2, maxR: cellSize*0.9, life:.5, lifeMax:.5, color:'200,170,120' });
      }
      return;
    }
  }
}
async function applyReplayFrameAnimated(i){
  if(replayAnimating) return;
  replayAnimating = true; updateReplayControls();
  const entry = historyLog[i];
  if(!entry){ replayAnimating = false; updateReplayControls(); return; }
  const oldBoard = chess.board();
  const oldEntries = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(oldBoard[r][c]){
      const sq = rcToSquare(r,c);
      oldEntries.push({ sq, piece: oldBoard[r][c], el: pieceEls.get(sq) });
    }
  }
  try { chess.load(entry.fen, { skipValidation: true }); } catch(e){
    try { chess.load(entry.fen); } catch(e2){}
  }
  const newBoard = chess.board();
  const newEntries = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(newBoard[r][c]) newEntries.push({ sq: rcToSquare(r,c), piece: newBoard[r][c] });
  }
  const usedOld = new Set();
  const matchMap = new Map();
  if((entry.type === 'move' || entry.type === 'ira') && entry.from && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.from && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.from); matchMap.set(entry.to, oldP); }
  } else if(entry.type === 'spell' && entry.powerName === 'Teletransporte' && entry.from && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.from && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.from); matchMap.set(entry.to, oldP); }
  } else if(entry.type === 'spell' && entry.powerName === 'Zombosis' && entry.to){
    const oldP = oldEntries.find(o => o.sq === entry.to && !usedOld.has(o.sq));
    const newP = newEntries.find(n => n.sq === entry.to);
    if(oldP && newP){ usedOld.add(entry.to); matchMap.set(entry.to, oldP); }
  }
  for(const np of newEntries){
    if(matchMap.has(np.sq)) continue;
    const old = oldEntries.find(o => !usedOld.has(o.sq) && o.sq === np.sq &&
      o.piece.color === np.piece.color && o.piece.type === np.piece.type);
    if(old){ usedOld.add(old.sq); matchMap.set(np.sq, old); }
  }
  for(const np of newEntries){
    if(matchMap.has(np.sq)) continue;
    const cands = oldEntries.filter(o => !usedOld.has(o.sq) &&
      o.piece.color === np.piece.color && o.piece.type === np.piece.type);
    if(!cands.length) continue;
    const npRC = sqToRC(np.sq);
    let best = null, bestD = Infinity;
    for(const o of cands){
      const orc = sqToRC(o.sq);
      const d = Math.abs(orc.r - npRC.r) + Math.abs(orc.c - npRC.c);
      if(d < bestD){ bestD = d; best = o; }
    }
    if(best){ usedOld.add(best.sq); matchMap.set(np.sq, best); }
  }
  const capturedEls = [];
  for(const op of oldEntries){
    if(!usedOld.has(op.sq) && op.el) capturedEls.push(op.el);
  }
  if(capturedEls.length){
    setTimeout(() => {
      for(const el of capturedEls){
        el.classList.add('captured');
        setTimeout(()=>el.remove(), 300);
      }
    }, 90);
  }
  pieceEls.clear();
  for(const np of newEntries){
    const m = matchMap.get(np.sq);
    let el;
    if(m && m.el){
      el = m.el;
      el.classList.toggle('white', np.piece.color === 'w');
      el.classList.toggle('black', np.piece.color === 'b');
      el.querySelector('.tok').textContent = GLYPH[np.piece.type];
      el.dataset.code = np.piece.color + np.piece.type;
      positionPiece(el, np.sq);
    } else {
      el = createPieceEl(np.piece, np.sq);
      el.classList.add('spawn');
      setTimeout(()=>el.classList.remove('spawn'), 400);
    }
    pieceEls.set(np.sq, el);
    updatePieceClass(el, np.piece, np.sq);
  }
  playReplayEffects(entry);
  updateReplayUI(entry, i);
  await sleep(420);
  replayAnimating = false;
  updateReplayControls();
}
async function replayGoTo(i){
  if(replayAnimating) return;
  if(i < 0 || i >= historyLog.length) return;
  replay.index = i;
  await applyReplayFrameAnimated(i);
}
function replayPrev(){ if(!replay.active) return; stopReplayAuto(); if(replay.index > 0) replayGoTo(replay.index - 1); }
function replayNext(){ if(!replay.active) return; stopReplayAuto(); if(replay.index < historyLog.length - 1) replayGoTo(replay.index + 1); }
function replayPlayPause(){ if(!replay.active) return; if(replay.playing) stopReplayAuto(); else startReplayAuto(); }
async function startReplayAuto(){
  if(replay.playing) return;
  replay.playing = true;
  const token = ++playToken;
  updateReplayControls();
  if(replay.index >= historyLog.length - 1) replay.index = 0;
  while(token === playToken && replay.playing && replay.active && replay.index < historyLog.length - 1){
    replay.index++;
    await applyReplayFrameAnimated(replay.index);
    if(token !== playToken) break;
    await sleep(80);
  }
  if(token === playToken){ replay.playing = false; updateReplayControls(); }
}
function stopReplayAuto(){ playToken++; replay.playing = false; updateReplayControls(); }
function updateReplayControls(){
  const btn = $('#rPlay');
  if(btn) btn.textContent = replay.playing ? '⏸' : '▶';
  const disabled = replayAnimating;
  $('#rPrev').disabled = disabled || replay.index <= 0;
  $('#rNext').disabled = disabled || replay.index >= historyLog.length - 1;
}
$('#rPrev').onclick = replayPrev;
$('#rNext').onclick = replayNext;
$('#rPlay').onclick = replayPlayPause;
$('#rClose').onclick = closeReplay;

function exportMatch(match){
  const data = JSON.stringify(match, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = 'ajedrez_' + (match.name || match.id).replace(/[^a-z0-9_\-]/gi, '_') + '.json';
  a.href = url; a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Partida exportada', '#a8e8b0');
}
function importMatchFromFile(parentOverlay){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !data.moves || !Array.isArray(data.moves)){
        toast('Archivo inválido', '#ff8080');
        return;
      }
      if(!data.id) data.id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      if(!data.name) data.name = new Date(data.date || Date.now()).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      if(!data.date) data.date = Date.now();
      const l = loadMatchList();
      if(l.some(x => x.id === data.id)){
        data.id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      }
      l.unshift(data);
      if(l.length > 50) l.length = 50;
      saveMatchList(l);
      toast('Partida importada ✓', '#a8e8b0');
      if(parentOverlay) parentOverlay.remove();
      setTimeout(openMatchHistory, 250);
    } catch(err){
      console.error(err);
      toast('No se pudo importar el archivo', '#ff8080');
    }
  };
  input.click();
}

async function showStartMenu(){
  while(true){
    const res = await showConfigMenu();
    if(res.action === 'cancel') return 'cancel';
    if(res.action === 'history'){
      const histRes = await openMatchHistory();
      if(histRes && histRes.action === 'replay' && histRes.match){
        const started = startReplayFromStored(histRes.match);
        if(started){
          // *** FIX: salir del bucle SIN volver a abrir el menú ***
          return 'replay';
        }
        // si no arrancó (datos corruptos), seguir el bucle normalmente
      }
      continue;
    }
    if(res.action === 'start'){
      const cfg = res.cfg;
      if(cfg.mode === 'pvp'){
        aiEnabled = false; rubyMode = false;
        humanColor = 'w'; aiColor = 'b';
      } else {
        aiEnabled = true;
        aiDifficulty = cfg.mode;
        rubyMode = (cfg.mode === 'ruby');
        humanColor = cfg.side;
        aiColor = cfg.side === 'w' ? 'b' : 'w';
      }
      gameTimer.enabled = cfg.timerMinutes > 0;
      gameTimer.initial = cfg.timerMinutes * 60;
      gameTimer.w = gameTimer.initial;
      gameTimer.b = gameTimer.initial;
      return 'start';
    }
  }
}

  startTimer();
  updateClocks();
  // Permitir que empiece una nueva búsqueda de IA
  setTimeout(() => { aiSearchAbort = false; }, 100);
}

/* =========================================================
   LAYOUT / LOOP
   ========================================================= */
function layout(){
  const rect = boardWrap.getBoundingClientRect();
  boardW = rect.width; boardH = rect.height; cellSize = rect.width / 8;
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(terr.h) renderTerrain(rect.width, rect.height);
  piecesEl.style.setProperty('--cs', cellSize + 'px');
  for(const [sq, el] of pieceEls) positionPiece(el, sq);
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  worldTime += dt;
  updateWeather(dt);
  updateParticles(dt);
  updateAmbience();
  // --- Scheduler de rayos (cada 500ms revisa si toca) ---
  {
    const now_ms = performance.now();
    if(now_ms - lightning.lastCheck > 500){
      lightning.lastCheck = now_ms;
      const r = ambience.rainLevel;
      if(r > 0.16){
        // Probabilidad por tick de 0.5s: sube cuadráticamente con la lluvia
        const norm = (r - 0.16) / 0.84;
        const ratePerSec = Math.pow(norm, 2.3) * 0.55;   // ~0.55/s a lluvia máxima
        if(Math.random() < ratePerSec * 0.5){
          triggerLightning(r);
        }
      }
    }
  }
  const W = boardW, H = boardH;
  ctx.clearRect(0, 0, W, H);
  if(terrainOffscreen) ctx.drawImage(terrainOffscreen, 0, 0, W, H);
  else { ctx.fillStyle = '#1a2418'; ctx.fillRect(0,0,W,H); }

// ===== Cuadrícula con ola diagonal 🌊 =====
{
  const period = 5000; // ms por barrido completo
  const phase = (performance.now() % period) / period; // 0 → 1 (frente de onda)
  const step = W / 8;
  const lw = Math.max(1, W / 480);
  
  // Función de onda: campana gaussiana centrada en `phase`, con wrap circular
  const waveWidth = 0.16;
  const brightnessAt = (fase) => {
    let d = fase - phase;
    if (d < -0.5) d += 1;
    if (d > 0.5) d -= 1;
    return Math.exp(-(d * d) / (waveWidth * waveWidth)); // 0..1
  };
  
  const baseA = 0.045; // opacidad en el valle de la ola
  const peakA = 0.42; // opacidad en la cresta
  
  ctx.save();
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  
  // --- Líneas verticales ---
  for (let i = 0; i <= 8; i++) {
    // Sobre la vertical i, la fase del punto (x=i/8, y) es (i/8 + y)/2
    // Va desde i/16 (arriba) hasta i/16 + 0.5 (abajo)
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    for (let s = 0; s <= 8; s++) {
      const f = s / 8;
      const fase = i / 16 + f * 0.5;
      const b = brightnessAt(fase);
      const a = baseA + b * (peakA - baseA);
      grad.addColorStop(f, `rgba(255,248,225,${a})`);
    }
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(i * step + lw * 0.5, 0);
    ctx.lineTo(i * step + lw * 0.5, H);
    ctx.stroke();
  }
  
  // --- Líneas horizontales ---
  for (let i = 0; i <= 8; i++) {
    // Sobre la horizontal i, la fase del punto (x, y=i/8) es (x + i/8)/2
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    for (let s = 0; s <= 8; s++) {
      const f = s / 8;
      const fase = i / 16 + f * 0.5;
      const b = brightnessAt(fase);
      const a = baseA + b * (peakA - baseA);
      grad.addColorStop(f, `rgba(255,248,225,${a})`);
    }
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, i * step + lw * 0.5);
    ctx.lineTo(W, i * step + lw * 0.5);
    ctx.stroke();
  }
  
  // --- Cruces brillantes donde la ola está en su pico (pequeños destellos) ---
  for (let i = 0; i <= 8; i++) {
    for (let j = 0; j <= 8; j++) {
      const fase = (i + j) / 16;
      const b = brightnessAt(fase);
      if (b < 0.55) continue;
      const a = (b - 0.55) / 0.45 * 0.85;
      const px = i * step;
      const py = j * step;
      const r = lw * 2.2;
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, `rgba(255,252,235,${a})`);
      g.addColorStop(1, 'rgba(255,252,235,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, 6.2832);
      ctx.fill();
    }
  }
  
  ctx.restore();
}

  const ph = getPhase();
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${ph.tint[0]|0},${ph.tint[1]|0},${ph.tint[2]|0})`;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
  ctx.fillStyle = `rgba(${ph.tint[0]|0},${ph.tint[1]|0},${ph.tint[2]|0},${ph.a})`;
  ctx.fillRect(0,0,W,H);
  if(ph.dark > 0){
    ctx.fillStyle = `rgba(6,8,22,${ph.dark})`;
    ctx.fillRect(0,0,W,H);
  }
  if(ph.dark > 0.08){
    const inten = clamp((ph.dark - 0.08) / 0.20, 0, 1);
    for(const f of terr.fireflies){
      f.t += dt * f.spd;
      const px = (f.x + Math.sin(f.t*0.7 + f.phase)*f.ax) * W;
      const py = (f.y + Math.cos(f.t*0.5 + f.phase*1.3)*f.ay) * H;
      const blink = (Math.sin(f.t*3.2 + f.phase)*0.5 + 0.5);
      const a = blink * inten * 1.0;
      if(a < 0.05) continue;
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(px, py, 0, px, py, 9);
      g.addColorStop(0, 'rgba(220,255,150,1)');
      g.addColorStop(0.35, 'rgba(140,255,100,0.65)');
      g.addColorStop(1, 'rgba(80,255,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 9, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.save();
  for(const f of fogBlobs){
    f.x += f.spd * dt;
    if(f.x > 1.3) f.x = -0.3;
    if(f.x < -0.3) f.x = 1.3;
    const px = f.x * W;
    const py = (f.y + Math.sin(now*0.0002 + f.ph)*0.03) * H;
    const pr = f.r * W;
    const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
    const alpha = f.a * (1 + Math.sin(now*0.0004 + f.ph)*0.25);
    g.addColorStop(0, `rgba(220,225,235,${alpha})`);
    g.addColorStop(1, 'rgba(220,225,235,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(px, py, pr, pr*0.55, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
    if(rainAmt > 0.012){
    const visible = Math.floor(rainDrops.length * (0.05 + 0.90 * Math.pow(rainAmt, 0.55)));

    // Alpha: crece poco. Con poca lluvia se ve tenue, con mucha no llega a "manchar".
    const alpha   = 0.20 + rainAmt * 0.24;      // 0.20 → 0.44

    // LARGO: acá está el truco. De cortitas a estelas larguísimas.
    const lenScale = 0.65 + rainAmt * 4.20;     // 0.65x → 4.85x la longitud base

    // Grosor: crece lento (evita el efecto "sábana blanca")
    const lw = 0.55 + rainAmt * 0.75;

    // Velocidad: caen más rápido cuando arrecia
    const speedMul = 0.85 + rainAmt * 1.15;

    // Inclinación: más diagonal con más viento
    const slant = 0.14 + rainAmt * 0.14;

    ctx.strokeStyle = `rgba(180,210,240,${alpha})`;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for(let i=0;i<visible;i++){
      const d = rainDrops[i];
      d.y += d.spd * speedMul * dt;
      d.x += d.spd * speedMul * dt * 0.18;
      if(d.y > 1.05){ d.y = -0.05; d.x = Math.random(); }
      if(d.x > 1.05) d.x -= 1.1;

      const px = d.x * W, py = d.y * H;
      const L = d.len * lenScale;               // longitud efectiva de esta gota
      ctx.moveTo(px, py);
      ctx.lineTo(px - L * W * slant, py + L * H);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  // VIÑETA
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.32, W/2, H/2, H*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

    // --- Flash de rayo ---
  if(lightning.strikes.length > 0){
    const now_ms = performance.now();
    let bestA = 0, bestCol = '210,225,255';
    for(let i = lightning.strikes.length - 1; i >= 0; i--){
      const s = lightning.strikes[i];
      const elapsed = now_ms - s.startTime;
      if(elapsed < 0) continue;
      if(elapsed > s.dur){ lightning.strikes.splice(i, 1); continue; }
      const t = elapsed / s.dur;
      let a;
      if(t < 0.07){
        a = s.peak * (t / 0.07);
      } else {
        a = s.peak * Math.pow(1 - (t - 0.07) / 0.93, 1.6);
      }
      if(a > bestA){ bestA = a; bestCol = s.color; }
    }
    if(bestA > 0.012){
      // Capa 1: relleno general
      ctx.fillStyle = `rgba(${bestCol},${bestA * 0.75})`;
      ctx.fillRect(0, 0, W, H);
      // Capa 2: brillo extra en el punto de impacto (radial)
      const cx = rnd(W * 0.15, W * 0.85);
      const cy = rnd(H * 0.10, H * 0.60); // siempre desde el cielo hacia abajo
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 1.0);
      grad.addColorStop(0, `rgba(255,255,255,${bestA * 0.85})`);
      grad.addColorStop(0.4, `rgba(${bestCol},${bestA * 0.5})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  drawParticles();
  requestAnimationFrame(loop);
}

/* =========================================================
   EVENTOS
   ========================================================= */
gridEl.addEventListener('click', (e) => {
  initAudio();
  if(replay.active || state.paused) return;
  if(state.aiBusy) return;
  const cell = e.target.closest('.cell');
  if(!cell) return;
  onSquareClick(cell.dataset.sq);
});
gridEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if(replay.active || state.paused || state.aiBusy) return;
  if(state.targeting && state.targeting.key !== 'ira') cancelTargeting();
});
$('#cancelBtn').onclick = () => cancelTargeting();
$('#undoBtn').onclick = () => { initAudio(); performUndo(); };
$('#btnPause').onclick = () => togglePause();
$('#btnSound').onclick = () => {
  initAudio();
  soundEnabled = !soundEnabled;
  localStorage.setItem('ajedrez_sound', soundEnabled ? 'on' : 'off');
  updateSoundButton();
  if(masterGain){
    masterGain.gain.setTargetAtTime(soundEnabled ? 1 : 0, actx.currentTime, 0.08);
  }
  if(soundEnabled) tone(660, .12, 'sine', .05, 200);
};
$('#btnConfig').onclick = () => {
  togglePause();
  setTimeout(() => { openQuickConfig(); }, 50);
};
$('#btnRestart').onclick = () => restartGame();
$('#btnExit').onclick = () => exitToMenu();

async function openQuickConfig(){
  const res = await showModal('Opciones', '¿Qué deseas hacer?', [
    { label:'▶ Continuar', value:'continue', cls:'yes' },
    { label:'🔄 Reiniciar', value:'restart', cls:'no' },
    { label:'🚪 Salir al menú', value:'exit', cls:'danger' }
  ]);
  if(res === 'continue'){
    state.paused = false;
    $('#pauseOverlay').classList.add('hidden');
    $('#btnPause').textContent = '⏸';
    return;
  }
  if(res === 'restart'){ restartGame(); return; }
  if(res === 'exit'){ exitToMenu(); return; }
}

window.addEventListener('resize', () => setTimeout(layout, 60));
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

document.addEventListener('visibilitychange', () => {
  if(!actx || !ambience.started) return;
  const target = (document.hidden || !soundEnabled) ? 0 : 1;
  try { masterGain.gain.setTargetAtTime(target, actx.currentTime, 0.3); } catch(e){}
});

function boot(){
  if(typeof Chess === 'undefined'){
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#f88">' +
      'No se pudo cargar la librería de ajedrez (chess.js). Revisa tu conexión.</div>';
    return;
  }
  buildGrid();
  generateTerrain();
  updateSoundButton();
  setupDecks(['ray','shield','teleport'], ['ray','shield','teleport']);
  requestAnimationFrame(() => {
    layout();
    requestAnimationFrame(loop);
  });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>setTimeout(layout, 100));
  }
  startGame();
}
boot();
</script>
