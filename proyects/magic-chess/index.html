<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ajedrez Mágico</title>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.1/chess.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06070b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:#e8e0d0;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh}
#topBar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;background:linear-gradient(#1b1710,#0c0a07);
  border-bottom:1px solid #2a2018;gap:6px;min-height:38px}
#topBar .tbTitle{font-size:12px;font-weight:700;color:#d8c8a0;letter-spacing:.4px;
  text-shadow:0 0 8px rgba(255,200,90,.35);white-space:nowrap;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
#topBar .tbBtns{display:flex;gap:5px;flex-shrink:0}
.topBtn{width:30px;height:30px;border-radius:7px;border:1px solid #4a3a22;
  background:linear-gradient(#221c14,#141009);color:#d8c8a8;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:all .13s;padding:0;line-height:1;flex-shrink:0}
.topBtn:active{transform:scale(.9)}
.topBtn:hover{background:linear-gradient(#2a2416,#1a140c);color:#fff}
.topBtn.warn{border-color:#8a4a4a;color:#ffb0b0}
.topBtn.good{border-color:#4a7a4a;color:#a8e8b0}
#history{flex:0 0 auto;height:42px;background:linear-gradient(#1b1710,#0c0a07);
  border-bottom:1px solid #3a2e1e;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:0 6px;gap:4px;scrollbar-width:none}
#history::-webkit-scrollbar{display:none}
.hist-item{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:3px 7px;
  border-radius:6px;background:#221c14;border:1px solid #3a2e1e;flex:0 0 auto;line-height:1;
  height:32px;transition:box-shadow .2s,background .2s}
.hist-item.spell{background:#251a34;border-color:#5a3f88}
.hist-item.ira{background:#2e1c0c;border-color:#8a5a20}
.hist-item.block{background:#14202e;border-color:#3a608a}
.hist-item.start{background:#181810;border-color:#4a4020}
.hist-item.replay-active{box-shadow:0 0 0 2px #ffd070,0 0 12px rgba(255,200,90,.55);
  background:#2a2414;border-color:#8a6a30}
.hist-piece{font-size:15px;line-height:1;font-family:serif}
.hist-piece.w{color:#fbf6ea;text-shadow:0 0 2px #000,0 0 3px rgba(0,0,0,.9),1px 1px 0 #2a1a08}
.hist-piece.b{color:#c9a878;text-shadow:0 0 2px #000,0 0 3px rgba(0,0,0,.9)}
.hist-piece.faded{opacity:.55}
.hist-pos{font-size:10px;color:#a8a090;font-family:ui-monospace,monospace}
.hist-sym{font-size:13px;line-height:1}
.hist-arrow{font-size:11px;color:#8a8070;margin:0 1px}
.hist-cost{font-size:9px;color:#6fa8ff;font-weight:800;margin-left:2px}
#boardWrap{position:relative;width:min(100%,calc(100dvh - 300px));aspect-ratio:1/1;
  margin:0 auto;flex:0 0 auto;overflow:hidden;background:#0a0d0a;
  box-shadow:0 8px 34px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.4)}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
#fpsCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:10;              /* encima de #pieces (z-index:3) */
  pointer-events:none;     /* no bloquea clics en las celdas */
}
#grid{position:absolute;inset:0;display:grid;z-index:2;
  grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.cell{position:relative;cursor:pointer}
.cell::after{content:'';position:absolute;inset:0;pointer-events:none;transition:background .12s}
.cell.last-prev::after{background:rgba(200,180,120,.13);box-shadow:inset 0 0 0 2px rgba(200,180,120,.32)}
.cell.last-from::after{background:rgba(255,215,120,.15);box-shadow:inset 0 0 0 2px rgba(255,215,120,.38)}
.cell.last-to::after{background:rgba(255,215,120,.20);box-shadow:inset 0 0 0 2px rgba(255,215,120,.65)}
.cell.last-power-ray::after{
  background:rgba(120,220,255,.30);
  box-shadow:inset 0 0 0 2px rgba(120,220,255,.90),
             0 0 10px rgba(120,220,255,.40);
}
.cell.last-power-zombie::after{
  background:rgba(60,220,120,.28);
  box-shadow:inset 0 0 0 2px rgba(60,220,120,.88),
             0 0 10px rgba(60,220,120,.35);
}
.cell.last-power-quake::after{
  background:rgba(210,180,130,.30);
  box-shadow:inset 0 0 0 2px rgba(210,180,130,.85),
             0 0 10px rgba(210,180,130,.30);
}
.cell.last-power-teleport::after{
  background:rgba(200,140,255,.30);
  box-shadow:inset 0 0 0 2px rgba(200,140,255,.90),
             0 0 10px rgba(200,140,255,.40);
}
.cell.last-power-heal::after{
  background:rgb(243 255 150 / 30%);
  box-shadow:inset 0 0 0 2px rgb(244 255 150 / 90%),
              0 0 10px rgb(205 255 150 / 40%);
}
.cell.sel::after{background:rgba(255,228,120,.30);box-shadow:inset 0 0 0 3px rgba(255,215,90,.95)}
.cell.mv::after{background:radial-gradient(circle at 50% 50%,rgba(130,235,150,.85) 0 16%,rgba(130,235,150,.25) 17% 26%,transparent 27%)}
.cell.cap::after{background:radial-gradient(circle at 50% 50%,transparent 0 60%,rgba(255,80,80,.75) 62% 78%,transparent 80%)}
.cell.tgt::after{background:rgba(90,200,255,.28);box-shadow:inset 0 0 0 3px rgba(90,200,255,.9);animation:pulseBlue 1s infinite}
.cell.tgt2::after{background:rgba(120,255,160,.24);box-shadow:inset 0 0 0 3px rgba(120,255,160,.9);border-radius:50%;animation:pulseGreen 1s infinite}
.cell.tgtEnemy::after{background:rgba(255,60,60,.22);box-shadow:inset 0 0 0 3px rgba(255,80,80,.95);border-radius:50%;animation:pulseRed .8s infinite}
.cell.tgtEnemy.dis::after{background:rgba(120,60,60,.15);box-shadow:inset 0 0 0 3px rgba(120,80,80,.6);animation:none}
.cell.ira::after{background:radial-gradient(circle at 50% 50%,transparent 0 52%,rgba(255,150,40,.9) 54% 72%,transparent 74%);animation:spinPulse 1.1s infinite}
.cell .costTag{position:absolute;bottom:2px;right:3px;font-size:9px;font-weight:800;color:#ffd070;
  background:rgba(0,0,0,.7);padding:0 4px;border-radius:5px;z-index:5;
  font-family:ui-monospace,monospace;pointer-events:none;text-shadow:0 1px 2px #000}
@keyframes pulseBlue{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pulseGreen{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pulseRed{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spinPulse{0%,100%{opacity:.55}50%{opacity:1}}
#pauseOverlay{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  backdrop-filter:blur(5px);animation:fadeIn .18s}
#pauseOverlay.hidden{display:none}
#pauseOverlay .pt{font-size:38px;color:#ffe0a0;font-weight:800;letter-spacing:3px;
  text-shadow:0 0 24px rgba(255,200,90,.7)}
#pauseOverlay .ps{font-size:12px;color:#a89c86;letter-spacing:1px}
#clockBar{display:flex;gap:6px;padding:0 4px;margin-top:-2px}
.clock{flex:1;text-align:center;padding:4px 8px;border-radius:6px;
  background:#0a0c14;border:1px solid #2a3040;
  font-family:ui-monospace,monospace;font-size:14px;font-weight:700;
  color:#c8d8f0;transition:all .25s;position:relative}
.clock .who{font-size:9px;color:#6a7a9a;font-weight:600;letter-spacing:.5px;margin-right:4px}
.clock.active{border-color:#6a8ac0;color:#fff;box-shadow:0 0 10px rgba(90,140,220,.5)}
.clock.low{color:#ff8080;border-color:#8a4a4a;animation:clockPulse .7s infinite}
.clock.wout{color:#505050;background:#050505}
.clock.hidden{display:none}
@keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.45}}
#pieces{position:absolute;inset:0;z-index:3;pointer-events:none}
.piece{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
  transition:transform 190ms cubic-bezier(.18,.75,.28,1);will-change:transform;z-index:5}
.piece .tok{width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid #462c12;position:relative;
  background:radial-gradient(circle at 34% 28%,#e6c692,#c1945a 58%,#8d6234);
  box-shadow:0 2px 6px rgba(0,0,0,.65),inset 0 1px 2px rgba(255,255,255,.4),
             inset 0 -3px 6px rgba(0,0,0,.25);
  font-size:calc(var(--cs,40px) * .58);line-height:1;transition:box-shadow .3s}
.piece.black .tok{background:radial-gradient(circle at 34% 28%,#9b7b52,#6d5232 58%,#3f2d17)}
.piece.white .tok{color:#fffaee;text-shadow:0 0 1px #4a2e0c,1px 1px 0 #4a2e0c,-1px -1px 0 #4a2e0c,
  1px -1px 0 #4a2e0c,-1px 1px 0 #4a2e0c,0 2px 3px rgba(0,0,0,.55)}
.piece.black .tok{color:#150d05;text-shadow:0 1px 0 rgba(255,220,170,.45),0 2px 3px rgba(0,0,0,.5)}
.piece.captured .tok{opacity:0;transform:scale(.35) rotate(25deg);transition:all .26s ease-in}
.piece.spawn .tok{animation:spawnIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes spawnIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
/* ---------- Escudo: anillo EXTERIOR (pseudo-elemento) ---------- */
.piece.shielded .tok::before{
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:2px solid rgba(120,200,255,0.90);
  box-shadow:
    0 0 10px 2px rgba(90,180,255,0.55),
    inset 0 0 6px rgba(90,180,255,0.35);
  animation:shieldHalo 1.9s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shieldHalo{
  0%,100%{ transform:scale(1);    opacity:.82; }
  50%    { transform:scale(1.06); opacity:1;   }
}

/* ---------- Ira: anillo INTERIOR (box-shadow del tok) ---------- */
.piece.ira .tok{
  box-shadow:
    0 0 0 3px rgba(255,150,40,.90),
    0 0 14px 4px rgba(255,140,20,.55),
    0 2px 6px rgba(0,0,0,.65);
  animation:iraGlow .9s infinite alternate;
}

/* ---------- Cuando coinciden: el escudo sigue afuera y la Ira adentro ---------- */
.piece.shielded.ira .tok::before{
  border-color:rgba(160,220,255,0.95);
  box-shadow:
    0 0 14px 3px rgba(90,180,255,0.65),
    inset 0 0 8px rgba(90,180,255,0.40);
  animation:iraGlow .9s infinite alternate;
}
.piece.in-check .tok{
  box-shadow: 0 0 0 3px rgba(255,60,60,.9),
              0 0 18px 6px rgba(255,40,40,.7),
              0 2px 6px rgba(0,0,0,.65);
  animation: checkPulse .8s infinite alternate;
}
/* Pegar junto al resto del CSS del escudo */
.piece.shielded-weak .tok::before{
  border-color:rgba(180,210,255,0.75);
  border-style:dashed;
  box-shadow:
    0 0 6px 1px rgba(120,160,255,0.35),
    inset 0 0 4px rgba(120,160,255,0.20);
  animation-duration:1.5s;
}
.piece.shielded-weak.ira .tok::before{
  border-color:rgba(200,220,255,0.85);
}
@keyframes checkPulse{
  from{filter:brightness(1) saturate(1.15)}
  to  {filter:brightness(1.35) saturate(1.55)}
}
@keyframes iraGlow{from{filter:brightness(1)}to{filter:brightness(1.28)}}
.piece.shake .tok{animation:quakeShake 0.12s infinite}
@keyframes quakeShake{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  20%{transform:translate(-3px,2px) rotate(-4deg)}
  40%{transform:translate(3px,-2px) rotate(3deg)}
  60%{transform:translate(-2px,-3px) rotate(-3deg)}
  80%{transform:translate(2px,3px) rotate(4deg)}}
#controls{flex:1 1 auto;overflow-y:auto;padding:8px 8px 14px;background:linear-gradient(#0d0b08,#06070b);
  border-top:1px solid #2a2116;display:flex;flex-direction:column;gap:6px;min-height:0}
#turnBar{display:flex;align-items:center;justify-content:space-between;font-size:13px;
  padding:4px 10px;border-radius:8px;background:#12100b;border:1px solid #2e2418}
#turnDot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px;
  box-shadow:0 0 8px currentColor;vertical-align:-1px}
#turnInfo{display:flex;align-items:center;font-weight:600;letter-spacing:.3px}
#statusMsg{font-size:11px;color:#9a8f7c;text-align:right}
#manaRow{display:flex;gap:8px}
.manaBar{flex:1;height:24px;border-radius:12px;background:#0c0e16;border:1px solid #333a52;
  position:relative;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.manaBar .fill{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width .4s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(90deg,#2a4fb0,#63a8ff,#a8d8ff);box-shadow:0 0 12px rgba(90,160,255,.7)}
.manaBar.b .fill{background:linear-gradient(90deg,#6a25b0,#b062ff,#e0b0ff);box-shadow:0 0 12px rgba(180,100,255,.7)}
.manaBar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;text-shadow:0 1px 3px #000;letter-spacing:.5px;z-index:2}
.manaBar .shine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
#oppHandRow{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#12100b;
  border-radius:8px;border:1px solid #2e2418;min-height:34px;font-size:11px;overflow:hidden}
#oppHandRow .oppLabel{color:#8a8070;font-weight:600;flex-shrink:0;font-size:10px}
#oppHandRow .oppCards{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#oppHandRow .oppCards::-webkit-scrollbar{display:none}
.oppCard{position:relative;              /* ⬅️ ESTA LÍNEA FALTABA */
display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:5px;
  background:#1e1a13;border:1px solid #3a2f20;font-size:13px;line-height:1;flex-shrink:0;opacity:.6}
.oppCard .nm{font-size:8.5px;color:#a89c86;white-space:nowrap}
#powerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pbtn{background:linear-gradient(#221c14,#141009);border:1px solid #4a3d28;border-radius:10px;
  padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#d8ccb0;font-size:10px;cursor:pointer;transition:all .15s;position:relative;
  font-family:inherit;line-height:1.2;min-height:66px;justify-content:center}
.pbtn .ic{font-size:22px;line-height:1}
.pbtn .nm{font-weight:700;text-align:center;font-size:9.5px;letter-spacing:.2px}
.pbtn .cost{position:absolute;top:3px;right:5px;font-size:9px;font-weight:800;color:#7ac0ff;
  text-shadow:0 0 6px rgba(90,150,255,.9)}
.pbtn.ready{border-color:#7a9ad0;box-shadow:0 0 10px rgba(90,140,255,.35),inset 0 0 12px rgba(60,100,200,.2)}
.pbtn.ready:active{transform:scale(.94)}
.pbtn.dis{opacity:.4;filter:grayscale(.8);cursor:default}
.pbtn.active{border-color:#8ad0ff;box-shadow:0 0 16px rgba(120,200,255,.8);background:linear-gradient(#1a2838,#0d1620)}
#actionRow{display:flex;gap:8px}
.abtn{flex:1;padding:10px;border-radius:9px;border:1px solid #4a3a22;
  background:linear-gradient(#2a2116,#16110a);color:#e0d0b0;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s}
.abtn:active{transform:scale(.97)}
.abtn.hidden{display:none}
#undoBtn{border-color:#3a5a8a;background:linear-gradient(#1a2a40,#0d1520);color:#a8c8ff;
  box-shadow:0 0 10px rgba(90,150,255,.2)}
#undoBtn:active{background:linear-gradient(#24406a,#12203a)}
#undoBtn.dis{opacity:.35;filter:grayscale(.7);cursor:default}
#achStrip{display:flex;gap:4px;align-items:center;padding:3px 6px;background:#0f0d09;
  border-radius:8px;border:1px solid #2a2018;min-height:30px;overflow-x:auto;scrollbar-width:none}
#achStrip::-webkit-scrollbar{display:none}
.achChip{display:flex;align-items:center;gap:2px;padding:2px 6px;border-radius:5px;font-size:9.5px;
  background:#1a150e;border:1px solid #3a2e1e;color:#8a8070;flex:0 0 auto;
  animation:achPop .5s cubic-bezier(.3,1.4,.4,1)}
.achChip.w{border-color:#5a6a8a;color:#d8e0f0}
.achChip.b{border-color:#7a5a3a;color:#e8c8a0}
.achChip .ic{font-size:12px}
.achChip .nm{font-weight:700;font-size:9px}
@keyframes achPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.ach-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:210;
  padding:14px 22px;border-radius:14px;background:linear-gradient(#2a2014,#150f08);
  border:2px solid #d0a050;color:#ffe8b0;text-align:center;pointer-events:none;
  box-shadow:0 10px 40px rgba(0,0,0,.9),0 0 40px rgba(255,190,90,.4);
  animation:achToastAnim 2.4s forwards;min-width:200px}
.ach-toast .bigIc{font-size:38px;display:block;margin-bottom:2px;filter:drop-shadow(0 0 12px rgba(255,200,90,.9))}
.ach-toast .title{font-size:16px;font-weight:800;letter-spacing:.5px;text-shadow:0 0 12px rgba(255,200,90,.7)}
.ach-toast .sub{font-size:11px;color:#c8b898;margin-top:3px}
@keyframes achToastAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  10%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  18%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);
  animation:fadeIn .18s;padding:12px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(#1c1812,#0f0d09);border:1px solid #5a4526;border-radius:14px;
  padding:18px 20px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;
  box-shadow:0 14px 50px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,220,160,.12);
  animation:popIn .22s cubic-bezier(.2,1.3,.5,1)}
.modal.wide{max-width:520px}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 8px;font-size:17px;color:#f0d9a0;letter-spacing:.4px}
.modal p{margin:0 0 14px;font-size:12.5px;color:#a89c86;line-height:1.5}
.modal .section{text-align:left;margin:10px 0 4px}
.modal .section-title{font-size:11px;color:#8a8070;letter-spacing:1.2px;font-weight:700;
  margin-bottom:6px;text-transform:uppercase}
.modal-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mbtn{padding:10px 16px;border-radius:9px;border:1px solid #5a4526;
  background:linear-gradient(#2e2416,#1a140c);color:#e8d8b8;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .13s;min-width:64px;position:relative}
.mbtn:active{transform:scale(.95)}
.mbtn.small{padding:6px 10px;font-size:11px;min-width:auto}
.mbtn.glyph{font-size:22px;padding:8px 12px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:auto}
.mbtn.glyph small{font-size:9px;color:#7ac0ff;font-weight:800}
.mbtn.glyph.dis{opacity:.35;filter:grayscale(.7);cursor:not-allowed;border-color:#3a3020}
.mbtn.yes{border-color:#4a7a3a;background:linear-gradient(#1e3a18,#0e1c0a);color:#b8e898}
.mbtn.no{border-color:#7a3a3a;background:linear-gradient(#3a1818,#1c0a0a);color:#e89898}
.mbtn.replay{border-color:#5a7ac0;background:linear-gradient(#1a2848,#0d1628);color:#a8c8ff}
.mbtn.ai{border-color:#5a7ac0;background:linear-gradient(#1c2440,#0e1220);color:#b8d0ff}
.mbtn.ruby{border-color:#d04080;background:linear-gradient(#4a0f28,#22070f);color:#ffb0d0;
  box-shadow:0 0 12px rgba(255,80,140,.35)}
.mbtn.picked{border-color:#ffd070;background:linear-gradient(#3a2e1a,#20180e);
  box-shadow:0 0 14px rgba(255,200,90,.6);transform:scale(1.05)}
.mbtn.danger{border-color:#8a3a3a;background:linear-gradient(#3a1a1a,#1c0a0a);color:#ffb0b0}
.cfgGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.cfgGrid.c3{grid-template-columns:repeat(3,1fr)}

<script>
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const shuffle = a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };
function hash2(x,y,s){ const v = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453; return v - Math.floor(v); }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,s){ let v=0,a=0.5,f=1; for(let i=0;i<4;i++){ v+=a*vnoise(x*f,y*f,s+i*31.7); f*=2; a*=0.5; } return v; }
function formatTime(sec){ if(sec < 0) sec = 0; const m = Math.floor(sec/60), s = Math.floor(sec%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

/* =========================================================
   AUDIO
   ========================================================= */
let actx = null;
let masterGain = null;
function initAudio(){
  if(actx){
    if(actx.state === 'suspended') {
      actx.resume().catch(()=>{});
    }
    return;
  }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = soundEnabled ? 1 : 0;
    masterGain.connect(actx.destination);
    initAmbience();
    // *** FIX: despertar el contexto apenas se crea ***
    if(actx.state === 'suspended') {
      actx.resume().catch(()=>{});
    }
  } catch(e){}
}

document.addEventListener('pointerdown', function wakeAudio(){
  initAudio();
  document.removeEventListener('pointerdown', wakeAudio);
}, { once: true });

let soundEnabled = (localStorage.getItem('ajedrez_sound') !== 'off');
function updateSoundButton(){
  const b = $('#btnSound');
  if(!b) return;
  b.textContent = soundEnabled ? '🔊' : '🔇';
  b.classList.toggle('warn', !soundEnabled);
}
function vibrate(pattern){
  try { if(navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
}

/* ===== AMBIENCE con generadores orgánicos ===== */
const ambience = {
  started: false,
  rainLevel: 0,
  nightLevel: 0,
  lastUpdate: 0,
  rainSrc: null, rainHiSrc: null, windSrc: null,
  rainLpGain: null, rainBpGain: null,
  rainLp: null, rainBp: null,
  windGain: null,
  cricketGain: null,
  cricketTimer: null
};

// ---- Generadores de valores "cada tanto cambia el target" ----
const org = {
  wind:      { level: 0,    target: 0,    nextChange: 0 },
  rainWobble:{ level: 0.85, target: 0.85, nextChange: 0 },
  crickets:  { level: 0,    target: 0,    nextChange: 0 }
};

function randWindTarget(){
  const r = rainAmt;
  const u = Math.random();
  // Lluvia FUERTE → viento asegurado
  if(r > 0.70) return 0.55 + Math.random() * 0.45;
  // Lluvia MEDIA → 75% chance de viento marcado
  if(r > 0.35){
    if(u < 0.75) return 0.25 + Math.random() * 0.55;
    return 0.02 + Math.random() * 0.12;
  }
  // Lluvia LIGERA → 45% chance de viento suave
  if(r > 0.08){
    if(u < 0.45) return 0.10 + Math.random() * 0.40;
    return 0;
  }
  // Día SECO → 20% chance de brisa suave, 80% calma total
  if(u < 0.20) return 0.06 + Math.random() * 0.22;
  return 0;
}

function scheduleWindChange(){
  const now = performance.now();
  const isRainy = rainAmt > 0.30;
  const base  = isRainy ? 1.5 : 4.0;
  const range = isRainy ? 4.0 : 11.0;
  org.wind.nextChange = now + (base + Math.random() * range) * 1000;
}

function updateWind(dt){
  const now = performance.now();
  if(org.wind.nextChange === 0) scheduleWindChange();
  if(now >= org.wind.nextChange){
    org.wind.target = randWindTarget();
    scheduleWindChange();
  }
  // Sube rápido (ráfaga), baja más lento (calma)
  const speed = org.wind.target > org.wind.level ? 0.7 : 2.0;
  const k = 1 - Math.exp(-dt / speed);
  org.wind.level += (org.wind.target - org.wind.level) * k;
  // Micro-ráfagas: una señal de alta frecuencia encima del nivel base
  const micro = (Math.sin(now * 0.0029) * 0.5 + 0.5) *
                (Math.sin(now * 0.0073 + 1.7) * 0.5 + 0.5) * 0.12;
  return clamp(org.wind.level + micro * org.wind.level, 0, 1);
}

function updateRainWobble(dt){
  const now = performance.now();
  if(org.rainWobble.nextChange === 0){
    org.rainWobble.nextChange = now + 700 + Math.random() * 1800;
  }
  if(now >= org.rainWobble.nextChange){
    org.rainWobble.target = 0.68 + Math.random() * 0.32;   // 0.68..1.00
    org.rainWobble.nextChange = now + 700 + Math.random() * 1800;
  }
  const k = 1 - Math.exp(-dt / 0.35);
  org.rainWobble.level += (org.rainWobble.target - org.rainWobble.level) * k;
  return org.rainWobble.level;
}

function updateCricketEnergy(dt){
  const now = performance.now();
  if(org.crickets.nextChange === 0){
    org.crickets.nextChange = now + 6000 + Math.random() * 12000;
  }
  if(now >= org.crickets.nextChange){
    org.crickets.target = 0.25 + Math.random() * 0.75;     // 0.25..1.0
    org.crickets.nextChange = now + 6000 + Math.random() * 12000;
  }
  const k = 1 - Math.exp(-dt / 2.5);
  org.crickets.level += (org.crickets.target - org.crickets.level) * k;
  return org.crickets.level;
}

function createNoiseBuffer(seconds){
  const n = Math.floor(actx.sampleRate * seconds);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  return buf;
}

function initAmbience(){
  if(!actx || ambience.started) return;
  ambience.started = true;
  ambience.lastUpdate = performance.now();

  const noiseBuf = createNoiseBuffer(4);

  // --- LLUVIA: dos ramas (retumbo grave + siseo agudo) ---
  const rainSrc = actx.createBufferSource();
  rainSrc.buffer = noiseBuf; rainSrc.loop = true;
  const rainLp = actx.createBiquadFilter();
  rainLp.type = 'lowpass'; rainLp.frequency.value = 260; rainLp.Q.value = 0.6;
  const rainLpGain = actx.createGain(); rainLpGain.gain.value = 0;
  rainSrc.connect(rainLp).connect(rainLpGain).connect(masterGain);

  const rainHiSrc = actx.createBufferSource();
  rainHiSrc.buffer = noiseBuf; rainHiSrc.loop = true;
  const rainBp = actx.createBiquadFilter();
  rainBp.type = 'bandpass'; rainBp.frequency.value = 2400; rainBp.Q.value = 0.35;
  const rainBpGain = actx.createGain(); rainBpGain.gain.value = 0;
  rainHiSrc.connect(rainBp).connect(rainBpGain).connect(masterGain);

  // --- VIENTO: ruido grave filtrado ---
  const windSrc = actx.createBufferSource();
  windSrc.buffer = noiseBuf; windSrc.loop = true;
  const windLp = actx.createBiquadFilter();
  windLp.type = 'lowpass'; windLp.frequency.value = 160; windLp.Q.value = 0.5;
  const windGain = actx.createGain(); windGain.gain.value = 0;
  windSrc.connect(windLp).connect(windGain).connect(masterGain);

  // --- GRILLOS ---
  const cricketGain = actx.createGain();
  cricketGain.gain.value = 0;
  cricketGain.connect(masterGain);

  rainSrc.start();
  rainHiSrc.start();
  windSrc.start();

  Object.assign(ambience, {
    rainSrc, rainHiSrc, windSrc,
    rainLp, rainBp, rainLpGain, rainBpGain,
    windGain, cricketGain
  });

  scheduleCricket();
}

function updateAmbience(){
  if(!actx || !ambience.started) return;
  const now = performance.now();
  const elapsed = Math.min(0.5, (now - ambience.lastUpdate) / 1000);
  ambience.lastUpdate = now;

  // --- Suavizado de los niveles "maestros" ---
  const kRain  = 1 - Math.exp(-elapsed / 1.4);
  const kNight = 1 - Math.exp(-elapsed / 3.0);
  ambience.rainLevel  += (rainAmt - ambience.rainLevel) * kRain;

  const ph = getPhase();
  const nightTarget = ph.dark > 0.15 ? Math.min(1, (ph.dark - 0.15) / 0.40) : 0;
  ambience.nightLevel += (nightTarget - ambience.nightLevel) * kNight;

  // --- Generadores orgánicos (aportan la irregularidad) ---
  const windLevel   = updateWind(elapsed);
  const wobble      = updateRainWobble(elapsed);
  const cricketEner = updateCricketEnergy(elapsed);

  const rl = ambience.rainLevel;
  const nl = ambience.nightLevel;
  const pauseFactor = state.paused ? 0 : 1;
  const t = actx.currentTime;

  // --- LLUVIA: sin base, arranca de 0 ---
  // El wobble modula la intensidad entre ~0.68 y 1.00, tipo "rachas"
    // Curva exponencial: con poca lluvia suena MUCHO más bajo, pero el pico se mantiene
  const rainCurve = Math.pow(rl, 1.7);
  const lpGain = (rainCurve * 0.22 * wobble) * pauseFactor;
  const hiGain = (rainCurve * 0.18 * wobble) * pauseFactor;
  ambience.rainLpGain.gain.setTargetAtTime(lpGain, t, 0.35);
  ambience.rainBpGain.gain.setTargetAtTime(hiGain, t, 0.35);
  // Con más lluvia, filtro más abierto (retumbo más grave y presente)
  ambience.rainLp.frequency.setTargetAtTime(200 + rl * 380, t, 0.6);
  ambience.rainBp.frequency.setTargetAtTime(2100 + rl * 1900, t, 0.6);

  // --- VIENTO: sin base fija. Si el generador dice 0, no se oye nada ---
  const windG = windLevel * 0.055 * pauseFactor;
  ambience.windGain.gain.setTargetAtTime(windG, t, 0.35);

  // --- GRILLOS: energía propia + noche + castigo por lluvia ---
  const cricketLevel = nl * cricketEner * (1 - rl * 0.9);
  ambience.cricketTarget = cricketLevel;
  ambience.cricketGain.gain.setTargetAtTime(cricketLevel * 0.6 * pauseFactor, t, 1.8);
}

function scheduleCricket(){
  if(!actx || !ambience.started) return;
  // Ráfagas más irregulares, y se espacian si hay poca energía
  const energy = ambience.cricketTarget;
  const baseDelay = 900 + (1 - energy) * 3500;
  const delay = baseDelay + Math.random() * 3500;
  ambience.cricketTimer = setTimeout(() => {
    if(actx && ambience.started && ambience.cricketTarget > 0.06 && Math.random() < 0.5 + ambience.cricketTarget * 0.5){
      playCricketChirp();
    }
    scheduleCricket();
  }, delay);
}

function playCricketChirp(){
  if(!actx || !soundEnabled) return;
  const t0 = actx.currentTime + 0.02;
  const baseFreq = 3800 + Math.random() * 1100;
  const pulses = 2 + Math.floor(Math.random() * 4);
  const pulseDur = 0.024 + Math.random() * 0.016;
  const gap = 0.028 + Math.random() * 0.020;
  let t = t0;
  for(let i=0;i<pulses;i++){
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = baseFreq * (0.97 + Math.random() * 0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + pulseDur);
    o.connect(g); g.connect(ambience.cricketGain);
    o.start(t); o.stop(t + pulseDur + 0.015);
    t += pulseDur + gap;
  }
}

/* ===== RAYOS Y TRUENOS ===== */
const lightning = {
  strikes: [],
  lastCheck: 0
};

function triggerLightning(rainLevel){
  const now = performance.now();
  // Intensidad base según lluvia, con mucha variabilidad
  const intensity = clamp(0.35 + rainLevel * 0.65 * (0.35 + Math.random() * 0.75), 0.2, 1);

  // Distancia: 0=cercano, 1.8=lejano
  const distance = 0.1 + Math.random() * 1.7;

  // A mayor distancia, retraso mayor y menor volumen
  // Duración del flash
  const dur = 100 + Math.random() * 400;
  // Peak visual
  const peak = clamp(0.40 + intensity * 0.65, 0, 0.90);

  // Color: cuanto más fuerte, más blanco-cálido; cuanto más lejos, más azul
  const warmth = intensity * (1 - distance * 0.4);
  const r = Math.floor(210 + warmth * 45);
  const g = Math.floor(220 + warmth * 35);
  const b = 255;
  const col = `${r},${g},${b}`;

  // Flash principal
  lightning.strikes.push({ startTime: now, peak, dur, color: col });

  // Doble flash muy común en rayos reales
  if(Math.random() < 0.55){
    const delay = dur * (0.25 + Math.random() * 0.5);
    lightning.strikes.push({
      startTime: now + delay,
      peak: peak * (0.55 + Math.random() * 0.4),
      dur: dur * (0.55 + Math.random() * 0.6),
      color: col
    });
  }
  // Triple flash ocasional en tormentas fuertes
  if(intensity > 0.75 && Math.random() < 0.4){
    const delay = dur * (1.0 + Math.random() * 0.9);
    lightning.strikes.push({
      startTime: now + delay,
      peak: peak * 0.45,
      dur: dur * 0.6,
      color: col
    });
  }

  // Sonido: el trueno llega después (distancia)
  setTimeout(() => playThunder(intensity, distance), distance * 1000);
}

function startBoom(tStart, dur, vol, cutoff, intensity, near){
  if(!actx) return;

  // ===== CAPA 1: retumbo grave (se siente en buenos parlantes) =====
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for(let i=0;i<n;i++){
    const white = Math.random()*2 - 1;
    last = (last + 0.05*white) / 1.05;      // ruido marrón, cutoff ~350Hz
    const p = i/n;
    // Ataque SUAVE (15% de la duración), cuerpo, decay
    let env;
    if(p < 0.15)      env = p / 0.15;
    else if(p < 0.30) env = 1.0;
    else              env = Math.pow(1 - (p - 0.30)/0.70, 1.5);
    d[i] = last * env * 3.2;
  }
  const src = actx.createBufferSource(); src.buffer = buf;
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = cutoff;
  lp.Q.value = 0.9;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, tStart);
  g.gain.linearRampToValueAtTime(vol, tStart + dur * 0.15);
  g.gain.setValueAtTime(vol, tStart + dur * 0.30);
  g.gain.exponentialRampToValueAtTime(0.0001, tStart + dur);
  src.connect(lp).connect(g).connect(masterGain);
  src.start(tStart);
  src.stop(tStart + dur + 0.05);

  // ===== CAPA 2: "punch" en medios para el celular =====
  // Sin esto, los truenos lejanos serían totalmente inaudibles en un teléfono.
  if(near > 0.15){
    const pn = Math.floor(actx.sampleRate * dur * 0.75);
    const pbuf = actx.createBuffer(1, pn, actx.sampleRate);
    const pd = pbuf.getChannelData(0);
    for(let i=0;i<pn;i++){
      const p = i/pn;
      let env;
      if(p < 0.10)      env = p / 0.10;
      else if(p < 0.22) env = 1.0;
      else              env = Math.pow(1 - (p - 0.22)/0.78, 2.0);
      pd[i] = (Math.random()*2 - 1) * env;
    }
    const ps = actx.createBufferSource(); ps.buffer = pbuf;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 380 + rnd(-60, 180);
    bp.Q.value = 0.65;
    const pg = actx.createGain();
    const pvol = vol * near * 0.55;
    pg.gain.setValueAtTime(0.0001, tStart);
    pg.gain.linearRampToValueAtTime(pvol, tStart + dur * 0.10);
    pg.gain.exponentialRampToValueAtTime(0.0001, tStart + dur * 0.75);
    ps.connect(bp).connect(pg).connect(masterGain);
    ps.start(tStart);
  }
}

function playThunder(intensity, distance){
  if(!actx || !soundEnabled) return;
  const t0 = actx.currentTime + 0.02;

  // Volumen según distancia e intensidad
  const distFactor = 1 / (0.55 + distance * 1.05);
  const vol = clamp(intensity * distFactor * 0.85, 0, 1.0);
  const near = Math.max(0, 1 - distance * 0.95);   // 1=cerca, 0=lejos

  // ===== CRACK inicial (solo si el rayo es cercano) =====
  // Es lo que hace "¡CRAC!" antes del boom en tormentas sobre tu cabeza.
  if(near > 0.45){
    const cdur = 0.28 + intensity * 0.35;
    const cn = Math.floor(actx.sampleRate * cdur);
    const cbuf = actx.createBuffer(1, cn, actx.sampleRate);
    const cd = cbuf.getChannelData(0);
    for(let i=0;i<cn;i++){
      const p = i/cn;
      // Envolvente con doble caída: un pequeño pico después del ataque
      let env = Math.pow(1 - p, 1.7);
      if(p < 0.05) env *= p / 0.05;    // mini fade-in de 5% para que no clickee
      cd[i] = (Math.random()*2 - 1) * env;
    }
    const cs = actx.createBufferSource(); cs.buffer = cbuf;
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 260;
    const peak = actx.createBiquadFilter();
    peak.type = 'peaking';
    peak.frequency.value = 1300;
    peak.gain.value = 5;
    peak.Q.value = 0.8;
    const cg = actx.createGain();
    const cvol = vol * near * 0.85;
    cg.gain.setValueAtTime(0.0001, t0);
    cg.gain.linearRampToValueAtTime(cvol, t0 + 0.012);   // ataque 12ms
    cg.gain.exponentialRampToValueAtTime(0.0001, t0 + cdur);
    cs.connect(hp).connect(peak).connect(cg).connect(masterGain);
    cs.start(t0);
  }

  // ===== CUERPO: varias "olas" desfasadas (PUMPUM pam) =====
  // 2-5 golpes con delays y filtros distintos, imitando la reflexión
  // de la onda de choque contra nubes y terreno.
  const numBooms = 2 + Math.floor(Math.random() * 3 + intensity * 2);
  let cursor = 0.10;  // pequeño respiro después del crack
  for(let i=0;i<numBooms;i++){
    // Cada boom se desfasa un poco más que el anterior
    const delay = cursor + rnd(0.06, 0.42);
    const boomDur = rnd(0.9, 2.1) + intensity * 0.7;
    const boomVol = vol * Math.max(0.15, 1 - i * 0.18) * rnd(0.7, 1.0);
    // Los booms tardíos suenan más graves y más "lejos"
    const boomFreq = Math.max(70, 210 - i * 28 + rnd(-35, 35) - near * 30);
    startBoom(t0 + delay, boomDur, boomVol, boomFreq, intensity, near * Math.max(0.4, 1 - i*0.2));
    cursor = delay + boomDur * 0.65;
  }

  // ===== COLA LARGA =====
  // Un rugido bajo que se desvanece lentamente, como cuando el trueno
  // se aleja y retumba en el horizonte.
  const tailDelay = cursor + rnd(0.15, 0.55);
  const tailDur = 2.0 + intensity * 2.8;
  const tn = Math.floor(actx.sampleRate * tailDur);
  const tbuf = actx.createBuffer(1, tn, actx.sampleRate);
  const td = tbuf.getChannelData(0);
  let tl = 0;
  for(let i=0;i<tn;i++){
    const white = Math.random()*2 - 1;
    tl = (tl + 0.08 * white) / 1.08;   // cutoff ~500Hz
    const p = i/tn;
    td[i] = tl * Math.pow(1 - p, 1.3) * 2.6;
  }
  const ts = actx.createBufferSource(); ts.buffer = tbuf;
  const tlp = actx.createBiquadFilter();
  tlp.type = 'lowpass'; tlp.frequency.value = 320;
  const tg = actx.createGain();
  const tvol = vol * 0.42;
  tg.gain.setValueAtTime(0.0001, t0 + tailDelay);
  tg.gain.linearRampToValueAtTime(tvol, t0 + tailDelay + 0.35);
  tg.gain.exponentialRampToValueAtTime(0.0001, t0 + tailDelay + tailDur);
  ts.connect(tlp).connect(tg).connect(masterGain);
  ts.start(t0 + tailDelay);
}

function tone(freq, dur, type='sine', vol=0.06, slide=0){
  if(!actx || !soundEnabled) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), actx.currentTime+dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(actx.currentTime+dur);
}
function noiseBurst(dur, vol=0.05, filterFreq=1200){
  if(!actx || !soundEnabled) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(masterGain); src.start();
}
function sfx(kind){
  if(!actx) return;
  switch(kind){
    case 'move': tone(220,.09,'triangle',.045,-60); break;
    case 'capture': noiseBurst(.14,.07,2200); tone(140,.14,'square',.035,-70); break;

    case 'ray': noiseBurst(.35,.11,3200); tone(90,.4,'sawtooth',.06,-50); break;
    case 'heal': tone(660,.22,'sine',.05,300); tone(990,.3,'sine',.03,400); break;
    case 'shield': tone(330,.25,'triangle',.05,120); break;
    case 'zombie': tone(180,.5,'sawtooth',.05,-90); noiseBurst(.4,.05,600); break;
    case 'quake': noiseBurst(.7,.12,320); tone(55,.8,'sawtooth',.07,-20); break;
    case 'ira': tone(300,.18,'square',.05,200); noiseBurst(.2,.06,1800); break;
    case 'promo': [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.05),i*70)); break;
    case 'end': [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.05),i*120)); break;
    case 'ach': [659,880,1174].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',.07),i*90)); break;
    case 'undo': tone(340,.18,'triangle',.05,-80); tone(220,.22,'sine',.04,-60); break;
    case 'timeout': [330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.06,-40),i*130)); break;
  }
}

/* FPS recientes: ¿hay señales de estrés? */
function recentFpsStressed(){
  const s = quality.fpsSamples;
  if(s.length < 20) return false;             // sin datos → no asumir estrés
  const tail = s.slice(-20);
  const avg = tail.reduce((a,b)=>a+b,0) / tail.length;
  const min = Math.min(...tail);
  // Estrés si el promedio cayó por debajo de 45 O hubo un pico feo
  return avg < 45 || min < 25;
}

function currentQuality(){
  let level = quality.effective;
  const p = QUALITY_PRESETS[level] || QUALITY_PRESETS.high;
  return { ...p, level };
}

function getWaveStyle(){
  if(quality.waveStyle !== 'auto') return quality.waveStyle;
  return currentQuality().wave;
}
function getParticleScale(){
  if(!quality.particlesEnabled) return 0;
  return currentQuality().particles;
}
function getRainScale(){
  if(!quality.rainEnabled) return 0;

  paintLastMove();

/* Monitor de FPS con ventana deslizante e histeresis */
const FPS_WINDOW = 120;                // ~2s a 60fps
const FPS_WARMUP_MS = 3000;
const FPS_COOLDOWN_DOWN_MS = 1200;     // reacción rápida al bajar
const FPS_COOLDOWN_UP_MS = 8000;       // reacción lenta al subir (evita ping-pong)

function updateQualityFromFPS(dt){
  if(dt <= 0) return;
  const now = performance.now();

  // ⬇️ SIEMPRE: agregar muestra (incluso si el cap es bajo o no es auto)
  const fps = 1 / Math.max(dt, 0.001);
  quality.fpsSamples.push(fps);
  if(quality.fpsSamples.length > FPS_WINDOW) quality.fpsSamples.shift();

  // ⬇️ A partir de acá: solo lógica de auto-calidad
  if(now < quality.warmupUntil) return;
  if(quality.mode !== 'auto') return;
  if(quality.fpsCap < 60) return;  // el usuario capó abajo → no tocar calidad

  if(quality.fpsSamples.length < 60) return;   // más muestras → menos ruido

  // Percentil 25 (robusto frente a picos aislados)
  const sorted = [...quality.fpsSamples].sort((a,b)=>a-b);
  const p25 = sorted[Math.floor(sorted.length * 0.25)];
  const p50 = sorted[Math.floor(sorted.length * 0.50)];

  // Nos quedamos con el peor de los dos (p25), pero suavizado
  // Si p50 es bueno y p25 aceptable, no bajamos por un solo pico
  const ref = Math.min(p50 * 1.05, p25 * 1.4);

  const order = ['emergency', 'low', 'medium', 'high'];
  const idx = order.indexOf(quality.effective);

  let target = quality.effective;
  // ⬇️ UMBRALES MUY RELAJADOS ⬇️
  if     (ref < 8)   target = 'emergency';
  else if(ref < 20)  target = 'low';
  else if(ref < 30)  target = 'medium';
  else               target = 'high';

  if(target === quality.effective) return;

  const isUpgrade = order.indexOf(target) > idx;
  // Nunca subir más de un escalón a la vez
  if(isUpgrade && order.indexOf(target) - idx > 1){
    target = order[idx + 1];
  }

  const cooldown = isUpgrade ? FPS_COOLDOWN_UP_MS : FPS_COOLDOWN_DOWN_MS;
  if(now - quality.lastChange < cooldown) return;

  // Para subir, exigir que las últimas muestras realmente estén bien
  if(isUpgrade){
    const tail = quality.fpsSamples.slice(-40);
    const tailAvg = tail.reduce((a,b)=>a+b,0) / tail.length;
    if(tailAvg < 45) return;
  }

  quality.effective = target;
  quality.lastChange = now;
  console.log(`[quality] → ${target}  (p25: ${p25.toFixed(1)}  p50: ${p50.toFixed(1)})`);

  if(typeof toast === 'function'){
    const icon = { high:'✨', medium:'⚖️', low:'🍃', emergency:'⚡' }[target];
    const label = { high:'Alta', medium:'Media', low:'Baja', emergency:'Emergencia' }[target];
    toast(`${icon} Calidad ${label}`, '#8ad0ff');
  }
}

function teleportCost(fromSq, toSq){
  const a = sqToRC(fromSq), b = sqToRC(toSq);
  const dist = Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c));
  if(dist < 1 || dist > TELEPORT_MAX_DIST) return Infinity;
  return dist * 2;
}

function setupDecks(wPicks, bPicks){
  const all = [...ALL_CARD_KEYS];
  playerDecks.w.hand = [...wPicks];
  playerDecks.w.queue = shuffle(all.filter(k => !wPicks.includes(k)));
  playerDecks.b.hand = [...bPicks];
  playerDecks.b.queue = shuffle(all.filter(k => !bPicks.includes(k)));
}
function cycleCard(color, key){
  const deck = playerDecks[color];
  const idx = deck.hand.indexOf(key);
  if(idx < 0) return;
  deck.hand.splice(idx, 1);
  const drawn = deck.queue.shift();
  deck.queue.push(key);
  deck.hand.push(drawn);
}

const particles = [];
const bolts = [];
const curves = [];
const ripples = [];
function addParticle(p){
  const scale = getParticleScale();
  if(scale <= 0) return;
  const cap = Math.floor(900 * scale);
  if(particles.length < cap) particles.push(p);
}
function burst(x, y, n, opts={}){
  const scale = getParticleScale();
  if(scale <= 0) return;
  n = Math.max(1, Math.floor(n * scale));
  for(let i=0;i<n;i++){
    const a = opts.angle !== undefined ? opts.angle + rnd(-0.6,0.6) : rnd(0, Math.PI*2);
    const sp = rnd(opts.spMin||30, opts.spMax||140);
    addParticle({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(opts.lifeMin||0.3, opts.lifeMax||0.8), maxLife: 1,
      size: rnd(opts.sizeMin||1.5, opts.sizeMax||3.5),
      color: opts.color || '#ffdd88',
      g: opts.g !== undefined ? opts.g : 180, drag: opts.drag || 0.965,
      shape: opts.shape || 'circle' });
  }
}
function spawnDust(fromSq, toSq){
  const a = squareCenter(fromSq), b = squareCenter(toSq);
  for(let i=0;i<10;i++){
    const t = i/10;
    addParticle({ x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t) + rnd(-3,3),
      vx: rnd(-18,18), vy: rnd(-30,-8), life: rnd(.25,.5), maxLife:.5,
      size: rnd(1.2,2.6), color:'rgba(210,190,150,0.8)', g:-20, drag:.94 });
  }
}

function spawnVortex(x, y, color, inward){
  for(let i=0;i<34;i++){
    const a = Math.random()*Math.PI*2;
    const r = inward ? rnd(4,34) : rnd(2,8);
    const sp = inward ? rnd(-70,-30) : rnd(60,140);
    addParticle({ x: x + Math.cos(a)*r, y: y + Math.sin(a)*r,
      vx: Math.cos(a+Math.PI/2)*rnd(40,90) + Math.cos(a)*sp*0.4,
      vy: Math.sin(a+Math.PI/2)*rnd(40,90) + Math.sin(a)*sp*0.4,
      life: rnd(.35,.7), maxLife:.7, size: rnd(1.6,3.6), color, g:0, drag:.94 });
  }
}
function spawnBolt(x, y){
  const pts = []; let cx = x + rnd(-40,40), cy = 0; pts.push({x:cx, y:cy});
  const steps = 9;
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    const nx = lerp(cx, x, t) + rnd(-14,14)*(1-t*0.6);
    const ny = lerp(cy, y, t);
    pts.push({x:nx, y:ny});
  }
  bolts.push({ pts, life:0.42, maxLife:0.42 });
  ripples.push({ x, y, r:2, maxR: cellSize*1.4, life:.5, maxLife:.5, color:'255,230,140' });
  burst(x, y, 26, { color:'#fff2a0', spMin:60, spMax:240, lifeMin:.25, lifeMax:.6, sizeMin:1, sizeMax:3, shape:'tri' });
  burst(x, y, 14, { color:'#ffb040', spMin:20, spMax:90, lifeMin:.4, lifeMax:.9, sizeMin:2, sizeMax:5 });
}
function spawnCurve(a, b, color){ curves.push({ a, b, life:0.4, maxLife:0.4, color }); }
function spawnSmokeAt(x,y,color='rgba(60,60,60,0.5)'){
  for(let i=0;i<18;i++){
    addParticle({ x: x+rnd(-8,8), y: y+rnd(-6,6),
      vx: rnd(-14,14), vy: rnd(-40,-12), life: rnd(.6,1.3), maxLife:1.3,
      size: rnd(4,10), color, g:-12, drag:.96 });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||0)*dt;
    const f = Math.pow(p.drag || 0.97, dt*60); p.vx *= f; p.vy *= f;
  }
  for(let i=bolts.length-1;i>=0;i--){ bolts[i].life -= dt; if(bolts[i].life<=0) bolts.splice(i,1); }
  for(let i=curves.length-1;i>=0;i--){ curves[i].life -= dt; if(curves[i].life<=0) curves.splice(i,1); }
  for(let i=ripples.length-1;i>=0;i--){
    const r = ripples[i]; r.life -= dt; r.r = lerp(r.r, r.maxR, dt*7);
    if(r.life<=0) ripples.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const t = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = t; ctx.fillStyle = p.color;
    if(p.shape === 'tri'){
      ctx.beginPath();
      const s = p.size*(0.5+t*0.9);
      ctx.moveTo(p.x, p.y-s); ctx.lineTo(p.x+s, p.y+s); ctx.lineTo(p.x-s, p.y+s);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(0.4+t*0.75), 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for(const b of bolts){
    const t = b.life / b.maxLife;
    ctx.globalAlpha = t; ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = 3.4;
    ctx.shadowColor = '#ffe070'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(b.pts[0].x, b.pts[0].y);
    for(let i=1;i<b.pts.length;i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
    ctx.stroke(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  for(const c of curves){
    const t = c.life / c.maxLife;
    ctx.globalAlpha = t; ctx.strokeStyle = c.color; ctx.lineWidth = 2.5;
    ctx.setLineDash([6,6]); ctx.lineDashOffset = -performance.now()*0.05;
    ctx.beginPath();
    const mx = (c.a.x+c.b.x)/2, my = (c.a.y+c.b.y)/2 - 40;
    ctx.moveTo(c.a.x, c.a.y); ctx.quadraticCurveTo(mx, my, c.b.x, c.b.y);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  for(const r of ripples){
    const t = r.life / r.maxLife;
    ctx.globalAlpha = t * 0.8;
    ctx.strokeStyle = `rgba(${r.color},${t})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

    fog:     { r:120, g:80, b:60 },

  },

    ],

    hasFlowers:true                                       // flag nueva
  }
};
const BIOME_KEYS = ['forest','desert','snow','volcano','cute'];

/* =========================================================
   PREFERENCIAS PERSISTENTES
   ========================================================= */
const PREFS_KEY = 'ajedrez_magico_prefs_v1';

// 'biomePreference' = lo que el usuario eligió en el menú ('random' o un id)
// 'pendingBiome'    = bioma concreto para la próxima partida (siempre un id)
let biomePreference = 'random';
let pendingBiome = 'random';

function savePreferences(cfg){
  biomePreference = cfg.biome || 'random';
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      mode: cfg.mode,
      side: cfg.side,
      biome: biomePreference,
      timerMinutes: cfg.timerMinutes
    }));
  } catch(e){}
}

function loadPreferences(){
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(!p || typeof p !== 'object') return null;
    return p;
  } catch(e){ return null; }
}

let currentBiome = BIOMES.forest;
/* =========================================================
   TERRENO
   ========================================================= */
const TERR_N = 96;
const terr = { h: null, water: null, rocks: [], fireflies: [], rivers: [], lakes: [], seed: 0, flowers: [] };
let terrainOffscreen = null;
function generateTerrain(){
  const N = TERR_N;
  const h = new Float32Array(N*N);
  const water = new Uint8Array(N*N);
  const seed = Math.random()*1000;
  terr.seed = seed;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    let v = fbm(x/N*3.6, y/N*3.6, seed);
    v = v*1.32 - 0.17;
    const ex = Math.min(x, N-1-x)/(N*0.5);
    const ey = Math.min(y, N-1-y)/(N*0.5);
    const edge = Math.min(1, Math.min(ex,ey)*2.4);
    v = v*0.82 + 0.10 + (1-edge)*0.05;
    h[y*N+x] = clamp(v, 0, 1);
  }

    terr.rivers = [];
  terr.lakes = [];

  /* =========================================================
     SISTEMA HÍDRICO v4
     - 28% sin ríos / 44% ríos normales (nivel 1) / 28% anchos (nivel 2)
     - Nunca se mezclan: si hay ríos anchos, no hay normales, y viceversa
     - Lagos: independientes, aparecen 60% (1 o 2), con forma orgánica
     ========================================================= */
  const priorWaterSnapshot = new Uint8Array(N*N);
  const edgesList = ['top','bottom','left','right'];

  // ---- Helper: construir un río (devuelve array de samples o null) ----
  function buildRiver(isWide){
    const pad = 3;
    const overshoot = isWide ? 10 : 6;

    for(let attempt = 0; attempt < 12; attempt++){
      const se = edgesList[Math.floor(Math.random()*4)];
      let ee;
      do { ee = edgesList[Math.floor(Math.random()*4)]; } while(ee === se);

      const pointOnEdge = (edge) => {
        const t = 0.10 + Math.random()*0.80;
        switch(edge){
          case 'top':    return [pad + t*(N-2*pad), -overshoot];
          case 'bottom': return [pad + t*(N-2*pad), N-1+overshoot];
          case 'left':   return [-overshoot, pad + t*(N-2*pad)];
          case 'right':  return [N-1+overshoot, pad + t*(N-2*pad)];
        }
      };
      const start = pointOnEdge(se);
      const end = pointOnEdge(ee);

      const dx = end[0]-start[0];
      const dy = end[1]-start[1];
      const len = Math.hypot(dx, dy) || 1;
      if(len < N*0.55) continue;

      let perpX = -dy/len;
      let perpY =  dx/len;
      const midX = (start[0]+end[0])/2;
      const midY = (start[1]+end[1])/2;
      if(perpX*(N/2 - midX) + perpY*(N/2 - midY) < 0){ perpX = -perpX; perpY = -perpY; }

      // Ríos anchos → más rectos y con menos amplitud
      const isStraight = Math.random() < (isWide ? 0.65 : 0.45);
      const A1 = isStraight
        ? rnd(0.004, 0.015) * N
        : (isWide ? rnd(0.020, 0.060) * N : rnd(0.030, 0.110) * N);
      const A2 = isStraight
        ? rnd(0.002, 0.008) * N
        : (isWide ? rnd(0.005, 0.018) * N : rnd(0.008, 0.030) * N);
      const f1 = isWide ? rnd(0.5, 1.0) : rnd(0.7, 1.4);
      const f2 = rnd(2.0, 3.5);
      const phase = Math.random() * Math.PI * 2;

      const SAMPLES = 100;
      const cand = [];
      for(let i = 0; i <= SAMPLES; i++){
        const t = i / SAMPLES;
        const baseX = start[0] + dx*t;
        const baseY = start[1] + dy*t;
        const envelope = Math.sin(t * Math.PI);
        const offset = envelope * (
          A1 * Math.sin(t * Math.PI * f1)
          + A2 * Math.sin(t * Math.PI * f2 + phase)
        );
        cand.push([baseX + perpX*offset, baseY + perpY*offset]);
      }

      let firstInside = -1;
      for(let i = 0; i < cand.length; i++){
        const [x, y] = cand[i];
        if(x >= 0 && x < N && y >= 0 && y < N){ firstInside = i; break; }
      }
      if(firstInside === -1) continue;

      const [fx, fy] = cand[firstInside];
      const cx = Math.round(fx), cy = Math.round(fy);
      const checkR = isWide ? 6 : 3;
      let startsOnWater = false;
      for(let ddy = -checkR; ddy <= checkR && !startsOnWater; ddy++){
        for(let ddx = -checkR; ddx <= checkR; ddx++){
          const nx = cx+ddx, ny = cy+ddy;
          if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          if(priorWaterSnapshot[ny*N + nx]){ startsOnWater = true; break; }
        }
      }
      if(startsOnWater) continue;

      return cand;
    }
    return null;
  }

  // ---- Helper: rasterizar un río con radio `rad` hasta el primer merge ----
  function rasterizeRiver(samples, rad){
    const radCeil = Math.ceil(rad) + 2;

    // Detección de merge (donde toca agua previa)
    let mergedAt = -1;
    for(let i = 0; i < samples.length; i++){
      const cx = Math.round(samples[i][0]);
      const cy = Math.round(samples[i][1]);
      if(cx < 0 || cy < 0 || cx >= N || cy >= N) continue;
      if(priorWaterSnapshot[cy*N + cx]){ mergedAt = i; break; }
    }
    const lastSample = mergedAt >= 0 ? mergedAt : samples.length - 1;
    if(lastSample <= 2) return null;

    for(let i = 0; i <= lastSample; i++){
      const cx = Math.round(samples[i][0]);
      const cy = Math.round(samples[i][1]);
      for(let ddy = -radCeil; ddy <= radCeil; ddy++){
        for(let ddx = -radCeil; ddx <= radCeil; ddx++){
          const nx = cx+ddx, ny = cy+ddy;
          if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const d = Math.hypot(ddx, ddy);
          if(d <= rad){
            water[ny*N + nx] = 1;
            h[ny*N + nx] = Math.min(h[ny*N + nx], 0.26 - (rad - d)*0.05);
          } else if(d <= rad + 1.5){
            h[ny*N + nx] = Math.min(h[ny*N + nx], 0.33);
          }
        }
      }
    }
    return samples.slice(0, lastSample + 1);
  }

  // ---- Elegir tipo de sistema de ríos ----
  const systemRoll = Math.random();
  const riverMode = systemRoll < 0.28 ? 'none'
                  : systemRoll < 0.72 ? 'normal'
                  : 'wide';

  if(riverMode !== 'none'){
    const isWide = riverMode === 'wide';
    let riverCount;
    if(isWide){
      // Nivel 2: 1 río casi siempre, 2 excepcional
      riverCount = Math.random() < 0.85 ? 1 : 2;
    } else {
      // Nivel 1: 1-3 según roll
      const r = Math.random();
      riverCount = r < 0.60 ? 1 : (r < 0.90 ? 2 : 3);
    }

    for(let k = 0; k < riverCount; k++){
      priorWaterSnapshot.set(water);
      const samples = buildRiver(isWide);
      if(!samples) continue;

      const rad = isWide ? rnd(3.2, 5.2) : rnd(0.5, 2.2);
      const visibleSamples = rasterizeRiver(samples, rad);
      if(!visibleSamples) continue;

      terr.rivers.push({
        type: riverMode,
        width: rad,
        samples: visibleSamples
      });
    }
  }

    // ---- Lagos (independientes del sistema de ríos) ----
  /*  Tres modos exclusivos:
      - 35% sin lagos
      - 30% lagos pequeños (1 o 2, radio 4.0-9.5)
      - 35% lago enorme (1 solo, radio 12.0-19.5) */
  const lakesRoll = Math.random();
  let lakeMode, lakeCount;
  if(lakesRoll < 0.35){
    lakeMode = 'none'; lakeCount = 0;
  } else if(lakesRoll < 0.65){
    lakeMode = 'small';
    lakeCount = Math.random() < 0.60 ? 1 : 2;
  } else {
    lakeMode = 'huge';
    lakeCount = 1;
  }

  for(let k = 0; k < lakeCount; k++){
    priorWaterSnapshot.set(water);

    const isHuge = (lakeMode === 'huge');
    const rMin = isHuge ? 12.0 : 4.0;
    const rMax = isHuge ? 19.5 : 9.5;
    const lumpMin = isHuge ? 0.18 : 0.15;
    const lumpMax = isHuge ? 0.40 : 0.40;
    const maxAttempts = isHuge ? 40 : 25;

    for(let attempt = 0; attempt < maxAttempts; attempt++){
      const lcx = rnd(N*0.20, N*0.80);
      const lcy = rnd(N*0.20, N*0.80);
      const baseR = rnd(rMin, rMax);
      const lumpiness = rnd(lumpMin, lumpMax);
      const seed1 = Math.random()*100;
      const seed2 = Math.random()*100;

      const checkR = Math.ceil(baseR * (1 + lumpiness)) + 3;
      const cx0 = Math.round(lcx);
      const cy0 = Math.round(lcy);

      // Que quepa dentro del mapa
      if(cx0 - checkR < 1 || cx0 + checkR > N-2) continue;
      if(cy0 - checkR < 1 || cy0 + checkR > N-2) continue;

      // Que no toque agua previa
      let overlaps = false;
      for(let ddy = -checkR; ddy <= checkR && !overlaps; ddy++){
        for(let ddx = -checkR; ddx <= checkR; ddx++){
          const nx = cx0+ddx, ny = cy0+ddy;
          if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          if(priorWaterSnapshot[ny*N + nx]){ overlaps = true; break; }
        }
      }
      if(overlaps) continue;

      // Rasterizar el lago como blob orgánico
      for(let ddy = -checkR; ddy <= checkR; ddy++){
        for(let ddx = -checkR; ddx <= checkR; ddx++){
          const nx = cx0+ddx, ny = cy0+ddy;
          if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const d = Math.hypot(ddx, ddy);
          const ang = Math.atan2(ddy, ddx);
          // Radio modulado por dos senos de frecuencias distintas → forma irregular
          const rMod = 1
            + lumpiness * 0.60 * Math.sin(ang*3 + seed1)
            + lumpiness * 0.40 * Math.sin(ang*5 + seed2);
          const rEdge = baseR * rMod;
          if(d <= rEdge){
            water[ny*N + nx] = 1;
            h[ny*N + nx] = Math.min(h[ny*N + nx], 0.24 - (rEdge - d)*0.03);
          } else if(d <= rEdge + 1.8){
            h[ny*N + nx] = Math.min(h[ny*N + nx], 0.33);
          }
        }
      }

      terr.lakes.push({
        x: lcx/N, y: lcy/N,
        r: baseR/N,
        lumpiness,
        type: lakeMode
      });
      break;
    }
  }

  const rocks = [];
  for(let i=0;i<70;i++){
    const rx = Math.random(), ry = Math.random();
    const xi = Math.floor(rx*N), yi = Math.floor(ry*N);
    if(water[yi*N+xi]) continue;
    if(h[yi*N+xi] < 0.34) continue;
    rocks.push({ x: rx, y: ry, r: rnd(0.004, 0.011), rot: rnd(0,6.28) });
  }

  // ---- Flores decorativas (solo biomas con hasFlowers) ----
  const flowers = [];
  if(currentBiome && currentBiome.hasFlowers){
    for(let i=0;i<160;i++){
      const fx = Math.random(), fy = Math.random();
      const xi = Math.floor(fx*N), yi = Math.floor(fy*N);
      if(water[yi*N+xi]) continue;
      if(h[yi*N+xi] < 0.32) continue;
      const hue = Math.random() < 0.60 ? 'pink'
                : (Math.random() < 0.55 ? 'white' : 'lavender');
      flowers.push({
        x: fx, y: fy,
        r: rnd(0.0035, 0.0075),
        rot: rnd(0,6.28),
        hue
      });
    }
  }
  terr.flowers = flowers;


  const fireflies = [];

  /* =========================================================
     LUCIÉRNAGAS v2
     - Se recolectan TODOS los tiles elegibles (adyacentes a agua)
     - Se barajan para que no se acumulen arriba
     - Modo CLUSTER: aparecen en grupos de 4-14, no uniformes
     - Total: 30 a 320 por partida
     ========================================================= */
  if(currentBiome && currentBiome.hasFireflies === false){
    terr.h = h; terr.water = water; terr.rocks = rocks; terr.fireflies = []; terr.flowers = flowers;
    return;
  }
  const ffTarget   = Math.floor(rnd(30, 320));
  const ffDensity  = rnd(0.06, 0.35);
  const ffRadius   = Math.random() < 0.30 ? 3 : 2;

  // --- 1. Recolectar TODOS los tiles adyacentes a agua ---
  const candidates = [];
  for(let y = 0; y < N; y++){
    for(let x = 0; x < N; x++){
      const i = y*N + x;
      if(water[i]) continue;
      let nearWater = false;
      for(let dy = -ffRadius; dy <= ffRadius && !nearWater; dy++){
        for(let dx = -ffRadius; dx <= ffRadius; dx++){
          const nx = x + dx, ny = y + dy;
          if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          if(water[ny*N + nx]){ nearWater = true; break; }
        }
      }
      if(nearWater){
        // Peso mayor si el agua está a distancia 1 (borde mismo)
        let distMin = Infinity;
        for(let dy = -ffRadius; dy <= ffRadius; dy++){
          for(let dx = -ffRadius; dx <= ffRadius; dx++){
            const nx = x + dx, ny = y + dy;
            if(nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
            if(water[ny*N + nx]){
              const d = Math.hypot(dx, dy);
              if(d < distMin) distMin = d;
            }
          }
        }
        candidates.push({ x, y, distMin });
      }
    }
  }

  // --- 2. Barajar candidatos (Fisher-Yates) ---
  for(let i = candidates.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  // --- 3. Elegir modo: uniforme o clusters ---
  const useClusters = Math.random() < 0.70;   // 70% cluster, 30% uniforme

  if(useClusters && candidates.length > 10){
    // --- Modo CLUSTER: elegir centros y agrupar alrededor ---
    const clusterCount = 3 + Math.floor(Math.random() * 7);   // 3 a 9 clusters
    const clusterCenters = [];

    // Tomamos candidatos distribuidos para elegir centros de cluster
    const step = Math.max(1, Math.floor(candidates.length / clusterCount));
    for(let i = 0; i < candidates.length && clusterCenters.length < clusterCount; i += step){
      clusterCenters.push(candidates[i]);
    }

    // Cada cluster genera entre 4 y 14 luciérnagas alrededor
    for(const center of clusterCenters){
      if(fireflies.length >= ffTarget) break;
      const clusterSize = 4 + Math.floor(Math.random() * 11);   // 4-14
      const clusterRadius = 2 + Math.random() * 3;              // 2-5 tiles

      // Buscar candidatos cercanos al centro
      const nearby = candidates.filter(c => {
        const d = Math.hypot(c.x - center.x, c.y - center.y);
        return d <= clusterRadius;
      });

      // Barajar nearby y tomar hasta clusterSize
      for(let i = nearby.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [nearby[i], nearby[j]] = [nearby[j], nearby[i]];
      }
      for(let k = 0; k < nearby.length && k < clusterSize; k++){
        if(fireflies.length >= ffTarget) break;
        if(Math.random() >= ffDensity) continue;
        const c = nearby[k];
        fireflies.push({
          x: (c.x + rnd(-0.6, 0.6)) / N,
          y: (c.y + rnd(-0.6, 0.6)) / N,
          phase: rnd(0, 6.28),
          spd:   rnd(0.4, 1.2),
          ax:    rnd(0.004, 0.012),
          ay:    rnd(0.004, 0.012),
          t:     rnd(0, 100)
        });
      }
    }

    // Si tras los clusters no llegamos al target, rellenar uniformemente
    if(fireflies.length < ffTarget){
      for(const c of candidates){
        if(fireflies.length >= ffTarget) break;
        if(Math.random() >= ffDensity * 0.5) continue;
        fireflies.push({
          x: (c.x + rnd(-0.6, 0.6)) / N,
          y: (c.y + rnd(-0.6, 0.6)) / N,
          phase: rnd(0, 6.28),
          spd:   rnd(0.4, 1.2),
          ax:    rnd(0.004, 0.012),
          ay:    rnd(0.004, 0.012),
          t:     rnd(0, 100)
        });
      }
    }
  } else {
    // --- Modo UNIFORME: barajar y tomar hasta ffTarget ---
    for(const c of candidates){
      if(fireflies.length >= ffTarget) break;
      if(Math.random() >= ffDensity) continue;
      fireflies.push({
        x: (c.x + rnd(-0.6, 0.6)) / N,
        y: (c.y + rnd(-0.6, 0.6)) / N,
        phase: rnd(0, 6.28),
        spd:   rnd(0.4, 1.2),
        ax:    rnd(0.004, 0.012),
        ay:    rnd(0.004, 0.012),
        t:     rnd(0, 100)
      });
    }
  }

  terr.h = h; terr.water = water; terr.rocks = rocks; terr.fireflies = fireflies; terr.flowers = flowers;
}
function renderTerrain(W, H){
  const N = TERR_N;
  const oc = document.createElement('canvas');
  oc.width = Math.max(1, Math.floor(W));
  oc.height = Math.max(1, Math.floor(H));
  const o = oc.getContext('2d');
  const cw = oc.width / N, ch = oc.height / N;
  const h = terr.h, water = terr.water;
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const i = y*N + x;
      const hh = h[i];
      const hL = h[y*N + Math.max(0, x-1)];
      const hU = h[Math.max(0,y-1)*N + x];
      let lit = clamp(0.76 + (hL-hh)*8.5 + (hU-hh)*6.5, 0.40, 1.5);
      let r,g,b;
      const W_ = currentBiome.water;
      if(water[i]){
        const wave = Math.sin(x*0.7 + y*0.45 + terr.seed)*0.5 + 0.5;
        r = W_.r + wave*W_.wr;
        g = W_.g + wave*W_.wg;
        b = W_.b + wave*W_.wb;
        lit = W_.mode === 'lava' ? (1.05 + wave*0.15)
            : W_.mode === 'ice'  ? (1.02 + wave*0.08)
            :                      (0.92 + wave*0.10);
      } else {
        const bands = currentBiome.terrainBands;
        let band = bands[bands.length-1];
        for(const B of bands){ if(hh < B.max){ band = B; break; } }
        r = band.r; g = band.g; b = band.b;
      }
      const n = (hash2(x,y,terr.seed) - 0.5) * 14;
      r = clamp(r*lit + n, 0, 255)|0; g = clamp(g*lit + n, 0, 255)|0; b = clamp(b*lit + n, 0, 255)|0;
      o.fillStyle = `rgb(${r},${g},${b})`;
      const px = Math.floor(x*cw), py = Math.floor(y*ch);
      o.fillRect(px, py, Math.ceil(cw)+1, Math.ceil(ch)+1);

      if(water[i] && currentBiome.id === 'cute' && hash2(x, y, terr.seed + 99) > 0.94){
        o.fillStyle = 'rgba(255,255,255,0.60)';
        const s = Math.max(1, cw*0.35);
        o.fillRect(px + cw*0.30, py + ch*0.30, s, s);
      }
      
      if(!water[i] && (hL - hh) > 0.035){
        o.fillStyle = 'rgba(0,0,0,0.22)';
        o.fillRect(px, py, Math.max(1, cw*0.35), Math.ceil(ch)+1);
      }
    }
  }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i = y*N+x;
    if(water[i]) continue;
    let adj = false;
    if(x>0 && water[i-1]) adj = true;
    if(x<N-1 && water[i+1]) adj = true;
    if(y>0 && water[i-N]) adj = true;
    if(y<N-1 && water[i+N]) adj = true;
    if(adj){
      o.fillStyle = 'rgba(200,225,240,0.16)';
      o.fillRect(Math.floor(x*cw), Math.floor(y*ch), Math.ceil(cw)+1, Math.ceil(ch)+1);
    }
  }
  for(const rk of terr.rocks){
    const px = rk.x * oc.width, py = rk.y * oc.height, rr = rk.r * oc.width;
    const R = currentBiome.rock;
    o.fillStyle = R.shadow;
    o.beginPath(); o.ellipse(px, py + rr*0.55, rr*1.05, rr*0.42, 0, 0, 6.2832); o.fill();
    o.fillStyle = R.base;
    o.beginPath(); o.ellipse(px, py, rr, rr*0.78, rk.rot, 0, 6.2832); o.fill();
    o.fillStyle = R.light;
    o.beginPath(); o.ellipse(px - rr*0.22, py - rr*0.28, rr*0.62, rr*0.44, rk.rot, 0, 6.2832); o.fill();
    o.fillStyle = R.hi;
    o.beginPath(); o.ellipse(px - rr*0.32, py - rr*0.42, rr*0.30, rr*0.20, rk.rot, 0, 6.2832); o.fill();
  }

  // ---- Flores ----
  if(terr.flowers && terr.flowers.length){
    const PETAL_COLORS = {
      pink:     ['#ffb8d8', '#ffcfe6'],
      white:    ['#ffffff', '#fff4fa'],
      lavender: ['#ddc0ff', '#ecd8ff']
    };
    for(const fl of terr.flowers){
      const px = fl.x * oc.width, py = fl.y * oc.height, rr = fl.r * oc.width;
      const cols = PETAL_COLORS[fl.hue] || PETAL_COLORS.pink;
      // Sombra suave debajo
      o.fillStyle = 'rgba(120,80,110,0.14)';
      o.beginPath(); o.ellipse(px, py + rr*0.5, rr*1.15, rr*0.40, 0, 0, 6.2832); o.fill();
      // 5 pétalos
      for(let p=0;p<5;p++){
        const a = fl.rot + p * Math.PI * 2 / 5;
        const petX = px + Math.cos(a) * rr * 0.55;
        const petY = py + Math.sin(a) * rr * 0.55;
        o.fillStyle = cols[0];
        o.beginPath(); o.ellipse(petX, petY, rr*0.58, rr*0.42, a, 0, 6.2832); o.fill();
        // Brillo superior del pétalo
        o.fillStyle = cols[1];
        o.beginPath(); o.ellipse(petX - rr*0.10, petY - rr*0.10, rr*0.26, rr*0.16, a, 0, 6.2832); o.fill();
      }
      // Centro amarillo con destello
      o.fillStyle = '#ffe070';
      o.beginPath(); o.arc(px, py, rr*0.34, 0, 6.2832); o.fill();
      o.fillStyle = 'rgba(255,255,255,0.75)';
      o.beginPath(); o.arc(px - rr*0.10, py - rr*0.10, rr*0.14, 0, 6.2832); o.fill();
    }
  }

  const step = oc.width / 8;
  o.strokeStyle = 'rgba(255,240,205,0.05)';
  o.lineWidth = Math.max(1, oc.width/500);
  for(let i=0;i<=8;i++){
    o.beginPath(); o.moveTo(i*step, 0); o.lineTo(i*step, oc.height); o.stroke();
    o.beginPath(); o.moveTo(0, i*step); o.lineTo(oc.width, i*step); o.stroke();
  }
  o.fillStyle = 'rgba(255,255,255,0.022)';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if((r+c)%2===0) continue;
    o.fillRect(c*step, r*step, step, step);
  }
  o.strokeStyle = 'rgba(255,225,160,0.20)';
  o.lineWidth = Math.max(1.5, oc.width/260);
  o.strokeRect(o.lineWidth/2, o.lineWidth/2, oc.width - o.lineWidth, oc.height - o.lineWidth);
  terrainOffscreen = oc;
}

/* =========================================================
   CLIMA / DÍA-NOCHE
   ========================================================= */
const PHASES = [
  { t:0.00, tint:[255,185,125], a:0.14, dark:0.05 },
  { t:0.25, tint:[255,245,200], a:0.04, dark:0.00 },
  { t:0.50, tint:[255,150,90],  a:0.20, dark:0.10 },
  { t:0.75, tint:[120,140,190], a:0.32, dark:0.14 },
  { t:1.00, tint:[255,185,125], a:0.14, dark:0.05 }
];
const CYCLE_SECONDS = 150;
let worldTime = Math.random() * CYCLE_SECONDS;
function getPhase(){
  const t = (worldTime % CYCLE_SECONDS) / CYCLE_SECONDS;
  let i = 0;
  for(let k=0;k<PHASES.length-1;k++){
    if(t >= PHASES[k].t && t <= PHASES[k+1].t){ i = k; break; }
  }
  const A = PHASES[i], B = PHASES[i+1];
  const span = (B.t - A.t) || 1;
  const f = (t - A.t) / span;
  return {
    tint: [lerp(A.tint[0],B.tint[0],f), lerp(A.tint[1],B.tint[1],f), lerp(A.tint[2],B.tint[2],f)],
    a: lerp(A.a, B.a, f), dark: lerp(A.dark, B.dark, f)
  };
}

let rainAmt = 0, rainTarget = 0, rainTimer = 0;

const rainDrops = [];

for(let i=0;i<1000;i++) rainDrops.push({
